# === Actuator (Monitoring) ===
# M\u00e1\u00ba\u00b7c \u00c4\u0091\u00e1\u00bb\u008bnh ch\u00e1\u00bb\u0089 l\u00e1\u00bb\u0099 health v\u00e1\u00bb\u009bi show-details=never (kh\u00c3\u00b4ng ti\u00e1\u00ba\u00bft l\u00e1\u00bb\u0099 th\u00c3\u00b4ng tin DB).
# Profile local m\u00e1\u00bb\u009f r\u00e1\u00bb\u0099ng endpoints trong application-local.properties.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# === Swagger/OpenAPI (springdoc) ===
# M\u00e1\u00ba\u00b7c \u00c4\u0091\u00e1\u00bb\u008bnh T\u00e1\u00ba\u00aeT \u00e1\u00bb\u009f m\u00e1\u00bb\u008di m\u00c3\u00b4i tr\u00c6\u00b0\u00e1\u00bb\u009dng; profile local b\u00e1\u00ba\u00adt l\u00e1\u00ba\u00a1i trong application-local.properties.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
