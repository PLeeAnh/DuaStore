spring.application.name=DuaStore
spring.profiles.active=local
spring.config.import=optional:classpath:application-secrets.properties
# === SQL Server ===
# Mật khẩu/username DB bắt buộc qua env DB_USERNAME/DB_PASSWORD.
# Không có default "sa/123" để tránh deploy thiếu cấu hình vẫn chạy với credential mặc định.
# Profile local override giá trị này trong application-local.properties.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DuaStore;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
# DB duy nhat duoc tao tu src/main/resources/db/DuaStore_Database.sql.
# App chi VALIDATE schema; neu lech voi entity model se loi ngay khi khoi dong.
spring.jpa.open-in-view=true
spring.cache.type=simple
# Hibernate auto-detects dialect from JDBC driver; do not set manually
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# === SQL Logging (dev only) ===
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

# === Locale ===
spring.web.locale=vi_VN
# === Encoding ===
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.web.resources.charset=UTF-8
# === Thymeleaf ===
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# === Upload ===
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/
# === Store Location ===
store.latitude=20.856493022930007
store.longitude=106.67564041059246
# === Google OAuth2 ===
# Client ID / Secret lấy từ application-secrets.properties (hoặc env GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET)
# Tạo OAuth credentials tại https://console.cloud.google.com/ -> APIs & Services -> Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=email,profile
# === GMAIL SMTP ===
# spring.mail.username/password lấy từ application-secrets.properties (hoặc env SMTP_USERNAME/SMTP_PASSWORD)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# === Payment (account details in application-secrets.properties) ===
payment.bank.code=${BANK_CODE:TCB}
payment.bank.account.number=${BANK_ACCOUNT_NUMBER:19076525108012}
payment.bank.account.name=${BANK_ACCOUNT_NAME:Nguyen Huy Dung}
# === App URL ===
app.url=${APP_URL:http://localhost:8080}
# === Server ===
server.tomcat.connection-timeout=20000
spring.devtools.restart.enabled=false
# === Security ===
# Key remember-me bắt buộc qua env; không dùng default công khai ở môi trường khác local.
duastore.remember-me.key=${REMEMBER_ME_KEY}
# === Sepay ===
sepay.merchant-id=${SEPAY_MERCHANT_ID:}
sepay.secret-key=${SEPAY_SECRET_KEY:}
# === Homepage ===
homepage.categories.limit=7

# === Actuator (Monitoring) ===
# Mặc định chỉ lộ health với show-details=never (không tiết lộ thông tin DB).
# Profile local mở rộng endpoints trong application-local.properties.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# === Swagger/OpenAPI (springdoc) ===
# Mặc định TẮT ở mọi môi trường; profile local bật lại trong application-local.properties.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
