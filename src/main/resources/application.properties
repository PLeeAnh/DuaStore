spring.application.name=DuaStore
spring.profiles.active=local
spring.config.import=optional:classpath:application-secrets.properties
# === SQL Server ===
# M\u00e1\u00ba\u00adt kh\u00e1\u00ba\u00a9u/username DB b\u00e1\u00ba\u00aft bu\u00e1\u00bb\u0099c qua env DB_USERNAME/DB_PASSWORD.
# Kh\u00c3\u00b4ng c\u00c3\u00b3 default "sa/123" \u00c4\u0091\u00e1\u00bb\u0083 tr\u00c3\u00a1nh deploy thi\u00e1\u00ba\u00bfu c\u00e1\u00ba\u00a5u h\u00c3\u00acnh v\u00e1\u00ba\u00abn ch\u00e1\u00ba\u00a1y v\u00e1\u00bb\u009bi credential m\u00e1\u00ba\u00b7c \u00c4\u0091\u00e1\u00bb\u008bnh.
# Profile local override gi\u00c3\u00a1 tr\u00e1\u00bb\u008b n\u00c3\u00a0y trong application-local.properties.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DuaStore;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
# DB duy nhat duoc tao tu src/main/resources/db/DuaStore_Database.sql.
# App chi VALIDATE schema; neu lech voi entity model se loi ngay khi khoi dong.
spring.jpa.open-in-view=true
spring.cache.type=simple
# Hibernate auto-detects dialect from JDBC driver; do not set manually
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# === SQL Logging (dev only) ===
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

# === Locale ===
spring.web.locale=vi_VN
# === Encoding ===
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.web.resources.charset=UTF-8
# === Thymeleaf ===
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# === Upload ===
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/
