<div th:fragment="stepper(activeStep)" class="ds-stepper-wrap" xmlns:th="http://www.thymeleaf.org">
    <style>
        .ds-stepper-wrap{background:#fff;border-bottom:1px solid #eef1f2;padding:22px 16px 20px;margin-bottom:24px;}
        .ds-stepper{display:flex;align-items:flex-start;justify-content:center;max-width:460px;margin:0 auto;}
        .ds-stepper-step{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:108px;}
        .ds-stepper-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:.95rem;font-weight:700;border:2px solid #dbe4e6;background:#fff;color:#8298a1;flex-shrink:0;
            transition:all .2s ease;}
        .ds-stepper-label{margin-top:8px;font-size:.82rem;color:#8298a1;text-align:center;white-space:nowrap;}
        .ds-stepper-line{flex:1 1 auto;height:2px;background:#dbe4e6;margin-top:18px;min-width:28px;}
        .ds-stepper-step.done .ds-stepper-circle{background:#0d6efd;border-color:#0d6efd;color:#fff;}
        .ds-stepper-step.done .ds-stepper-label{color:#152229;font-weight:600;}
        .ds-stepper-step.active .ds-stepper-circle{border-color:#0d6efd;color:#0d6efd;box-shadow:0 0 0 4px rgba(13,110,253,.12);}
        .ds-stepper-step.active .ds-stepper-label{color:#0d6efd;font-weight:700;}
        .ds-stepper-line.done{background:#0d6efd;}
    </style>

    <div class="ds-stepper">
        <div class="ds-stepper-step" th:classappend="${activeStep > 1} ? 'done' : (${activeStep == 1} ? 'active' : '')">
            <span class="ds-stepper-circle"><i th:if="${activeStep > 1}" class="bi bi-check-lg"></i><span th:unless="${activeStep > 1}">1</span></span>
            <span class="ds-stepper-label">Giỏ hàng</span>
        </div>
        <div class="ds-stepper-line" th:classappend="${activeStep > 1} ? 'done' : ''"></div>

        <div class="ds-stepper-step" th:classappend="${activeStep > 2} ? 'done' : (${activeStep == 2} ? 'active' : '')">
            <span class="ds-stepper-circle"><i th:if="${activeStep > 2}" class="bi bi-check-lg"></i><span th:unless="${activeStep > 2}">2</span></span>
            <span class="ds-stepper-label">Thanh toán</span>
        </div>
        <div class="ds-stepper-line" th:classappend="${activeStep > 2} ? 'done' : ''"></div>

        <div class="ds-stepper-step" th:classappend="${activeStep == 3} ? 'active' : ''">
            <span class="ds-stepper-circle">3</span>
            <span class="ds-stepper-label">Hoàn tất</span>
        </div>
    </div>
</div>
