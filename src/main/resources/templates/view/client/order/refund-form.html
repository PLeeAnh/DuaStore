<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head><title>Yêu cầu hoàn tiền — DuaStore</title></head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-4" style="max-width:600px;">
            <a th:href="@{'/tai-khoan/don-hang/' + ${order.id}}" class="text-decoration-none text-muted mb-3 d-inline-block">
                <i class="bi bi-arrow-left"></i> Quay lại đơn hàng
            </a>

            <div class="ds-card p-4">
                <h5 class="fw-bold mb-1">Yêu cầu hoàn tiền</h5>
                <p class="text-muted small mb-4">Mã đơn: <strong th:text="${order.maDon}"></strong> — <span th:text="${#numbers.formatDecimal(order.tongThanhToan, 0, 0)} + '₫'"></span></p>

                <form th:action="@{'/tai-khoan/don-hang/hoan-tien/' + ${order.id}}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Lý do hoàn tiền <span class="text-danger">*</span></label>
                        <textarea name="lydo" class="form-control" rows="4" required placeholder="Vui lòng mô tả lý do bạn muốn hoàn tiền..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số tiền yêu cầu <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="number" name="soTienHoan" class="form-control" required
                                   th:value="${#numbers.formatDecimal(order.tongThanhToan, 0, 0)}"
                                   th:attr="max=${order.tongThanhToan}" step="1000" min="0"/>
                            <span class="input-group-text">₫</span>
                        </div>
                        <div class="form-text">Tối đa <strong th:text="${#numbers.formatDecimal(order.tongThanhToan, 0, 0)} + '₫'"></strong></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phương thức nhận tiền <span class="text-danger">*</span></label>
                        <select name="phuongThucHoan" class="form-select" required>
                            <option value="CHUYEN_KHOAN">Chuyển khoản ngân hàng</option>
                            <option value="TIEN_MAT">Tiền mặt</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Ảnh minh chứng (tùy chọn)</label>
                        <input type="file" name="anhMinhChung" class="form-control" accept="image/*"/>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 fw-semibold py-2">Gửi yêu cầu</button>
                </form>
            </div>
        </div>
    </div>
    </body>
</html>
