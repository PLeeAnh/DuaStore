<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Thanh toán chuyển khoản — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="ds-section-card">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-8 col-lg-6">
                            <div class="ds-card">
                                <div class="ds-card-body text-center">

                                    <div class="mb-4">
                                        <div class="bg-success bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                                            <i class="bi bi-bank text-success fs-2"></i>
                                        </div>
                                        <h4 class="fw-bold">Quét mã QR để thanh toán</h4>
                                        <p class="text-muted small">Vui lòng chuyển khoản đúng số tiền bên dưới</p>
                                    </div>

                                    <div class="mb-4">
                                        <img th:src="${qrUrl}" alt="QR thanh toán"
                                             class="img-fluid rounded-3 border"
                                             style="max-width:280px;width:100%" />
                                    </div>

                                    <div class="bg-light rounded-3 p-3 mb-4 text-start">
                                        <div class="d-flex justify-content-between small mb-2">
                                            <span class="text-muted">Ngân hàng</span>
                                            <span class="fw-medium" th:text="${bankName}">Techcombank</span>
                                        </div>
                                        <div class="d-flex justify-content-between small mb-2">
                                            <span class="text-muted">Số tài khoản</span>
                                            <span class="fw-medium" th:text="${accountNumber}"></span>
                                        </div>
                                        <div class="d-flex justify-content-between small mb-2">
                                            <span class="text-muted">Chủ tài khoản</span>
                                            <span class="fw-medium" th:text="${accountName}"></span>
                                        </div>
                                        <div class="d-flex justify-content-between small mb-2">
                                            <span class="text-muted">Mã đơn</span>
                                            <span class="fw-medium" th:text="${order.maDon}"></span>
                                        </div>
                                        <div class="d-flex justify-content-between small">
                                            <span class="text-muted">Số tiền</span>
                                            <span class="fw-bold text-danger fs-5" th:text="${#numbers.formatDecimal(order.tongThanhToan, 0, 0)} + '₫'"></span>
                                        </div>
                                    </div>

                                    <div id="countdown-box" class="alert alert-info small py-2 mb-3">
                                        <i class="bi bi-clock me-1"></i>
                                        Vui lòng thanh toán trong <strong id="countdown-timer">60:00</strong>
                                    </div>

                                    <div class="mt-3">

                                    <div class="mt-3">
                                        <a th:href="@{/}" class="text-muted small">Quay lại trang chủ</a>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            (function () {
                var orderId = document.getElementById('btn-confirm').getAttribute('data-order-id');
                var pollInterval = null;
                var countdownSeconds = 60 * 60;  // 60 phut

                // ── Countdown Timer ──────────────────────────
                var timerEl = document.getElementById('countdown-timer');
                function updateCountdown() {
                    if (countdownSeconds <= 0) {
                        timerEl.textContent = '00:00';
                        if (typeof DuaStore !== 'undefined' && DuaStore.toast) { DuaStore.toast.error('Phiên thanh toán đã hết hạn. Vui lòng quay lại giỏ hàng.'); }
                        document.getElementById('btn-confirm').disabled = true;
                        stopPolling();
                        return;
                    }
                    var m = Math.floor(countdownSeconds / 60);
                    var s = countdownSeconds % 60;
                    timerEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                    countdownSeconds--;
                }
                setInterval(updateCountdown, 1000);

                // ── Polling: auto-check payment status ───────
                function startPolling() {
                    pollInterval = setInterval(function () {
                        fetch('/checkout/api/check-payment-status/' + orderId)
                            .then(function (resp) { return resp.json(); })
                            .then(function (data) {
                                if (data.paid && data.redirectUrl) {
                                    stopPolling();
                                    if (typeof DuaStore !== 'undefined' && DuaStore.toast) { DuaStore.toast.success('Đã nhận được thanh toán! Đang chuyển trang...'); }
                                    setTimeout(function () {
                                        window.location.href = data.redirectUrl;
                                    }, 1000);
                                }
                            })
                            .catch(function () {});
                    }, 10000);
                }

                function stopPolling() {
                    if (pollInterval) {
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                }

                startPolling();
            })();
        </script>
    </body>
</html>
