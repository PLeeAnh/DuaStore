<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quên mật khẩu — DuaStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="ds-auth-page-body">
    <div class="ds-auth-wrapper">
        <a th:href="@{/}" class="ds-auth-logo">DuaStore</a>
        <div class="ds-card">
            <div class="ds-card-body">
                <div class="ds-auth-title">Quên mật khẩu</div>
                <div class="ds-auth-sub">Nhập email để nhận hướng dẫn đặt lại mật khẩu</div>

                <div th:if="${successMsg}" class="alert alert-success mb-3 py-2">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
                </div>

                <form th:action="@{/quen-mat-khau}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="email@example.com" required/>
                    </div>
                    <button type="submit" class="ds-btn ds-btn-fill w-100" style="justify-content:center;">Gửi yêu cầu</button>
                </form>

                <div class="text-center mt-4" style="font-size:0.85rem;color:var(--ds-gray-500);">
                    <a th:href="@{/dang-nhap}" class="ds-auth-page-link">Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
