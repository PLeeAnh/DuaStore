<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý bài viết</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Bài viết</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-file-text"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h4>Bài viết</h4>
                            <div class="adm-detail-meta">Quản lý tất cả bài viết trong cửa hàng.</div>
                        </div>
                        <a th:href="@{/admin/bai-viet/them-moi}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Thêm mới
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═════ TABS ═════ -->
        <div class="adm-tab-nav">
            <a class="adm-tab active">
                <i class="bi bi-file-text"></i>Bài viết
            </a>
            <a class="adm-tab" th:if="${userPermissions.contains('POST_CATEGORY_READ')}" th:href="@{/admin/danh-muc-bai-viet}">
                <i class="bi bi-folder"></i>Danh mục bài viết
            </a>
        </div>

        <div class="rv-stat-grid">
            <div class="rv-stat">
                <div class="rv-stat-label">Tổng bài viết</div>
                <div class="rv-stat-value" th:text="${totalItems}">0</div>
            </div>
        </div>

        <div class="pd-toolbar-wrap">
            <div class="pd-toolbar-form">
                <div class="rv-search" style="flex:0 0 220px">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchKeyword" placeholder="Tìm tiêu đề..." />
                </div>
                <select id="filterStatus" class="form-select form-select-sm searchable-select adm-filter-select" placeholder="Tìm trạng thái..." data-autosubmit>
                    <option value="">Tất cả trạng thái</option>
                    <option value="XUAT_BAN">Xuất bản</option>
                    <option value="NHAP">Nháp</option>
                    <option value="AN">Ẩn</option>
                    <option value="DA_XOA">Đã xóa</option>
                </select>
            </div>
        </div>

        <div class="adm-table-wrap">
            <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ảnh</th>
                        <th>Tiêu đề</th>
                        <th>Danh mục</th>
                        <th>Tác giả</th>
                        <th>Trạng thái</th>
                        <th>Nổi bật</th>
                        <th>Lượt xem</th>
                        <th>Ngày đăng</th>
                        <th class="text-center adm-kebab-col" style="width:64px"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p, iter : ${posts}">
                        <td th:text="${iter.index + 1 + currentPage * pageSize}"></td>
                        <td>
                            <img th:if="${p.hinhAnh != null}"
                                 th:src="@{${p.hinhAnh}}" alt=""
                                 style="width:50px;height:50px;object-fit:cover;border-radius:4px;"
                                 onerror="this.style.display='none'" />
                            <span th:unless="${p.hinhAnh != null}" class="text-muted">—</span>
                        </td>
                        <td class="adm-cell-text">
                            <span th:text="${p.tieuDe}"></span>
                        </td>
                        <td th:text="${p.danhMuc != null ? p.danhMuc.tenDanhMuc : '—'}"></td>
                        <td th:text="${tacGiaMap.get(p.tacGiaId) != null ? tacGiaMap.get(p.tacGiaId) : '—'}"></td>
                        <td>
                            <span th:if="${p.trangThai == 'XUAT_BAN'}" class="status-pill status-XUAT_BAN">Xuất bản</span>
                            <span th:if="${p.trangThai == 'NHAP'}" class="status-pill status-NHAP">Nháp</span>
                            <span th:if="${p.trangThai == 'AN'}" class="status-pill status-AN">Ẩn</span>
                            <span th:if="${p.trangThai == 'DA_XOA'}" class="status-pill status-AN">Đã xóa</span>
                        </td>
                        <td>
                            <span th:if="${p.featured}" class="text-success"><i class="bi bi-star-fill"></i></span>
                            <span th:unless="${p.featured}" class="text-muted">—</span>
                        </td>
                        <td th:text="${p.luotXem}"></td>
                        <td th:text="${#temporals.format(p.ngayTao, 'dd/MM/yyyy')}"></td>
                        <td class="text-center">
                            <div class="dropdown">
                                <button class="adm-kebab-btn" data-bs-toggle="dropdown" aria-label="Thao tác">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end adm-kebab-menu">
                                    <li th:if="${p.trangThai == 'XUAT_BAN'}">
                                        <a class="dropdown-item" target="_blank" th:href="@{/blog/{s}(s=${p.slug != null ? p.slug : p.id})}"><i class="bi bi-box-arrow-up-right"></i>Xem trên web</a>
                                    </li>
                                    <li><a class="dropdown-item" th:href="@{/admin/bai-viet/sua/{id}(id=${p.id})}"><i class="bi bi-pencil"></i>Sửa</a></li>
                                    <li th:if="${p.trangThai != 'DA_XOA'}"><hr class="dropdown-divider"></li>
                                    <li th:if="${p.trangThai != 'DA_XOA'}">
                                        <form th:action="@{/admin/bai-viet/xoa/{id}(id=${p.id})}" method="post" class="d-block">
                                            <button type="submit" class="dropdown-item text-danger" data-confirm="Xóa bài viết này? (có thể khôi phục từ bộ lọc &quot;Đã xóa&quot;)"><i class="bi bi-trash"></i>Xóa</button>
                                        </form>
                                    </li>
                                    <li th:if="${p.trangThai == 'DA_XOA'}"><hr class="dropdown-divider"></li>
                                    <li th:if="${p.trangThai == 'DA_XOA'}">
                                        <form th:action="@{/admin/bai-viet/xoa-vinh-vien/{id}(id=${p.id})}" method="post" class="d-block">
                                            <button type="submit" class="dropdown-item text-danger" data-confirm="Xóa VĨNH VIỄN bài viết này? Hành động này không thể hoàn tác!"><i class="bi bi-trash-fill"></i>Xóa vĩnh viễn</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(posts)}">
                        <td colspan="10" class="text-muted text-center py-4">Chưa có dữ liệu</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
        <th:block th:replace="~{view/admin/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${entityLabel}, ${url}, ${filterParams})}" />
    </div>
    <th:block layout:fragment="extra-script">
        <script th:src="@{/js/admin-filters.js}"></script>
    </th:block>
</body>
</html>
