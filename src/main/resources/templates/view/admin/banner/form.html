<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
<head>
    <title>Thông tin banner</title>
</head>
<body>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item"><a th:href="@{/admin/banner}">Banner</a></li>
    <li class="breadcrumb-item active" th:text="${banner.id == null ? 'Thêm mới' : 'Chỉnh sửa'}"></li>
</th:block>
<div layout:fragment="content">
    <div class="adm-page-header">
        <h4>
            <i class="bi bi-image me-2"></i>
            <span th:text="${banner.id == null ? 'Thêm banner' : 'Chỉnh sửa banner'}"></span>
        </h4>
    </div>

    <div class="adm-form-wrap">
        <form th:action="@{${formAction}}" th:object="${banner}" method="post" data-dirty-bar
              enctype="multipart/form-data" class="row g-3">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{imageUrl}"/>

            <div th:if="${#fields.hasGlobalErrors()}" class="col-12">
                <div class="alert alert-danger mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            </div>

            <div class="col-md-8">
                <label class="form-label">Tiêu đề <span class="text-danger">*</span></label>
                <input type="text" th:field="*{title}" class="form-control" maxlength="200" required/>
                <div th:errors="*{title}" class="text-danger small"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Thứ tự hiển thị <span class="text-danger">*</span></label>
                <input type="number" th:field="*{displayOrder}" class="form-control" min="0" max="100000" required/>
                <div th:errors="*{displayOrder}" class="text-danger small"></div>
            </div>

            <div class="col-12">
                <label class="form-label">Ảnh banner <span th:if="${banner.id == null}" class="text-danger">*</span></label>
                <input type="file" th:field="*{imageFile}" class="form-control"
                       accept="image/jpeg,image/png,image/webp,image/gif" th:required="${banner.id == null}"/>
                <div class="form-text">JPEG, PNG, WebP hoặc GIF; tối đa 5MB. Khuyến nghị tỷ lệ ảnh khoảng 3:1.</div>
                <div th:errors="*{imageFile}" class="text-danger small"></div>
                <div th:if="${banner.imageUrl != null}" class="mt-3">
                    <img id="bannerPreview" th:src="@{${banner.imageUrl}}" alt="Ảnh banner hiện tại"
                         style="width:min(100%,640px);aspect-ratio:3/1;object-fit:cover;border-radius:10px"
                         onerror="this.onerror=null;this.src='/images/no-image.png'"/>
                    <small class="text-muted d-block mt-1">Nếu không chọn ảnh mới, hệ thống sẽ giữ ảnh hiện tại.</small>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label">Link khi click</label>
                <input type="text" th:field="*{linkUrl}" class="form-control" maxlength="1000"
                       placeholder="/san-pham hoặc https://example.com"/>
                <div class="form-text">Để trống nếu banner không cần chuyển hướng.</div>
                <div th:errors="*{linkUrl}" class="text-danger small"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Bắt đầu hiển thị</label>
                <input type="datetime-local" th:field="*{startDate}" class="form-control"/>
            </div>
            <div class="col-md-6">
                <label class="form-label">Kết thúc hiển thị</label>
                <input type="datetime-local" th:field="*{endDate}" class="form-control"/>
            </div>
            <div th:if="${#fields.hasErrors('displayPeriodValid')}" class="col-12 text-danger small"
                 th:errors="*{displayPeriodValid}"></div>

            <div class="col-12">
                <label class="form-label">Mô tả ngắn</label>
                <textarea th:field="*{description}" class="form-control" rows="3" maxlength="500"></textarea>
                <div th:errors="*{description}" class="text-danger small"></div>
            </div>

            <div class="col-12">
                <div class="form-check form-switch">
                    <input type="checkbox" th:field="*{active}" class="form-check-input" role="switch"/>
                    <label class="form-check-label" for="active">Đang kích hoạt</label>
                </div>
                <small class="text-muted">Banner chỉ xuất hiện ngoài trang chủ khi được kích hoạt và nằm trong thời gian hợp lệ.</small>
            </div>

            <div class="col-12 pt-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu banner</button>
                <a th:href="@{/admin/banner}" class="btn btn-secondary">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
