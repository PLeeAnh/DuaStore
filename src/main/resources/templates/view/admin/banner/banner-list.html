<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
<head><title>Quản lý banner</title></head>
<body>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item active">Banner trang chủ</li>
</th:block>
<div layout:fragment="content">
    <div class="adm-detail-hero">
        <div class="d-flex align-items-start gap-3">
            <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                <i class="bi bi-images"></i>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h4>Banner trang chủ</h4>
                        <div class="adm-detail-meta">Banner hoạt động hiển thị theo thứ tự từ nhỏ đến lớn.</div>
                    </div>
                    <a th:if="${userPermissions.contains('BANNER_CREATE')}" th:href="@{/admin/banner/them-moi}"
                       class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Thêm banner</a>
                </div>
            </div>
        </div>
    </div>
    <div class="adm-table-wrap">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th style="width:72px">Thứ tự</th>
                <th style="width:220px">Hình ảnh</th>
                <th>Nội dung</th>
                <th>Liên kết</th>
                <th>Trạng thái</th>
                <th class="text-end">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${banners}">
                <td class="fw-semibold text-center" th:text="${b.thuTu}">0</td>
                <td><div style="max-width:200px;max-height:80px;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb">
                    <img th:src="${b.hinhAnh}" th:alt="${b.tieuDe}" onerror="this.src='/images/no-image.png'"
                         style="width:100%;height:100%;object-fit:cover;display:block">
                </div></td>
                <td>
                    <div class="fw-semibold" th:text="${b.tieuDe}"></div>
                    <small class="text-muted" th:if="${b.moTa}" th:text="${#strings.abbreviate(b.moTa, 90)}"></small>
                </td>
                <td><a th:if="${b.lienKet}" th:href="${b.lienKet}" target="_blank" class="small text-break"
                       th:text="${#strings.abbreviate(b.lienKet, 45)}"></a></td>
                <td><span th:if="${b.isActive}" class="status-pill status-DANG_HIEN_THI">Đang hiển thị</span><span
                        th:unless="${b.isActive}" class="status-pill status-AN">Đang ẩn</span></td>
                <td class="text-end text-nowrap">
                    <form th:if="${userPermissions.contains('BANNER_UPDATE')}"
                          th:action="@{/admin/banner/doi-trang-thai/{id}(id=${b.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-secondary" type="submit"
                                th:title="${b.isActive ? 'Ẩn banner' : 'Hiển thị banner'}"><i
                                th:class="${b.isActive ? 'bi bi-eye-slash' : 'bi bi-eye'}"></i></button>
                    </form>
                    <a th:if="${userPermissions.contains('BANNER_UPDATE')}"
                       th:href="@{/admin/banner/sua/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary"
                       title="Chỉnh sửa"><i class="bi bi-pencil"></i></a>
                    <form th:if="${userPermissions.contains('BANNER_DELETE')}"
                          th:action="@{/admin/banner/xoa/{id}(id=${b.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Xóa banner này?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa"><i
                                class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(banners)}">
                <td colspan="6" class="text-center text-muted py-5"><i class="bi bi-image d-block fs-2 mb-2"></i>Chưa có
                    banner nào
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
