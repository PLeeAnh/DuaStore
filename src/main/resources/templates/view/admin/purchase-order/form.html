<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Tạo phiếu nhập hàng</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/nhap-hang}">Nhập hàng</a></li>
        <li class="breadcrumb-item active" aria-current="page">Tạo mới</li>
    </th:block>
    <div layout:fragment="content">

        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-plus-circle"></i>
                </div>
                <div>
                    <h4>Tạo phiếu nhập hàng</h4>
                    <div class="adm-detail-meta">Tạo mới phiếu nhập hàng từ nhà cung cấp.</div>
                </div>
            </div>
        </div>

        <form th:action="@{/admin/nhap-hang/tao-moi}" method="post" id="createForm">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nhà cung cấp <span class="text-danger">*</span></label>
                            <select name="supplierId" class="form-select" required id="supplierSelect">
                                <option value="">-- Chọn nhà cung cấp --</option>
                                <th:block th:each="s : ${suppliers}">
                                    <option th:value="${s.id}" th:text="${s.tenNhaCungCap}"></option>
                                </th:block>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Ghi chú</label>
                            <textarea name="ghiChu" class="form-control" rows="2" placeholder="Ghi chú phiếu nhập..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold">Chi tiết hàng nhập</h6>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="addItemRow()">
                        <i class="bi bi-plus-lg me-1"></i>Thêm dòng
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0" id="itemsTable">
                            <thead class="table-light">
                                <tr>
                                    <th style="width:30px">#</th>
                                    <th style="width:220px">Tên sản phẩm <span class="text-danger">*</span></th>
                                    <th style="width:80px">SL đặt</th>
                                    <th style="width:130px">Giá nhập (₫)</th>
                                    <th style="width:80px">SL nhận</th>
                                    <th style="width:130px">Thành tiền</th>
                                    <th style="width:150px">Ghi chú</th>
                                    <th style="width:40px"></th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody">
                                <tr class="item-row">
                                    <td class="text-muted">1</td>
                                    <td>
                                        <input type="text" name="tenSanPham" class="form-control form-control-sm" required placeholder="Tên sản phẩm..." />
                                    </td>
                                    <td>
                                        <input type="number" name="soLuong" class="form-control form-control-sm" value="0" min="0" oninput="calcRow(this)" />
                                    </td>
                                    <td>
                                        <input type="number" name="giaNhap" class="form-control form-control-sm" value="0" min="0" oninput="calcRow(this)" />
                                    </td>
                                    <td>
                                        <input type="number" name="soLuongNhan" class="form-control form-control-sm" value="0" min="0" />
                                    </td>
                                    <td class="row-total fw-semibold">0₫</td>
                                    <td>
                                        <input type="text" name="ghiChu" class="form-control form-control-sm" placeholder="Ghi chú..." />
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeItemRow(this)" title="Xóa dòng">
                                            <i class="bi bi-x"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="table-light">
                                    <td colspan="5" class="text-end fw-bold">Tổng cộng:</td>
                                    <td class="fw-bold" id="grandTotal">0₫</td>
                                    <td colspan="2"></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/admin/nhap-hang}" class="btn btn-outline-secondary">Hủy</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>Tạo phiếu nhập
                </button>
            </div>
        </form>

    </div>
    <th:block layout:fragment="extra-script">
        <script>
        var rowIdx = 1;
        function addItemRow() {
            rowIdx++;
            var html = '<tr class="item-row">' +
                '<td class="text-muted">' + rowIdx + '</td>' +
                '<td><input type="text" name="tenSanPham" class="form-control form-control-sm" required placeholder="Tên sản phẩm..." /></td>' +
                '<td><input type="number" name="soLuong" class="form-control form-control-sm" value="0" min="0" oninput="calcRow(this)" /></td>' +
                '<td><input type="number" name="giaNhap" class="form-control form-control-sm" value="0" min="0" oninput="calcRow(this)" /></td>' +
                '<td><input type="number" name="soLuongNhan" class="form-control form-control-sm" value="0" min="0" /></td>' +
                '<td class="row-total fw-semibold">0₫</td>' +
                '<td><input type="text" name="ghiChu" class="form-control form-control-sm" placeholder="Ghi chú..." /></td>' +
                '<td><button type="button" class="btn btn-outline-danger btn-sm" onclick="removeItemRow(this)" title="Xóa dòng"><i class="bi bi-x"></i></button></td>' +
                '</tr>';
            document.getElementById('itemsBody').insertAdjacentHTML('beforeend', html);
        }
        function removeItemRow(btn) {
            var tbody = document.getElementById('itemsBody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
                reindexRows();
                calcGrandTotal();
            }
        }
        function reindexRows() {
            var rows = document.querySelectorAll('#itemsBody .item-row');
            for (var i = 0; i < rows.length; i++) {
                rows[i].cells[0].textContent = i + 1;
            }
            rowIdx = rows.length;
        }
        function calcRow(el) {
            var tr = el.closest('tr');
            var sl = parseInt(tr.querySelector('input[name="soLuong"]').value) || 0;
            var gia = parseInt(tr.querySelector('input[name="giaNhap"]').value) || 0;
            var thanhTien = sl * gia;
            tr.querySelector('.row-total').textContent = thanhTien.toLocaleString('vi-VN') + '₫';
            calcGrandTotal();
        }
        function calcGrandTotal() {
            var total = 0;
            document.querySelectorAll('#itemsBody .item-row').forEach(function(tr) {
                var sl = parseInt(tr.querySelector('input[name="soLuong"]').value) || 0;
                var gia = parseInt(tr.querySelector('input[name="giaNhap"]').value) || 0;
                total += sl * gia;
            });
            document.getElementById('grandTotal').textContent = total.toLocaleString('vi-VN') + '₫';
        }
        </script>
    </th:block>
</body>
</html>
