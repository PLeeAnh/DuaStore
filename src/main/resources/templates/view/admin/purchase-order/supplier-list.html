<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý nhà cung cấp</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/nhap-hang}">Nhập hàng</a></li>
        <li class="breadcrumb-item active" aria-current="page">Nhà cung cấp</li>
    </th:block>
    <div layout:fragment="content">

        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-building"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h4>Nhà cung cấp</h4>
                            <div class="adm-detail-meta">Quản lý danh sách nhà cung cấp.</div>
                        </div>
                        <a th:href="@{/admin/nhap-hang}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white">
                <h6 class="mb-0 fw-bold">Thêm nhà cung cấp mới</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/nhap-hang/nha-cung-cap/luu}" method="post">
                    <input type="hidden" name="isActive" value="true" />
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Tên nhà cung cấp <span class="text-danger">*</span></label>
                            <input type="text" name="tenNhaCungCap" class="form-control" required placeholder="Tên NCC..." />
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">Liên hệ</label>
                            <input type="text" name="lienHe" class="form-control" placeholder="Người liên hệ..." />
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" name="soDienThoai" class="form-control" placeholder="SĐT..." />
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Email..." />
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold">Địa chỉ</label>
                            <input type="text" name="diaChi" class="form-control" placeholder="Địa chỉ..." />
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:40px">#</th>
                                <th>Tên nhà cung cấp</th>
                                <th>Liên hệ</th>
                                <th>Số điện thoại</th>
                                <th>Email</th>
                                <th>Địa chỉ</th>
                                <th style="width:60px">TT</th>
                                <th style="width:80px">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s, iter : ${suppliers}">
                                <td class="text-muted small" th:text="${iter.index + 1}"></td>
                                <td class="fw-semibold" th:text="${s.tenNhaCungCap}"></td>
                                <td th:text="${s.lienHe}"></td>
                                <td th:text="${s.soDienThoai}"></td>
                                <td th:text="${s.email}"></td>
                                <td class="small" th:text="${s.diaChi}"></td>
                                <td>
                                    <span th:if="${s.isActive}" class="badge bg-success">Active</span>
                                    <span th:unless="${s.isActive}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/nhap-hang/nha-cung-cap/{id}/xoa(id=${s.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa" onclick="return confirm('Xóa nhà cung cấp này?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(suppliers)}">
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <i class="bi bi-building me-1"></i>Chưa có nhà cung cấp nào
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
