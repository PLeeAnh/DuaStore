<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý thông báo</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Thông báo</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-megaphone"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h4>Thông báo</h4>
                            <div class="adm-detail-meta">Quản lý thông báo gửi đến khách hàng.</div>
                        </div>
                        <a th:href="@{/admin/thong-bao/them-moi}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Đăng thông báo
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4 col-6">
                <div class="adm-stat">
                    <div class="d-flex align-items-center gap-3">
                        <div class="adm-stat-icon" style="background:#DBEAFE;color:#2563EB">
                            <i class="bi bi-megaphone"></i>
                        </div>
                        <div>
                            <div class="adm-stat-value" th:text="${totalItems}">0</div>
                            <div class="adm-stat-label">Tổng thông báo</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="adm-filter-bar">
            <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div class="d-flex gap-2">
                    <input type="text" id="searchKeyword" class="form-control form-control-sm" style="width:220px" placeholder="Tìm nội dung..." />
                    <select id="filterActive" class="form-select form-select-sm searchable-select" style="width:auto" data-autosubmit>
                        <option value="">Tất cả trạng thái</option>
                        <option value="true">Hiển thị</option>
                        <option value="false">Ẩn</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="adm-table-wrap">
            <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nội dung</th>
                        <th>Đính kèm</th>
                        <th>Ngày tạo</th>
                        <th>Trạng thái</th>
                        <th class="text-center adm-kebab-col" style="width:64px"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="n, iter : ${notifications}">
                        <td th:text="${iter.index + 1 + currentPage * pageSize}"></td>
                        <td class="adm-cell-text">
                            <span class="text-truncate d-inline-block" style="max-width: 350px; white-space: pre-line;" th:text="${n.content}"></span>
                        </td>
                        <td>
                            <span th:if="${n.linkType == 'PRODUCT'}" class="badge bg-info">
                                <i class="bi bi-box-seam me-1"></i><span th:text="${n.linkLabel}"></span>
                            </span>
                            <span th:if="${n.linkType == 'PROMOTION'}" class="badge bg-warning text-dark">
                                <i class="bi bi-tag me-1"></i><span th:text="${n.linkLabel}"></span>
                            </span>
                            <span th:if="${n.linkType == null}" class="text-muted small">—</span>
                        </td>
                        <td th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:if="${n.isActive}" class="status-pill status-ACTIVE">Hiển thị</span>
                            <span th:unless="${n.isActive}" class="status-pill status-AN">Ẩn</span>
                        </td>
                        <td class="text-center">
                            <div class="dropdown">
                                <button class="adm-kebab-btn" data-bs-toggle="dropdown" aria-label="Thao tác">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end adm-kebab-menu">
                                    <li><a class="dropdown-item" th:href="@{/admin/thong-bao/sua/{id}(id=${n.id})}"><i class="bi bi-pencil"></i>Sửa</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <form th:action="@{/admin/thong-bao/xoa/{id}(id=${n.id})}" method="post" class="d-block">
                                            <button type="submit" class="dropdown-item text-danger" data-confirm="Xóa thông báo này?"><i class="bi bi-trash"></i>Xóa</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(notifications)}">
                        <td colspan="6" class="text-muted text-center py-4">Chưa có thông báo nào</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
        <th:block th:replace="~{view/admin/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${entityLabel}, ${url}, ${filterParams})}" />
    </div>
    <th:block layout:fragment="extra-script">
        <script th:src="@{/js/admin-filters.js}"></script>
    </th:block>
</body>
</html>
