<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>403 — Truy cập bị từ chối</title>
    </head>
    <body>
        <th:block layout:fragment="breadcrumb">
            <li class="breadcrumb-item">Hệ thống</li>
            <li class="breadcrumb-item active" aria-current="page">403</li>
        </th:block>
        <div layout:fragment="content">
            <div class="text-center py-5">
                <i class="bi bi-shield-exclamation"

                <h3 class="mt-3 fw-bold">403 — Truy cập bị từ chối</h3>

                    Bạn không có quyền truy cập chức năng này.
                </p>

                    Vui lòng liên hệ quản trị viên nếu bạn cần được cấp quyền.
                </p>
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a th:href="@{/admin}" class="btn btn-primary">
                        <i class="bi bi-speedometer2 me-1"></i>Về Dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-outline-secondary">
                        <i class="bi bi-house me-1"></i>Về trang chủ
