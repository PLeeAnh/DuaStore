<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý danh mục bài viết</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Danh mục bài viết</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-folder"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h4>Danh mục bài viết</h4>
                            <div class="adm-detail-meta">Quản lý các danh mục phân loại bài viết.</div>
                        </div>
                        <a th:href="@{/admin/danh-muc-bai-viet/them-moi}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Thêm danh mục
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="adm-table-wrap">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Thứ tự</th>
                            <th>Tên danh mục</th>
                            <th>Slug</th>
                            <th>Mô tả</th>
                            <th>Ngày tạo</th>
                            <th class="text-center adm-kebab-col" style="width:64px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}">
                            <td><span class="badge text-bg-light" th:text="${cat.thuTu}">0</span></td>
                            <td>
                                <strong th:text="${cat.tenDanhMuc}">Tên danh mục</strong>
                            </td>
                            <td class="text-muted small" th:text="${cat.slug}">-</td>
                            <td class="small text-truncate" style="max-width:300px" th:text="${cat.moTa}">-</td>
                            <td class="small text-muted" th:text="${#temporals.format(cat.ngayTao, 'dd/MM/yyyy')}"></td>
                            <td class="text-center">
                                <div class="dropdown">
                                    <button class="adm-kebab-btn" data-bs-toggle="dropdown" aria-label="Thao tác">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end adm-kebab-menu">
                                        <li><a class="dropdown-item" th:href="@{/admin/danh-muc-bai-viet/sua/{id}(id=${cat.id})}"><i class="bi bi-pencil"></i>Sửa</a></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li>
                                            <form th:action="@{/admin/danh-muc-bai-viet/xoa/{id}(id=${cat.id})}" method="post" class="d-block">
                                                <button type="submit" class="dropdown-item text-danger" data-confirm="Xóa danh mục này?"><i class="bi bi-trash"></i>Xóa</button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-folder fs-2 d-block mb-2"></i>
                                Chưa có danh mục bài viết nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
