# === Hibernate DDL generation profile ===
# Dung de sinh schema.sql tu entity metadata khi can tao DB moi:
#   1. Tao DB tam: sqlcmd -Q "CREATE DATABASE DuaStore_DDLGen"
#   2. .\mvnw spring-boot:run -Dspring-boot.run.profiles=ddlgen
#   3. File schema.sql duoc sinh ra o src/main/resources/schema.sql
#   4. Them seed data tu db/DuaStore_Database_OLD_REFERENCE.sql vao schema.sql
#   5. Xoa DB tam: sqlcmd -Q "DROP DATABASE DuaStore_DDLGen"
#   6. Chay schema.sql tren SQL Server de tao DB moi
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DuaStore_DDLGen;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=OFF
