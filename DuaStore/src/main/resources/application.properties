spring.application.name=DuaStore
spring.profiles.active=local
spring.config.import=optional:classpath:application-secrets.properties
# === SQL Server ===
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DuaStore;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# Password moved to application-secrets.properties
spring.datasource.password=placeholder
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
# De khi can tao DB moi (tren SQL Server):
#   1. Chay app voi profile "ddlgen" de sinh schema.sql tu entity Hibernate:
#        .\mvnw spring-boot:run -Dspring-boot.run.profiles=ddlgen
#   2. Copy seed data tu db/DuaStore_Database_OLD_REFERENCE.sql vao schema.sql
#   3. Chay schema.sql tren SQL Server de tao DB moi
#   4. Chay app binh thuong tro lai
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.cache.type=simple
# Hibernate auto-detects dialect from JDBC driver; do not set manually
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# === Locale ===
spring.web.locale=vi_VN
# === Encoding ===
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.web.resources.charset=UTF-8
# === Thymeleaf ===
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# === Upload ===
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/
# === Store Location ===
store.latitude=20.856493022930007
store.longitude=106.67564041059246
# === Google OAuth2 (Client ID / Secret) ===
# Create your own OAuth credentials at https://console.cloud.google.com/ → APIs & Services → Credentials
# Then add them to application-secrets.properties
spring.security.oauth2.client.registration.google.client-id=placeholder
spring.security.oauth2.client.registration.google.client-secret=placeholder
spring.security.oauth2.client.registration.google.scope=email,profile
# === GMAIL SMTP ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# spring.mail.username/password in application-secrets.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# === Payment ===
payment.bank.code=TCB
payment.bank.account.number=19076525108012
payment.bank.account.name=Nguyen Huy Dung
# === Server ===
server.tomcat.connection-timeout=20000
spring.devtools.restart.enabled=false
# === Security ===
duastore.remember-me.key=change-me-in-secrets
# === VNPAY ===
vnpay.tmn-code=
vnpay.hash-secret=
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/checkout/vnpay/return
# === Homepage ===
homepage.categories.limit=7
