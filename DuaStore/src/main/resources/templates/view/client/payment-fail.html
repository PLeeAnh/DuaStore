<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Thanh toán thất bại — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <div class="ds-section-card">
                <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="ds-card">
                        <div class="ds-card-body text-center">
                            <div class="mb-4">
                                <div class="bg-danger bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                                    <i class="bi bi-x-circle text-danger fs-2"></i>
                                </div>
                                <h4 class="fw-bold">Thanh toán thất bại</h4>
                                <p class="text-muted small" th:text="${error}"></p>
                            </div>
                            <a href="/" class="btn btn-primary">Về trang chủ</a>
                            <a href="/account/orders" class="btn btn-outline-secondary ms-2">Xem đơn hàng</a>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
    </body>
</html>
