<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Liên hệ — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <section class="ds-section sr-up">
                <div class="container-xl" style="max-width:720px;">
                    <div class="text-center mb-5">
                        <span class="ds-section-badge">Liên hệ</span>
                        <h2 class="ds-section-title">Gửi tin nhắn cho chúng tôi</h2>
                        <p class="ds-section-desc">Chúng tôi luôn sẵn sàng lắng nghe và hỗ trợ bạn</p>
                    </div>

                    <div class="ds-card">
                        <div class="ds-card-body">
                            <form th:action="@{/lien-he}" method="post">
                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" style="color:var(--ds-gray-600);">Họ tên <span class="text-danger">*</span></label>
                                        <input type="text" name="hoTen" class="form-control" placeholder="Nguyễn Văn A" required
                                               style="background:var(--ds-gray-50);border:1px solid var(--ds-border);color:var(--ds-gray-900);border-radius:8px;padding:0.65rem 1rem;"/>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" style="color:var(--ds-gray-600);">Email <span class="text-danger">*</span></label>
                                        <input type="email" name="email" class="form-control" placeholder="email@example.com" required
                                               style="background:var(--ds-gray-50);border:1px solid var(--ds-border);color:var(--ds-gray-900);border-radius:8px;padding:0.65rem 1rem;"/>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" style="color:var(--ds-gray-600);">Nội dung <span class="text-danger">*</span></label>
                                        <textarea name="noiDung" class="form-control" rows="5" placeholder="Nhập tin nhắn của bạn..." required
                                                  style="background:var(--ds-gray-50);border:1px solid var(--ds-border);color:var(--ds-gray-900);border-radius:8px;padding:0.65rem 1rem;resize:vertical;"></textarea>
                                    </div>
                                </div>
                                <button type="submit" class="ds-btn ds-btn-fill w-100 mt-4">
                                    <i class="bi bi-send me-2"></i>Gửi tin nhắn
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="row g-4 mt-4">
                        <div class="col-12 col-md-4 text-center">
                            <div style="font-size:2rem;color:var(--ds-primary);"><i class="bi bi-geo-alt"></i></div>
                            <h6 class="mt-2 fw-semibold">Địa chỉ</h6>
                            <p class="mb-0" style="color:var(--ds-gray-500);font-size:0.9rem;">Hải Phòng, Việt Nam</p>
                        </div>
                        <div class="col-12 col-md-4 text-center">
                            <div style="font-size:2rem;color:var(--ds-primary);"><i class="bi bi-envelope"></i></div>
                            <h6 class="mt-2 fw-semibold">Email</h6>
                            <p class="mb-0" style="color:var(--ds-gray-500);font-size:0.9rem;">hello@dua.store</p>
                        </div>
                        <div class="col-12 col-md-4 text-center">
                            <div style="font-size:2rem;color:var(--ds-primary);"><i class="bi bi-telephone"></i></div>
                            <h6 class="mt-2 fw-semibold">Điện thoại</h6>
                            <p class="mb-0" style="color:var(--ds-gray-500);font-size:0.9rem;">0901 234 567</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
