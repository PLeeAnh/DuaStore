<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
<head><title>Khuyến mãi - DuaStore</title></head>
<body>
<div layout:fragment="content">
    <div class="ds-container py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item active">Khuyến mãi</li>
            </ol>
        </nav>

        <h4 class="fw-bold mb-3">Khuyến mãi hiện có</h4>

        <div th:if="${#lists.isEmpty(promotions)}" class="text-center py-5 text-muted">
            <i class="bi bi-ticket-perforated" style="font-size: 3rem;"></i>
            <p class="mt-3">Hiện chưa có chương trình khuyến mãi nào</p>
        </div>

        <div th:unless="${#lists.isEmpty(promotions)}" class="row g-3">
            <div th:each="p : ${promotions}" class="col-md-4 col-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-3 d-flex flex-column">
                        <div class="text-danger fw-bold fs-5 mb-1">
                            <span th:if="${'PHAN_TRAM'.equals(p.loaiGiam)}" th:text="${'-' + #numbers.formatDecimal(p.giaTriGiam, 0, 'POINT', 0, 'POINT') + '%'}"></span>
                            <span th:if="${'SO_TIEN'.equals(p.loaiGiam)}" th:text="${'Giảm ' + #numbers.formatDecimal(p.giaTriGiam, 0, 'POINT', 0, 'POINT') + '₫'}"></span>
                        </div>
                        <p class="small mb-1" th:text="${p.tenChuongTrinh}"></p>
                        <code class="small" th:text="${p.maCode}"></code>
                        <div class="small text-muted mt-1" th:if="${p.donHangToiThieu != null and p.donHangToiThieu > 0}"
                             th:text="${'Đơn tối thiểu ' + #numbers.formatDecimal(p.donHangToiThieu, 0, 'POINT', 0, 'POINT') + '₫'}"></div>
                        <div class="small text-muted" th:if="${p.giamToiDa != null}"
                             th:text="${'Giảm tối đa ' + #numbers.formatDecimal(p.giamToiDa, 0, 'POINT', 0, 'POINT') + '₫'}"></div>
                        <div class="small text-muted">HSD: <span th:text="${#temporals.format(p.denNgay, 'dd/MM/yyyy HH:mm')}"></span></div>
                        <div class="mt-auto pt-2 d-flex gap-1">
                            <button class="btn btn-sm btn-outline-danger py-0 px-1 copy-promo-btn" style="font-size:.7rem"
                                    th:data-code="${p.maCode}" type="button">Copy</button>
                            <button class="btn btn-sm btn-danger py-0 px-1" style="font-size:.7rem"
                                    type="button" onclick="saveVoucher(${p.id})">Lưu</button>
                            <a th:href="@{/khuyen-mai/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary py-0 px-1 ms-auto" style="font-size:.7rem">Chi tiết</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function saveVoucher(promotionId) {
        fetch('/api/vi-voucher/luu/' + promotionId, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                } else {
                    alert(data.message);
                }
            });
    }
</script>
</body>
</html>
