<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Lịch sử đơn hàng — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="ds-section-card">
                    <h4 class="fw-bold mb-4">Lịch sử đơn hàng</h4>

                    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div class="d-flex gap-2 mb-4 flex-wrap">
                        <a th:href="@{/tai-khoan/don-hang}" class="ds-btn ds-btn-sm" th:classappend="${trangThai == null} ? 'ds-btn-fill' : 'ds-btn-outline'">Tất cả</a>
                        <a th:href="@{/tai-khoan/don-hang(trangThai='DA_HOAN_THANH')}" class="ds-btn ds-btn-sm" th:classappend="${trangThai == 'DA_HOAN_THANH'} ? 'ds-btn-fill' : 'ds-btn-outline'">Đã hoàn thành</a>
                        <a th:href="@{/tai-khoan/don-hang(trangThai='DA_XAC_NHAN')}" class="ds-btn ds-btn-sm" th:classappend="${trangThai == 'DA_XAC_NHAN'} ? 'ds-btn-fill' : 'ds-btn-outline'">Đã xác nhận</a>
                        <a th:href="@{/tai-khoan/don-hang(trangThai='CHO_XAC_NHAN')}" class="ds-btn ds-btn-sm" th:classappend="${trangThai == 'CHO_XAC_NHAN'} ? 'ds-btn-fill' : 'ds-btn-outline'">Chờ xác nhận</a>
                        <a th:href="@{/tai-khoan/don-hang(trangThai='DA_GIAO')}" class="ds-btn ds-btn-sm" th:classappend="${trangThai == 'DA_GIAO'} ? 'ds-btn-fill' : 'ds-btn-outline'">Đã giao</a>
                        <a th:href="@{/tai-khoan/don-hang(trangThai='DA_HUY')}" class="ds-btn ds-btn-sm" th:classappend="${trangThai == 'DA_HUY'} ? 'ds-btn-fill' : 'ds-btn-outline'">Đã hủy</a>
                    </div>

                    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
                        <i class="bi bi-clock-history" style="font-size:3rem;color:#ccc;"></i>
                        <p class="text-muted mt-3">Chưa có đơn hàng nào</p>
                        <a th:href="@{/}" class="ds-btn ds-btn-fill">Mua sắm ngay</a>
                    </div>

                    <div th:each="o : ${orders}" class="ds-card mb-3">
                        <div class="ds-card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <strong>Mã ĐH: <span th:text="${o.maDon}"></span></strong>
                                    <span class="text-muted ms-2 small" th:text="${#temporals.format(o.ngayDat, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>
                                <span class="badge" th:classappend="${o.trangThaiDon == 'CHO_XAC_NHAN' ? 'bg-warning' : o.trangThaiDon == 'DA_XAC_NHAN' ? 'bg-primary' : o.trangThaiDon == 'DANG_GIAO' ? 'bg-info' : o.trangThaiDon == 'DA_GIAO' ? 'bg-success' : o.trangThaiDon == 'DA_HOAN_THANH' ? 'bg-success' : 'bg-secondary'}"
                                      th:text="${o.trangThaiDon == 'CHO_XAC_NHAN' ? 'Chờ xác nhận' : o.trangThaiDon == 'DA_XAC_NHAN' ? 'Đã xác nhận' : o.trangThaiDon == 'DANG_GIAO' ? 'Đang giao' : o.trangThaiDon == 'DA_GIAO' ? 'Đã giao' : o.trangThaiDon == 'DA_HUY' ? 'Đã hủy' : o.trangThaiDon == 'DA_HOAN_THANH' ? 'Đã hoàn thành' : o.trangThaiDon}"></span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.tongThanhToan, 0, 'POINT', 0, 'POINT')} + '₫'"></span>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/tai-khoan/don-hang/{id}(id=${o.id})}" class="ds-btn ds-btn-outline ds-btn-sm">Xem chi tiết</a>
                                    <button th:if="${o.trangThaiDon == 'CHO_XAC_NHAN'}" type="button" class="ds-btn ds-btn-outline ds-btn-sm" style="color:#2563eb;border-color:#2563eb;"
                                            data-bs-toggle="modal" data-bs-target="${'#cancelReasonModal_' + o.id}">Hủy</button>
                                    <!-- Cancel Reason Modal -->
                                    <div class="modal fade" th:id="${'cancelReasonModal_' + o.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content">
                                                <form th:action="@{/tai-khoan/don-hang/huy/{id}(id=${o.id})}" method="post">
                                                    <div class="modal-header border-0">
                                                        <h6 class="modal-title"><i class="bi bi-x-circle me-2"></i>Hủy đơn hàng <span th:text="${o.maDon}"></span></h6>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <p class="small text-muted">Vui lòng cho biết lý do hủy:</p>
                                                        <textarea name="lyDo" class="form-control" rows="3" placeholder="Nhập lý do hủy..." required maxlength="500"></textarea>
                                                    </div>
                                                    <div class="modal-footer border-0">
                                                        <button type="button" class="ds-btn ds-btn-outline ds-btn-sm" data-bs-dismiss="modal">Đóng</button>
                                                        <button type="submit" class="ds-btn ds-btn-fill ds-btn-sm">Xác nhận hủy</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-3 shadow-sm border mt-3" style="border-color:#f0f0f0;">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <small class="text-muted fw-medium" style="font-size:.85rem;">
                                Hiển thị <strong th:text="${totalElements == 0 ? 0 : currentPage * size + 1}">1</strong>-<strong th:text="${(currentPage + 1) * size > totalElements ? totalElements : (currentPage + 1) * size}">5</strong> trong tổng số <strong th:text="${totalElements}">12</strong> <span>đơn hàng</span>
                            </small>
                        </div>
                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                            <form th:action="@{/tai-khoan/don-hang}" method="get" class="d-inline">
                                <input type="hidden" name="trangThai" th:value="${trangThai}" />
                                <input type="hidden" name="page" value="0" />
                                <select name="size" onchange="this.form.submit()" style="width:auto;border-radius:8px;border:1px solid #e5e7eb;font-size:.85rem;font-weight:500;cursor:pointer;padding:4px 28px 4px 10px;">
                                    <option value="5" th:selected="${size == 5}">Hiển thị 5</option>
                                    <option value="10" th:selected="${size == 10}">Hiển thị 10</option>
                                    <option value="20" th:selected="${size == 20}">Hiển thị 20</option>
                                    <option value="50" th:selected="${size == 50}">Hiển thị 50</option>
                                </select>
                            </form>
                            <nav>
                                <div class="d-flex align-items-center gap-1">
                                    <a th:href="@{/tai-khoan/don-hang(page=${currentPage - 1}, trangThai=${trangThai}, size=${size})}"
                                       class="adm-pagination-nav-btn"
                                       th:classappend="${currentPage == 0} ? disabled"
                                       th:tabindex="${currentPage == 0} ? -1">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                    </a>
                                    <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                       th:href="@{/tai-khoan/don-hang(page=${i}, trangThai=${trangThai}, size=${size})}"
                                       class="adm-pagination-btn"
                                       th:classappend="${i == currentPage} ? active"
                                       th:text="${i + 1}">1</a>
                                    <a th:href="@{/tai-khoan/don-hang(page=${currentPage + 1}, trangThai=${trangThai}, size=${size})}"
                                       class="adm-pagination-nav-btn"
                                       th:classappend="${currentPage >= totalPages - 1} ? disabled"
                                       th:tabindex="${currentPage >= totalPages - 1} ? -1">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                    </a>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
