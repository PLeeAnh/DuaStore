<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Lịch sử đơn hàng — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <h4 class="fw-bold mb-4">Lịch sử đơn hàng</h4>

            <div class="d-flex gap-2 mb-4 flex-wrap">
                <a th:href="@{/tai-khoan/don-hang}" class="btn btn-sm" th:classappend="${trangThai == null} ? 'btn-dark' : 'btn-outline-secondary'">Tất cả</a>
                <a th:href="@{/tai-khoan/don-hang(trangThai='CHO_XAC_NHAN')}" class="btn btn-sm" th:classappend="${trangThai == 'CHO_XAC_NHAN'} ? 'btn-dark' : 'btn-outline-secondary'">Chờ xác nhận</a>
                <a th:href="@{/tai-khoan/don-hang(trangThai='DANG_GIAO')}" class="btn btn-sm" th:classappend="${trangThai == 'DANG_GIAO'} ? 'btn-dark' : 'btn-outline-secondary'">Đang giao</a>
                <a th:href="@{/tai-khoan/don-hang(trangThai='DA_GIAO')}" class="btn btn-sm" th:classappend="${trangThai == 'DA_GIAO'} ? 'btn-dark' : 'btn-outline-secondary'">Đã giao</a>
                <a th:href="@{/tai-khoan/don-hang(trangThai='DA_HUY')}" class="btn btn-sm" th:classappend="${trangThai == 'DA_HUY'} ? 'btn-dark' : 'btn-outline-secondary'">Đã hủy</a>
            </div>

            <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
                <i class="bi bi-clock-history" style="font-size:3rem;color:#ccc;"></i>
                <p class="text-muted mt-3">Chưa có đơn hàng nào</p>
                <a th:href="@{/}" class="btn btn-primary">Mua sắm ngay</a>
            </div>

            <div th:each="o : ${orders}" class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <strong>Mã ĐH: <span th:text="${o.maDon}"></span></strong>
                            <span class="text-muted ms-2 small" th:text="${#temporals.format(o.ngayDat, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                        <span class="badge" th:classappend="${o.trangThaiDon == 'CHO_XAC_NHAN' ? 'bg-warning' : o.trangThaiDon == 'DANG_GIAO' ? 'bg-info' : o.trangThaiDon == 'DA_GIAO' ? 'bg-success' : 'bg-secondary'}"
                              th:text="${o.trangThaiDon == 'CHO_XAC_NHAN' ? 'Chờ xác nhận' : o.trangThaiDon == 'DANG_GIAO' ? 'Đang giao' : o.trangThaiDon == 'DA_GIAO' ? 'Đã giao' : o.trangThaiDon == 'DA_HUY' ? 'Đã hủy' : o.trangThaiDon}"></span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.tongThanhToan, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        <div class="d-flex gap-2">
                            <a th:href="@{/tai-khoan/don-hang/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                            <form th:if="${o.trangThaiDon == 'CHO_XAC_NHAN'}" th:action="@{/tai-khoan/don-hang/huy/{id}(id=${o.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Hủy đơn hàng này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Hủy</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${totalPages > 1}" class="mt-3">
                <nav>
                    <ul class="pagination pagination-sm justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? disabled">
                            <a class="page-link" th:href="@{/tai-khoan/don-hang(page=${currentPage - 1}, trangThai=${trangThai})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? active">
                            <a class="page-link" th:href="@{/tai-khoan/don-hang(page=${i}, trangThai=${trangThai})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? disabled">
                            <a class="page-link" th:href="@{/tai-khoan/don-hang(page=${currentPage + 1}, trangThai=${trangThai})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    </body>
</html>
