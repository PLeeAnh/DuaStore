<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Thanh toán chuyển khoản — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5 text-center">

                            <div class="mb-4">
                                <div class="bg-success bg-opacity-10 d-inline-flex p-3 rounded-circle mb-3">
                                    <i class="bi bi-bank text-success fs-2"></i>
                                </div>
                                <h4 class="fw-bold">Quét mã QR để thanh toán</h4>
                                <p class="text-muted small">Vui lòng chuyển khoản đúng số tiền bên dưới</p>
                            </div>

                            <div class="mb-4">
                                <img th:src="${qrUrl}" alt="QR thanh toán"
                                     class="img-fluid rounded-3 border"
                                     style="max-width:280px;width:100%" />
                            </div>

                            <div class="bg-light rounded-3 p-3 mb-4 text-start">
                                <div class="d-flex justify-content-between small mb-2">
                                    <span class="text-muted">Ngân hàng</span>
                                    <span class="fw-medium">Techcombank (TCB)</span>
                                </div>
                                <div class="d-flex justify-content-between small mb-2">
                                    <span class="text-muted">Số tài khoản</span>
                                    <span class="fw-medium" th:text="${accountNumber}"></span>
                                </div>
                                <div class="d-flex justify-content-between small mb-2">
                                    <span class="text-muted">Chủ tài khoản</span>
                                    <span class="fw-medium" th:text="${accountName}"></span>
                                </div>
                                <div class="d-flex justify-content-between small mb-2">
                                    <span class="text-muted">Mã đơn</span>
                                    <span class="fw-medium" th:text="${order.maDon}"></span>
                                </div>
                                <div class="d-flex justify-content-between small">
                                    <span class="text-muted">Số tiền</span>
                                    <span class="fw-bold text-danger fs-5" th:text="${#numbers.formatDecimal(order.tongThanhToan, 0, 0)} + 'đ'"></span>
                                </div>
                            </div>

                            <div class="alert alert-warning small py-2 mb-4">
                                <i class="bi bi-info-circle me-1"></i>
                                Sau khi chuyển khoản, vui lòng bấm <strong>"Đã thanh toán"</strong> để hoàn tất đơn hàng.
                            </div>

                            <form th:action="@{/checkout/chuyen-khoan/{id}/xac-nhan(id=${order.id})}" method="post">
                                <button type="submit" class="btn btn-success btn-lg rounded-pill w-100 fw-semibold py-2">
                                    <i class="bi bi-check-circle me-1"></i>Đã thanh toán
                                </button>
                            </form>

                            <div class="mt-3">
                                <a th:href="@{/}" class="text-muted small">Quay lại trang chủ</a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
