<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Thanh toán — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-4">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2"></i>Địa chỉ giao hàng</h5>
                    <div th:if="${#lists.isEmpty(addresses)}" class="alert alert-warning py-2">
                        Chưa có địa chỉ. <a th:href="@{/address}" class="alert-link">Thêm địa chỉ mới</a>
                    </div>

                    <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post" id="checkoutForm">
                        <div th:if="${not #lists.isEmpty(addresses)}" class="mb-4">
                            <div class="row g-2">
                                <div class="col-md-6" th:each="a : ${addresses}">
                                    <label class="address-radio d-block">
                                        <input type="radio" name="addressId" th:value="${a.id}"
                                               th:checked="${a.isDefault}" required />
                                        <div class="border rounded p-3" style="cursor:pointer">
                                            <strong th:text="${a.tenNguoiNhan}"></strong>
                                            <span class="text-muted ms-2" th:text="${a.soDienThoai}"></span>
                                            <span th:if="${a.isDefault}" class="badge bg-primary ms-2">Mặc định</span>
                                            <div class="small text-muted mt-1" th:text="${a.diaChiCuThe} + ', ' + ${a.phuongXa} + ', ' + ${a.quanHuyen} + ', ' + ${a.tinhThanh}"></div>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="text-end mb-3">
                            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill" onclick="openAddressModal()">
                                <i class="bi bi-pencil me-1"></i>Quản lý địa chỉ
                            </button>
                        </div>

                        <hr />
                        <h5 class="fw-bold mb-3"><i class="bi bi-truck me-2"></i>Phương thức vận chuyển</h5>
                        <div class="mb-4">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="phuongThucGiaoHang"
                                       id="shipTT" value="SHIP" checked />
                                <label class="form-check-label d-flex justify-content-between w-100" for="shipTT">
                                    <span>Giao hàng tiêu chuẩn</span>
                                    <span class="text-muted">30.000đ</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="phuongThucGiaoHang"
                                       id="shipNhanh" value="NHAN_TAI_CONG" />
                                <label class="form-check-label d-flex justify-content-between w-100" for="shipNhanh">
                                    <span>Giao hàng nhanh</span>
                                    <span class="text-muted">50.000đ</span>
                                </label>
                            </div>
                        </div>

                        <hr />
                        <h5 class="fw-bold mb-3"><i class="bi bi-credit-card me-2"></i>Phương thức thanh toán</h5>
                        <div class="mb-4">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="phuongThucTT"
                                       id="ttCOD" value="COD" checked required />
                                <label class="form-check-label" for="ttCOD">Thanh toán khi nhận hàng (COD)</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="phuongThucTT"
                                       id="ttCK" value="CHUYEN_KHOAN" />
                                <label class="form-check-label" for="ttCK">Chuyển khoản ngân hàng</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="phuongThucTT"
                                       id="ttVNPay" value="VNPAY" />
                                <label class="form-check-label" for="ttVNPay">VNPay</label>
                            </div>
                        </div>

                        <hr />
                        <h5 class="fw-bold mb-3"><i class="bi bi-ticket me-2"></i>Mã giảm giá</h5>
                        <div class="input-group mb-1" style="max-width:400px">
                            <input type="text" name="maCode" class="form-control" id="checkoutPromoInput" placeholder="Nhập mã giảm giá" />
                            <button class="btn btn-outline-primary" type="button" id="checkoutApplyPromo">Áp dụng</button>
                        </div>
                        <div id="checkoutPromoMsg" class="small mb-3"></div>

                        <div class="mb-3">
                            <label class="form-label">Ghi chú đơn hàng</label>
                            <textarea name="ghiChu" class="form-control" rows="2" placeholder="Ghi chú (không bắt buộc)"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Đặt hàng</button>
                    </form>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">Tóm tắt đơn hàng</h6>
                            <div th:each="item : ${cartItems}" class="d-flex gap-2 mb-2">
                                <img th:src="@{${item.hinhAnh}}" alt="" class="rounded" style="width:50px;height:50px;object-fit:cover" />
                                <div class="flex-grow-1 small">
                                    <div class="text-truncate" th:text="${item.tenSanPham}"></div>
                                    <div class="text-muted" th:text="${item.tenBienThe}"></div>
                                    <div class="d-flex justify-content-between">
                                        <span th:text="${#numbers.formatDecimal(item.giaBan, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                                        <span class="text-muted">x<span th:text="${item.soLuong}"></span></span>
                                    </div>
                                </div>
                            </div>
                            <hr />
                            <div class="d-flex justify-content-between small mb-1">
                                <span>Tạm tính</span>
                                <span th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + 'đ'" id="subtotalDisplay"></span>
                            </div>
                            <div class="d-flex justify-content-between small mb-1">
                                <span>Phí vận chuyển</span>
                                <span th:text="${#numbers.formatDecimal(phiVanChuyen != null ? phiVanChuyen : 30000, 0, 'COMMA', 0, 'POINT')} + 'đ'" id="shipFeeDisplay"></span>
                            </div>
                            <div class="d-flex justify-content-between small mb-1">
                                <span>Giảm giá</span>
                                <span th:text="${tienGiam != null and tienGiam > 0 ? '-' + #numbers.formatDecimal(tienGiam, 0, 'COMMA', 0, 'POINT') + 'đ' : '0đ'}" id="discountDisplay"></span>
                            </div>
                            <hr />
                            <div class="d-flex justify-content-between fw-bold">
                                <span>Tổng cộng</span>
                                <span th:text="${#numbers.formatDecimal(tongTam != null ? tongTam : (subtotal + 30000), 0, 'COMMA', 0, 'POINT')} + 'đ'" id="totalDisplay"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        <!-- Modal quản lý địa chỉ -->
        <div class="modal fade" id="addressModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow">
              <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold modal-title">Quản lý địa chỉ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body pt-3">
                <div id="addressModalList">
                  <div th:each="a : ${addresses}" class="card border mb-2">
                    <div class="card-body py-2 px-3">
                      <div class="d-flex justify-content-between align-items-center">
                        <div>
                          <strong th:text="${a.tenNguoiNhan}"></strong>
                          <span class="text-muted ms-2" th:text="${a.soDienThoai}"></span>
                          <span th:if="${a.isDefault}" class="badge bg-primary ms-2">Mặc định</span>
                          <div class="small text-muted" th:text="${a.diaChiCuThe} + ', ' + ${a.phuongXa} + ', ' + ${a.quanHuyen} + ', ' + ${a.tinhThanh}"></div>
                        </div>
                        <div class="d-flex gap-1">
                          <button class="btn btn-sm btn-outline-secondary rounded-pill" th:unless="${a.isDefault}" onclick="setDefaultAddress(${a.id})">Mặc định</button>
                          <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteAddress(${a.id})"><i class="bi bi-trash"></i></button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <a th:href="@{/address/new}" class="btn btn-primary btn-sm rounded-pill mt-2" target="_blank">
                  <i class="bi bi-plus-lg"></i> Thêm địa chỉ mới
                </a>
              </div>
              <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Đóng</button>
              </div>
            </div>
          </div>
        </div>
        </div>

<th:block layout:fragment="extra-script">
    <span id="rawSubtotal" style="display:none" th:text="${subtotal}"></span>
    <script>
        function openAddressModal() {
            new bootstrap.Modal(document.getElementById('addressModal')).show();
        }
        function setDefaultAddress(id) {
            fetch('/address/set-default/' + id, { method: 'POST' }).then(function() { location.reload(); });
        }
        function deleteAddress(id) {
            if (!confirm('Xoá địa chỉ này?')) return;
            fetch('/address/delete/' + id, { method: 'POST' }).then(function() { location.reload(); });
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('addressModal')?.addEventListener('hidden.bs.modal', function() {
                location.reload();
            });
            let appliedDiscount = 0;

        function updateShipFee() {
            const fee = document.querySelector('input[name="phuongThucGiaoHang"]:checked')?.value === 'NHAN_TAI_CONG' ? 50000 : 30000;
            document.getElementById('shipFeeDisplay').textContent = fee.toLocaleString('vi-VN') + 'đ';
            updateTotal();
        }
        function updateTotal() {
            const subtotal = parseInt(document.getElementById('rawSubtotal').textContent) || 0;
            const fee = parseInt(document.getElementById('shipFeeDisplay').textContent.replace(/[^0-9]/g, '')) || 0;
            const total = subtotal + fee - appliedDiscount;
            document.getElementById('totalDisplay').textContent = (total < 0 ? 0 : total).toLocaleString('vi-VN') + 'đ';
        }

        document.querySelectorAll('input[name="phuongThucGiaoHang"]').forEach(function(el) {
            el.addEventListener('change', function() {
                updateShipFee();
            });
        });

        document.getElementById('checkoutApplyPromo')?.addEventListener('click', function() {
            const input = document.getElementById('checkoutPromoInput');
            const msgEl = document.getElementById('checkoutPromoMsg');
            const code = input.value.trim();
            if (!code) { msgEl.innerHTML = '<span class="text-danger">Vui lòng nhập mã</span>'; return; }
            const subtotal = parseInt(document.getElementById('rawSubtotal').textContent) || 0;
            msgEl.innerHTML = '<span class="text-muted">Đang kiểm tra...</span>';
            fetch('/api/coupon/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ maCode: code, subtotal })
            }).then(r => r.json()).then(data => {
                if (data.valid) {
                    msgEl.innerHTML = '<span class="text-success">&#10003; ' + data.message + '</span>';
                    appliedDiscount = parseInt(data.discount) || 0;
                    document.getElementById('discountDisplay').textContent = '-' + appliedDiscount.toLocaleString('vi-VN') + 'đ';
                    document.getElementById('discountDisplay').className = 'text-danger';
                } else {
                    msgEl.innerHTML = '<span class="text-danger">&#10007; ' + data.message + '</span>';
                    appliedDiscount = 0;
                    document.getElementById('discountDisplay').textContent = '0đ';
                    document.getElementById('discountDisplay').className = '';
                }
                updateTotal();
            }).catch(() => {
                msgEl.innerHTML = '<span class="text-danger">Lỗi kết nối, vui lòng thử lại</span>';
            });
        });
        });
    </script>
</th:block>
    </body>
</html>
