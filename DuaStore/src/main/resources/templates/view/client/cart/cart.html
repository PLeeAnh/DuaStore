<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
<head>
    <title>Giỏ hàng - DuaStore</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-xl py-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item active">Giỏ hàng</li>
            </ol>
        </nav>

        <h3 class="mb-4">Giỏ hàng của bạn</h3>

        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
            <i class="bi bi-cart3" style="font-size:3rem;color:#ccc;"></i>
            <p class="text-muted mt-3">Giỏ hàng trống</p>
            <a th:href="@{/san-pham}" class="btn btn-danger">Mua sắm ngay</a>
        </div>

        <div th:unless="${#lists.isEmpty(cartItems)}" class="row g-4">
            <div class="col-lg-8">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th class="text-end">Đơn giá</th>
                            <th class="text-center" style="width:120px;">Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                            <th class="text-center">Xóa</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="@{${item.hinhAnhHienThi} != null ? ${item.hinhAnhHienThi} : '/images/no-image.png'}"
                                         th:alt="${item.tenSanPham}"
                                         style="width:72px;height:72px;object-fit:cover;border-radius:6px;" />
                                    <div>
                                        <a th:href="@{/san-pham/{id}(id=${item.productId})}"
                                           class="fw-semibold text-decoration-none text-dark"
                                           th:text="${item.tenSanPham}">Tên sản phẩm</a>
                                        <div class="small text-muted" th:text="${item.tenBienThe}">Biến thể</div>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(item.giaBan, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                            <td>
                                <form th:action="@{/gio-hang/cap-nhat/{id}(id=${item.variantId})}" method="post"
                                      class="d-flex justify-content-center">
                                    <input type="number" name="soLuong" th:value="${item.soLuong}"
                                           min="1" max="99" class="form-control form-control-sm text-center qty-auto-update" />
                                </form>
                            </td>
                            <td class="text-end fw-semibold text-danger"
                                th:text="${#numbers.formatDecimal(item.giaBan * item.soLuong, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                            <td class="text-center">
                                <button type="button" class="btn btn-outline-danger btn-sm"
                                        th:onclick="'removeCartItem(' + ${item.variantId} + ')'"
                                        title="Xóa khỏi giỏ hàng">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="border rounded-2 p-3">
                    <h5 class="mb-3">Tổng đơn hàng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tạm tính</span>
                        <strong class="text-danger fs-5" th:text="${#numbers.formatDecimal(totalPrice != null ? totalPrice : 0, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</strong>
                    </div>
                    <div class="input-group input-group-sm mb-3 mt-3">
                        <input type="text" class="form-control" placeholder="Mã giảm giá" />
                        <button class="btn btn-outline-secondary" type="button">Áp dụng</button>
                    </div>
                    <a th:href="@{/checkout}" class="btn btn-danger w-100 py-2 fw-semibold">
                        Tiến hành thanh toán
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="extra-script">
<script>
    document.querySelectorAll('form[action*="/gio-hang/cap-nhat"]').forEach(form => {
        const inputField = form.querySelector('.qty-auto-update');

        inputField.addEventListener('change', function() {
            const variantId = form.action.substring(form.action.lastIndexOf('/') + 1);
            const soLuong = parseInt(this.value) || 1;
            
            this.disabled = true; 

            fetch('/api/cart/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ variantId: parseInt(variantId), soLuong }) // Đã đổi key thành variantId
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    window.location.reload();
                } else {
                    alert(data.message || 'Cập nhật thất bại');
                    this.disabled = false;
                }
            }).catch(() => {
                alert('Lỗi kết nối hệ thống');
                this.disabled = false;
            });
        });

        form.addEventListener('submit', function(e) { e.preventDefault(); });
    });
</script>
</th:block>
</body>
</html>
