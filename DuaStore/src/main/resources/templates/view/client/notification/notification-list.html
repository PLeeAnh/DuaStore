<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Thông báo</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-4" style="max-width: 720px;">
            <div class="ds-section-card">
            <h5 class="fw-bold mb-4">
                <i class="bi bi-megaphone me-2"></i>Thông báo
                <small class="text-muted fw-normal ms-2" th:text="${#lists.size(notifications)} + ' thông báo'"></small>
            </h5>

            <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                <i class="bi bi-bell-slash" style="font-size: 3rem;"></i>
                <p class="mt-3 mb-0">Chưa có thông báo nào</p>
            </div>

            <a th:each="n : ${notifications}" th:if="${n.linkType != null}" th:href="@{${n.linkUrl}}"
               class="text-decoration-none text-reset d-block card border-0 mb-3 shadow-sm" style="border-radius: 12px; transition: box-shadow .15s;">
                <div class="card-body p-3">
                    <div class="d-flex align-items-start gap-3">
                        <span th:if="${n.linkType == 'PRODUCT'}" class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle bg-info-subtle text-info" style="width: 40px; height: 40px; font-size: 1.1rem;">
                            <i class="bi bi-box-seam"></i>
                        </span>
                        <span th:if="${n.linkType == 'PROMOTION'}" class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle bg-warning-subtle text-warning" style="width: 40px; height: 40px; font-size: 1.1rem;">
                            <i class="bi bi-tag"></i>
                        </span>
                        <div class="flex-grow-1 min-w-0">
                            <p class="mb-1" style="white-space: pre-line; font-size: .9rem; color: #333;" th:text="${n.content}"></p>
                            <div class="mt-1">
                                <span class="d-inline-flex align-items-center gap-1 small fw-medium" style="color: #0d6efd;">
                                    <span th:text="${n.linkLabel}"></span>
                                    <i class="bi bi-arrow-right"></i>
                                </span>
                            </div>
                            <div class="mt-1">
                                <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'HH:mm, dd/MM/yyyy')}"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

            <div th:each="n : ${notifications}" th:if="${n.linkType == null}" class="card border-0 mb-3 shadow-sm" style="border-radius: 12px;">
                <div class="card-body p-3">
                    <div class="d-flex align-items-start gap-3">
                        <span class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary" style="width: 40px; height: 40px; font-size: 1.1rem;">
                            <i class="bi bi-megaphone"></i>
                        </span>
                        <div class="flex-grow-1 min-w-0">
                            <p class="mb-1" style="white-space: pre-line; font-size: .9rem; color: #333;" th:text="${n.content}"></p>
                            <div class="mt-1">
                                <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'HH:mm, dd/MM/yyyy')}"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
    </body>
</html>
