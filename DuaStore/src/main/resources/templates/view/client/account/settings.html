<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head><title>Cài đặt — DuaStore</title></head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5" style="max-width:600px;">
            <h4 class="fw-bold mb-4"><i class="bi bi-gear me-2"></i>Cài đặt tài khoản</h4>

            <div class="ds-card mb-3">
                <div class="ds-card-body d-flex align-items-center gap-3">
                    <span class="ds-profile-avatar lg flex-shrink-0" th:text="${session.userInitial}">A</span>
                    <div class="flex-grow-1">
                        <div class="fw-semibold" th:text="${user.hoTen}">User</div>
                        <small class="text-muted" th:text="${user.email}">user@email.com</small>
                    </div>
                </div>
            </div>

            <div class="ds-card">
                <div class="list-group list-group-flush">
                    <a th:href="@{/tai-khoan}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <i class="bi bi-person fs-5" style="color:var(--ds-primary);"></i>
                        <div class="flex-grow-1">
                            <div class="fw-semibold">Hồ sơ</div>
                            <small class="text-muted">Thông tin cá nhân, số điện thoại</small>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </a>
                    <a th:href="@{/tai-khoan/doi-mat-khau}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <i class="bi bi-shield-lock fs-5" style="color:var(--ds-primary);"></i>
                        <div class="flex-grow-1">
                            <div class="fw-semibold">Đổi mật khẩu</div>
                            <small class="text-muted">Cập nhật mật khẩu bảo mật</small>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </a>
                    <a th:href="@{/tai-khoan/hoat-dong}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                        <i class="bi bi-activity fs-5" style="color:var(--ds-primary);"></i>
                        <div class="flex-grow-1">
                            <div class="fw-semibold">Hoạt động</div>
                            <small class="text-muted">Lịch sử đơn hàng, đánh giá</small>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
