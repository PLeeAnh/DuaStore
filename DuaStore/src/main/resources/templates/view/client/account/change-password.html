<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Đổi mật khẩu — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-6">
                        <div class="card border-0 shadow-sm" style="background:#141414;border:1px solid #2A2A2A;border-radius:16px;">
                            <div class="card-body p-4 p-lg-5">
                                <h4 class="fw-bold mb-1" style="color:#F0F0F0;">Đổi mật khẩu</h4>
                                <p class="text-muted mb-4" style="color:#8A8A8A;font-size:0.9rem;">Nhập mật khẩu hiện tại và mật khẩu mới</p>

                                <form th:action="@{/tai-khoan/doi-mat-khau}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label" style="color:#B0B0B0;">Mật khẩu hiện tại</label>
                                        <input type="password" name="oldPassword" class="form-control" placeholder="Nhập mật khẩu cũ" required
                                               style="background:#1A1A1A;border:1px solid #2A2A2A;color:#F0F0F0;border-radius:8px;padding:0.65rem 1rem;"/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" style="color:#B0B0B0;">Mật khẩu mới</label>
                                        <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6"
                                               style="background:#1A1A1A;border:1px solid #2A2A2A;color:#F0F0F0;border-radius:8px;padding:0.65rem 1rem;"/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" style="color:#B0B0B0;">Xác nhận mật khẩu mới</label>
                                        <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required
                                               style="background:#1A1A1A;border:1px solid #2A2A2A;color:#F0F0F0;border-radius:8px;padding:0.65rem 1rem;"/>
                                    </div>
                                    <div class="d-flex gap-3 mt-4">
                                        <button type="submit" class="btn px-4 py-2 fw-semibold"
                                                style="background:#FFD84D;color:#0A0A0A;border:none;border-radius:8px;">Cập nhật</button>
                                        <a th:href="@{/tai-khoan}" class="btn px-4 py-2 fw-semibold"
                                                style="background:transparent;border:1px solid #2A2A2A;color:#F0F0F0;border-radius:8px;">Quay lại</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
