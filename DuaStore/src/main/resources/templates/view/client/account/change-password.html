<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Đổi mật khẩu — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="ds-section-card">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-6">
                        <div class="ds-card">
                            <div class="ds-card-body">
                                <h4 class="fw-bold mb-1">Đổi mật khẩu</h4>
                                <p class="text-muted mb-4" style="font-size:0.9rem;">Nhập mật khẩu hiện tại và mật khẩu mới</p>

                                <form th:action="@{/tai-khoan/doi-mat-khau}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label">Mật khẩu hiện tại</label>
                                        <input type="password" name="oldPassword" class="form-control" placeholder="Nhập mật khẩu cũ" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Mật khẩu mới</label>
                                        <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6" />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Xác nhận mật khẩu mới</label>
                                        <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required />
                                    </div>
                                    <div class="d-flex gap-3 mt-4">
                                        <button type="submit" class="ds-btn ds-btn-fill">Cập nhật</button>
                                        <a th:href="@{/tai-khoan}" class="ds-btn ds-btn-outline">Quay lại</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </body>
</html>
