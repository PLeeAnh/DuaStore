<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head><title>Hoạt động — DuaStore</title></head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="ds-section-card">
                    <h4 class="fw-bold mb-4"><i class="bi bi-activity me-2"></i>Hoạt động gần đây</h4>

                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="ds-card">
                                <div class="ds-card-header">
                                    <h6 class="fw-bold mb-0"><i class="bi bi-box me-2"></i>Đơn hàng gần đây</h6>
                                </div>
                                <div class="ds-card-body p-0">
                                    <div th:if="${#lists.isEmpty(recentOrders)}" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox" style="font-size:2rem;"></i>
                                        <p class="mt-2">Chưa có đơn hàng nào.</p>
                                    </div>
                                    <div th:each="o : ${recentOrders}" class="d-flex align-items-center gap-3 px-4 py-3 border-bottom" style="border-color:var(--ds-border);">
                                        <div class="flex-shrink-0">
                                            <span class="badge" th:classappend="${o.trangThaiDon == 'CHO_XAC_NHAN' ? 'bg-warning' : o.trangThaiDon == 'DA_XAC_NHAN' ? 'bg-primary' : o.trangThaiDon == 'DANG_GIAO' ? 'bg-info' : o.trangThaiDon == 'DA_GIAO' ? 'bg-success' : o.trangThaiDon == 'DA_HOAN_THANH' ? 'bg-success' : o.trangThaiDon == 'DA_HOAN_TIEN' ? 'bg-secondary' : 'bg-secondary'}"
                                                  th:text="${o.trangThaiDon == 'CHO_XAC_NHAN' ? 'Chờ XN' : o.trangThaiDon == 'DA_XAC_NHAN' ? 'Đã XN' : o.trangThaiDon == 'DANG_GIAO' ? 'Đang giao' : o.trangThaiDon == 'DA_GIAO' ? 'Đã giao' : o.trangThaiDon == 'DA_HUY' ? 'Đã hủy' : o.trangThaiDon == 'DA_HOAN_THANH' ? 'Hoàn tất' : o.trangThaiDon == 'DA_HOAN_TIEN' ? 'Hoàn tiền' : o.trangThaiDon}"></span>
                                        </div>
                                        <div class="flex-grow-1 text-truncate">
                                            <div class="fw-semibold text-truncate" th:text="'Mã đơn: ' + ${o.maDon}"></div>
                                            <small class="text-muted" th:text="${#temporals.format(o.ngayDat, 'dd/MM/yyyy HH:mm')}"></small>
                                        </div>
                                        <div class="text-end flex-shrink-0">
                                            <div class="fw-bold text-danger fmt-price" th:text="${#numbers.formatDecimal(o.tongThanhToan, 0, 'POINT', 0, 'POINT')} + '₫'"></div>
                                            <a th:href="@{'/tai-khoan/don-hang/' + ${o.id}}" class="small text-decoration-none">Chi tiết</a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="ds-card mt-4">
                                <div class="ds-card-header">
                                    <h6 class="fw-bold mb-0"><i class="bi bi-star me-2"></i>Đánh giá gần đây</h6>
                                </div>
                                <div class="ds-card-body p-0">
                                    <div th:if="${#lists.isEmpty(recentReviews)}" class="text-center text-muted py-5">
                                        <i class="bi bi-chat-dots" style="font-size:2rem;"></i>
                                        <p class="mt-2">Chưa có đánh giá nào.</p>
                                    </div>
                                    <div th:each="r : ${recentReviews}" class="px-4 py-3 border-bottom" style="border-color:var(--ds-border);">
                                        <div class="fw-semibold small" th:text="${r.tenSanPham}"></div>
                                        <div class="d-flex align-items-center gap-1 my-1">
                                            <span th:each="i : ${#numbers.sequence(1, 5)}" class="bi" th:classappend="${i <= r.danhGia ? 'bi-star-fill text-warning' : 'bi-star text-muted'}" style="font-size:0.7rem;"></span>
                                        </div>
                                        <p class="mb-0 small text-muted" th:if="${r.binhLuan}" th:text="${r.binhLuan}"></p>
                                        <small class="text-muted" th:text="${#temporals.format(r.ngayTao, 'dd/MM/yyyy')}"></small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="ds-card">
                                <div class="ds-card-header">
                                    <h6 class="fw-bold mb-0"><i class="bi bi-arrow-return-left me-2"></i>Yêu cầu hoàn tiền</h6>
                                </div>
                                <div class="ds-card-body p-0">
                                    <div th:if="${#lists.isEmpty(recentRefunds)}" class="text-center text-muted py-5">
                                        <i class="bi bi-currency-dollar" style="font-size:2rem;"></i>
                                        <p class="mt-2">Chưa có yêu cầu nào.</p>
                                    </div>
                                    <div th:each="rf : ${recentRefunds}" class="px-4 py-3 border-bottom" style="border-color:var(--ds-border);">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="badge" th:classappend="${rf.trangThai == 'CHO_DUYET' ? 'bg-warning' : rf.trangThai == 'DA_DUYET' ? 'bg-success' : 'bg-secondary'}"
                                                  th:text="${rf.trangThai == 'CHO_DUYET' ? 'Chờ duyệt' : rf.trangThai == 'DA_DUYET' ? 'Đã duyệt' : 'Từ chối'}"></span>
                                            <small class="text-muted" th:text="${#temporals.format(rf.ngayYeuCau, 'dd/MM')}"></small>
                                        </div>
                                        <div class="fw-bold text-danger fmt-price small mt-1" th:text="${#numbers.formatDecimal(rf.soTienHoan, 0, 'POINT', 0, 'POINT')} + '₫'"></div>
                                        <p class="mb-0 small text-muted text-truncate" th:text="${rf.lydo}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
