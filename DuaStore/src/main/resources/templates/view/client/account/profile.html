<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Hồ sơ — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <div class="ds-card">
                            <div class="ds-card-body">
                                <h4 class="fw-bold mb-1">Hồ sơ của tôi</h4>
                                <p class="text-muted mb-4" style="font-size:0.9rem;">Quản lý thông tin cá nhân</p>

                                <form th:action="@{/tai-khoan/cap-nhat}" method="post">
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <label class="form-label">Họ tên</label>
                                            <input type="text" name="hoTen" th:value="${user.hoTen}" class="form-control" required />
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Tên đăng nhập</label>
                                            <input type="text" th:value="${user.username}" class="form-control" disabled />
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Email</label>
                                            <input type="email" th:value="${user.email}" class="form-control" disabled />
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Số điện thoại</label>
                                            <input type="text" name="soDienThoai" th:value="${user.soDienThoai}" class="form-control" placeholder="Chưa cập nhật" />
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Vai trò</label>
                                            <input type="text" th:value="${user.role}" class="form-control" disabled />
                                        </div>
                                    </div>
                                    <div class="d-flex gap-3 mt-4">
                                        <button type="submit" class="ds-btn ds-btn-fill">Lưu thay đổi</button>
                                        <a th:href="@{/tai-khoan/doi-mat-khau}" class="ds-btn ds-btn-outline">Đổi mật khẩu</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
