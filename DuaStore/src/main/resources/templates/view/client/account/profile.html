<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head><title>Tài khoản — DuaStore</title></head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5" style="max-width:600px;">
                <div class="ds-section-card">
                    <h4 class="fw-bold mb-4"><i class="bi bi-person-circle me-2"></i>Tài khoản</h4>

                    <div class="ds-card mb-3">
                        <div class="ds-card-body d-flex align-items-center gap-3">
                            <div class="position-relative flex-shrink-0">
                                <img th:if="${user.avatar}" th:src="@{${user.avatar}}" class="ds-profile-avatar lg object-fit-cover" alt="Avatar" style="width:56px;height:56px;border-radius:50%;">
                                <span th:unless="${user.avatar}" class="ds-profile-avatar lg" th:text="${session.userInitial}">A</span>
                                <span class="position-absolute bottom-0 end-0" style="width:14px;height:14px;border-radius:50%;border:2px solid #fff;"
                                      th:classappend="${user.status == 'ONLINE'} ? 'bg-success' : (${user.status == 'AWAY'} ? 'bg-warning' : (${user.status == 'DND'} ? 'bg-danger' : 'bg-secondary'))"></span>
                            </div>
                            <div class="flex-grow-1">
                                <div class="fw-semibold d-flex align-items-center gap-2">
                                    <span th:text="${user.hoTen}">User</span>
                                    <small th:if="${user.nickname}" class="text-muted fw-normal" th:text="'(@' + ${user.nickname} + ')'">(@nick)</small>
                                </div>
                                <small class="text-muted" th:text="${user.email}">user@email.com</small>
                            </div>
                            <a href="#" class="btn btn-outline-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                <i class="bi bi-pencil"></i> Sửa
                            </a>
                        </div>
                    </div>

                    <div class="ds-card mb-3">
                        <div class="ds-card-body">
                            <h6 class="fw-semibold mb-3">Phương thức đăng nhập</h6>
                            <div th:each="prov : ${authProviders}" class="d-flex align-items-center justify-content-between py-2 border-bottom" style="border-color:var(--ds-border);">
                                <div class="d-flex align-items-center gap-2">
                                    <i th:if="${prov.provider == 'GOOGLE'}" class="bi bi-google text-danger"></i>
                                    <i th:if="${prov.provider == 'PASSWORD'}" class="bi bi-shield-lock text-primary"></i>
                                    <span th:text="${prov.provider}">PASSWORD</span>
                                </div>
                                <small class="text-muted" th:text="${#temporals.format(prov.createdAt, 'dd/MM/yyyy')}">01/01/2026</small>
                            </div>
                        </div>
                    </div>

                    <div class="ds-card">
                        <div class="list-group list-group-flush">
                            <a href="#" data-bs-toggle="modal" data-bs-target="#profileModal" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                                <i class="bi bi-person fs-5" style="color:var(--ds-primary);"></i>
                                <div class="flex-grow-1">
                                    <div class="fw-semibold">Hồ sơ</div>
                                    <small class="text-muted">Thông tin cá nhân, số điện thoại</small>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </a>
                            <a th:href="@{/tai-khoan/dia-chi}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                                <i class="bi bi-geo-alt fs-5" style="color:var(--ds-primary);"></i>
                                <div class="flex-grow-1">
                                    <div class="fw-semibold">Địa chỉ</div>
                                    <small class="text-muted">Sổ địa chỉ giao hàng</small>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </a>
                            <a th:href="@{/vi-voucher}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                                <i class="bi bi-wallet2 fs-5" style="color:var(--ds-primary);"></i>
                                <div class="flex-grow-1">
                                    <div class="fw-semibold">Ví Voucher</div>
                                    <small class="text-muted">Phiếu giảm giá của bạn</small>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </a>
                            <a href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                                <i class="bi bi-shield-lock fs-5" style="color:var(--ds-primary);"></i>
                                <div class="flex-grow-1">
                                    <div class="fw-semibold">Đổi mật khẩu</div>
                                    <small class="text-muted">Cập nhật mật khẩu bảo mật</small>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </a>
                            <a th:href="@{/tai-khoan/don-hang}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
                                <i class="bi bi-box fs-5" style="color:var(--ds-primary);"></i>
                                <div class="flex-grow-1">
                                    <div class="fw-semibold">Lịch sử đơn hàng</div>
                                    <small class="text-muted">Theo dõi đơn hàng đã đặt</small>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
