<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title th:text="${post.tieuDe} + ' — DuaStore'">Bài viết — DuaStore</title>
        <meta th:if="${post.metaDescription != null}" name="description" th:content="${post.metaDescription}" />
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/blog}">Bài viết</a></li>
                        <li class="breadcrumb-item active" th:text="${post.tieuDe}">Tieu de</li>
                    </ol>
                </nav>

                <!-- Card: Title + meta -->
                <div class="ds-section-card blog-detail mb-4">
                    <h2 class="fw-bold mb-3" th:text="${post.tieuDe}">Tieu de</h2>
                    <div class="d-flex flex-wrap align-items-center gap-3 text-muted small">
                        <span th:if="${tacGia != null}">
                            <i class="bi bi-person me-1"></i><span th:text="${tacGia}">Tac gia</span>
                        </span>
                        <span>
                            <i class="bi bi-calendar me-1"></i><span th:text="${#temporals.format(post.ngayTao, 'dd/MM/yyyy')}"></span>
                        </span>
                        <span th:if="${post.danhMuc != null}">
                            <i class="bi bi-folder me-1"></i><span th:text="${post.danhMuc.tenDanhMuc}"></span>
                        </span>
                        <span>
                            <i class="bi bi-eye me-1"></i><span th:text="${post.luotXem} + ' lượt xem'"></span>
                        </span>
                        <span th:if="${post.featured}" class="text-warning">
                            <i class="bi bi-star-fill me-1"></i>Nổi bật
                        </span>
                    </div>
                </div>

                <!-- Card: Image + summary + content -->
                <div class="ds-section-card mb-4">
                    <div th:if="${post.hinhAnh != null}" class="mb-4">
                        <img th:src="@{${post.hinhAnh}}" alt="" loading="lazy"
                             class="w-100 rounded"
                             style="max-height:400px;object-fit:cover;" />
                    </div>
                    <div class="blog-content" th:utext="${post.noiDung}">
                    </div>
                </div>

                <!-- Card: Share + back -->
                <div class="ds-section-card mb-4">
                    <div class="d-flex gap-2">
                        <span class="fw-medium small text-muted me-2">Chia sẻ:</span>
                        <a th:href="@{https://www.facebook.com/sharer/sharer.php?u=https://duastore.vn/blog/{slug}(slug=${post.slug != null ? post.slug : post.id})}"
                           target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-facebook"></i></a>
                        <a th:href="@{https://twitter.com/intent/tweet?text={text}&url=https://duastore.vn/blog/{slug}(text=${post.tieuDe}, slug=${post.slug != null ? post.slug : post.id})}"
                           target="_blank" class="btn btn-sm btn-outline-info"><i class="bi bi-twitter-x"></i></a>
                        <a th:href="@{https://www.linkedin.com/shareArticle?mini=true&url=https://duastore.vn/blog/{slug}(slug=${post.slug != null ? post.slug : post.id})}"
                           target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-linkedin"></i></a>
                    </div>
                    <div class="mt-3 pt-3 border-top">
                        <a th:href="@{/blog}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                        </a>
                    </div>
                </div>

                <!-- Card: Related posts -->
                <div class="ds-section-card" th:if="${not #lists.isEmpty(relatedPosts)}">
                    <h5 class="fw-bold mb-4"><i class="bi bi-link me-2"></i>Bài viết liên quan</h5>
                    <div class="row g-4">
                        <div th:each="rp : ${relatedPosts}" class="col-md-3 col-6">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="position-relative overflow-hidden" style="aspect-ratio:16/9;">
                                    <img th:if="${rp.hinhAnh != null}"
                                         th:src="@{${rp.hinhAnh}}" alt=""
                                         class="card-img-top"
                                         style="width:100%;height:100%;object-fit:cover;" />
                                    <div th:unless="${rp.hinhAnh != null}"
                                         class="d-flex align-items-center justify-content-center h-100 bg-light"
                                         style="color:#ccc;font-size:2rem;">
                                        <i class="bi bi-image"></i>
                                    </div>
                                </div>
                                <div class="card-body p-2">
                                    <small class="text-muted d-block" th:text="${#temporals.format(rp.ngayTao, 'dd/MM/yyyy')}"></small>
                                    <h6 class="mt-1" style="font-size:0.85rem;">
                                        <a th:href="@{/blog/{slug}(slug=${rp.slug != null ? rp.slug : rp.id})}"
                                           th:text="${rp.tieuDe}"
                                           class="text-decoration-none text-dark stretched-link"></a>
                                    </h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
