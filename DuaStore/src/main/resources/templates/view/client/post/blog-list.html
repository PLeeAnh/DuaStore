<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Bài viết — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <h4 class="fw-bold mb-4"><i class="bi bi-newspaper me-2"></i>Bài viết</h4>

            <div th:if="${not #lists.isEmpty(featuredPosts)}" class="mb-5">
                <h5 class="fw-bold mb-3"><i class="bi bi-star-fill text-warning me-2"></i>Bài viết nổi bật</h5>
                <div class="row g-3">
                    <div th:each="fp : ${featuredPosts}" class="col-md-4 col-6">
                        <div class="card h-100 border-0 shadow-sm">
                            <div class="position-relative overflow-hidden" style="aspect-ratio:16/9;">
                                <img th:if="${fp.hinhAnh != null}"
                                     th:src="@{${fp.hinhAnh}}" alt=""
                                     class="card-img-top"
                                     style="width:100%;height:100%;object-fit:cover;" />
                                <div th:unless="${fp.hinhAnh != null}"
                                     class="d-flex align-items-center justify-content-center h-100 bg-light"
                                     style="color:#ccc;font-size:2.5rem;">
                                    <i class="bi bi-image"></i>
                                </div>
                                <span class="position-absolute top-0 start-0 badge bg-warning text-dark m-2">
                                    <i class="bi bi-star-fill me-1"></i>Nổi bật
                                </span>
                            </div>
                            <div class="card-body p-3">
                                <small class="text-muted d-block" th:text="${#temporals.format(fp.ngayTao, 'dd/MM/yyyy')}"></small>
                                <h6 class="mt-1" style="font-size:0.85rem;">
                                    <a th:href="@{/blog/{slug}(slug=${fp.slug != null ? fp.slug : fp.id})}"
                                       th:text="${fp.tieuDe}"
                                       class="text-decoration-none text-dark stretched-link"></a>
                                </h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ds-section-card">
            <div class="row g-3 mb-4">
                <div class="col-md-5">
                    <form th:action="@{/blog}" method="get" class="input-group">
                        <input type="text" name="keyword" class="form-control" placeholder="Tìm bài viết..."
                               th:value="${keyword}" />
                        <input type="hidden" name="danhMuc" th:value="${danhMuc}" th:if="${danhMuc != null}" />
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                    </form>
                </div>
                <div class="col-md-3">
                    <select class="form-select" onchange="if(this.value) window.location.href='/blog?danhMuc=' + this.value + (this.value ? '' : ''); else window.location.href='/blog';">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="cat : ${postCategories}"
                                th:value="${cat.id}"
                                th:text="${cat.tenDanhMuc}"
                                th:selected="${danhMuc != null and danhMuc == cat.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/blog}" class="btn btn-outline-secondary w-100" th:if="${keyword != null or danhMuc != null}">Xóa lọc</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(posts)}" class="text-center py-5">
                <i class="bi bi-newspaper" style="font-size:3rem;color:#ccc;"></i>
                <p class="text-muted mt-3">Chưa có bài viết nào.</p>
            </div>

            <div th:unless="${#lists.isEmpty(posts)}" class="row g-4">
                <div th:each="p : ${posts}" class="col-md-4 col-6">
                    <div class="card blog-card h-100 border-0 shadow-sm">
                        <div class="position-relative overflow-hidden" style="aspect-ratio:16/9;">
                            <img th:if="${p.hinhAnh != null}"
                                 th:src="@{${p.hinhAnh}}" alt=""
                                 class="card-img-top"
                                 style="width:100%;height:100%;object-fit:cover;" />
                            <div th:unless="${p.hinhAnh != null}"
                                 class="d-flex align-items-center justify-content-center h-100 bg-light"
                                 style="color:#ccc;font-size:2.5rem;">
                                <i class="bi bi-image"></i>
                            </div>
                            <span th:if="${p.featured}"
                                  class="position-absolute top-0 start-0 badge bg-warning text-dark m-2">
                                <i class="bi bi-star-fill me-1"></i>Nổi bật
                            </span>
                        </div>
                        <div class="card-body d-flex flex-column p-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <small class="text-muted" th:text="${#temporals.format(p.ngayTao, 'dd/MM/yyyy')}"></small>
                                <small th:if="${p.danhMuc != null}" class="text-primary fw-medium">
                                    <span th:text="${p.danhMuc.tenDanhMuc}"></span>
                                </small>
                            </div>
                            <h6 class="card-title mb-2" style="font-size:0.95rem;">
                                <a th:href="@{/blog/{slug}(slug=${p.slug != null ? p.slug : p.id})}"
                                   th:text="${p.tieuDe}"
                                   class="text-decoration-none text-dark stretched-link">Tieu de</a>
                            </h6>
                            <p class="card-text small text-muted mb-0" th:if="${p.tomTat != null}" th:text="${p.tomTat}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/blog(page=${currentPage - 1}, size=${pageSize}, danhMuc=${danhMuc}, keyword=${keyword})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/blog(page=${i}, size=${pageSize}, danhMuc=${danhMuc}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/blog(page=${currentPage + 1}, size=${pageSize}, danhMuc=${danhMuc}, keyword=${keyword})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
        </div>
    </div>
    </body>
</html>
