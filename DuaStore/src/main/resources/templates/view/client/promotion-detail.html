<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Khuyến mãi</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-4">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center py-5">
                    <i class="bi bi-tag text-warning" style="font-size: 3rem;"></i>
                    <h4 class="fw-bold mt-3" th:text="${promotion.tenChuongTrinh}"></h4>
                    <div class="display-6 fw-bold text-danger my-3">
                        <span th:if="${promotion.loaiGiam == 'PHAN_TRAM'}" th:text="${promotion.giaTriGiam} + '%'"></span>
                        <span th:if="${promotion.loaiGiam == 'SO_TIEN'}" th:text="${#numbers.formatDecimal(promotion.giaTriGiam, 0, 0)} + 'đ'"></span>
                    </div>
                    <p class="mb-1">Mã: <strong class="fs-5" th:text="${promotion.maCode}"></strong></p>
                    <p class="text-muted" th:if="${promotion.donHangToiThieu != null && promotion.donHangToiThieu.compareTo(java.math.BigDecimal.ZERO) > 0}">
                        Đơn tối thiểu: <span th:text="${#numbers.formatDecimal(promotion.donHangToiThieu, 0, 0)} + 'đ'"></span>
                    </p>
                    <p class="text-muted small">
                        <span th:if="${promotion.tuNgay != null}" th:text="'Từ: ' + ${#temporals.format(promotion.tuNgay, 'dd/MM/yyyy')}"></span>
                        <span th:if="${promotion.denNgay != null}" th:text="' - Đến: ' + ${#temporals.format(promotion.denNgay, 'dd/MM/yyyy')}"></span>
                    </p>
                    <a th:href="@{/san-pham}" class="btn btn-danger mt-3">Mua sắm ngay</a>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
