<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
<head><title>Sản phẩm đã lưu</title></head>
<body>

<div layout:fragment="content" class="py-5">
    <div class="container-xl">
        <h2 class="fw-bold mb-4"><i class="bi bi-bookmark me-2"></i>Sản phẩm đã lưu</h2>

        <div th:if="${#lists.isEmpty(savedItems)}" class="ds-cart-empty">
            <i class="bi bi-bookmark-dash ds-cart-empty-icon"></i>
            <h2 class="ds-cart-empty-title">Chưa có sản phẩm đã lưu</h2>
            <p class="ds-cart-empty-desc">Bạn chưa lưu sản phẩm nào để mua sau.</p>
            <a th:href="@{/san-pham}" class="ds-cart-empty-btn">Tiếp tục mua sắm</a>
        </div>

        <div th:unless="${#lists.isEmpty(savedItems)}">
            <div class="ds-card ds-card-elevated">
                <div class="ds-cart-header-row d-none d-lg-flex">
                    <div class="ds-cart-header-cell ds-cart-header-product">Sản phẩm</div>
                    <div class="ds-cart-header-cell ds-cart-header-price">Đơn giá</div>
                    <div class="ds-cart-header-cell ds-cart-header-qty">Số lượng</div>
                    <div class="ds-cart-header-cell ds-cart-header-total">Thao tác</div>
                </div>

                <div th:each="item : ${savedItems}" class="ds-cart-item" th:id="'saved-item-' + ${item.id}">
                    <div class="ds-cart-item-left">
                        <img class="ds-cart-image"
                             th:src="${item.hinhAnh != null ? item.hinhAnh : '/images/no-image.png'}"
                             th:alt="${item.tenSanPham}" />
                        <div class="ds-cart-item-info">
                            <a class="ds-cart-item-name"
                               th:href="@{/san-pham/{id}(id=${item.productId})}"
                               th:text="${item.tenSanPham}">Tên SP</a>
                            <div class="ds-cart-item-variant" th:text="${item.tenBienThe}">Biến thể</div>
                        </div>
                    </div>

                    <div class="ds-cart-unit-price">
                        <span class="ds-mobile-label text-muted small">Đơn giá: </span>
                        <span th:text="${#numbers.formatDecimal(item.giaBan, 0, 'POINT', 0, 'POINT')} + '₫'">250.000₫</span>
                    </div>

                    <div class="ds-cart-qty">
                        <span class="fw-semibold" th:text="${item.soLuong}">1</span>
                    </div>

                    <div class="ds-cart-total-price d-flex gap-2 justify-content-end">
                        <form th:action="@{/gio-hang/da-luu/move/{id}(id=${item.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-cart-plus"></i> Chuyển vào giỏ
                            </button>
                        </form>
                        <form th:action="@{/gio-hang/da-luu/remove/{id}(id=${item.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <a th:href="@{/gio-hang}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại giỏ hàng
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
