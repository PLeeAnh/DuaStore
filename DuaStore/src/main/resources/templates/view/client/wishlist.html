<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
<head><title>Sản phẩm yêu thích</title></head>
<body>

<div layout:fragment="content" class="py-5">
    <div class="container-xl">
        <div class="ds-section-card">
            <h2 class="fw-bold mb-4"><i class="bi bi-heart me-2"></i>Sản phẩm yêu thích</h2>

        <div th:if="${#lists.isEmpty(wishlistItems)}" class="ds-cart-empty">
            <i class="bi bi-heartbreak ds-cart-empty-icon"></i>
            <h2 class="ds-cart-empty-title">Chưa có sản phẩm yêu thích</h2>
            <p class="ds-cart-empty-desc">Bạn chưa thêm sản phẩm nào vào danh sách yêu thích.</p>
            <a th:href="@{/san-pham}" class="ds-cart-empty-btn">Tiếp tục mua sắm</a>
        </div>

        <div th:unless="${#lists.isEmpty(wishlistItems)}" class="row g-3">
            <div th:each="item : ${wishlistItems}" class="col-6 col-md-4 col-lg-3">
                <div class="ds-product-card">
                    <div class="ds-product-image-wrap">
                        <a th:href="@{'/san-pham/' + ${item.productId}}">
                            <img th:if="${item.hinhAnh != null}" th:src="@{${item.hinhAnh}}" alt=""
                                 onerror="this.src='/images/no-image.png'" />
                            <i th:if="${item.hinhAnh == null}" class="bi bi-box-seam"></i>
                            <span class="ds-badge-sale" th:if="${item.giaGoc != null and item.giaBan != null and item.giaGoc.compareTo(item.giaBan) > 0}"
                                  th:text="|-${#numbers.formatDecimal((item.giaGoc - item.giaBan) * 100 / item.giaGoc, 0, 0)}%|">-15%</span>
                        </a>
                    </div>
                    <div class="ds-card-body">
                        <a th:href="@{'/san-pham/' + ${item.productId}}" class="ds-product-name"
                           th:text="${item.tenSanPham}">Tên sản phẩm</a>
                        <div class="d-flex align-items-center gap-2 mt-1">
                            <span class="text-danger fw-bold fs-5"
                                  th:text="${#numbers.formatDecimal(item.giaBan, 0, 'POINT', 0, 'POINT')} + '₫'">250.000₫</span>
                            <span th:if="${item.giaGoc != null and item.giaBan != null and item.giaGoc.compareTo(item.giaBan) > 0}"
                                  class="text-muted text-decoration-line-through small"
                                  th:text="${#numbers.formatDecimal(item.giaGoc, 0, 'POINT', 0, 'POINT')} + '₫'">300.000₫</span>
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            <button class="btn btn-outline-danger btn-sm flex-grow-1"
                                    th:onclick="'removeWishlist(' + ${item.productId} + ')'">
                                <i class="bi bi-heartbreak"></i> Xóa
                            </button>
                            <button class="btn btn-outline-primary btn-sm flex-grow-1"
                                    th:onclick="'addToCartFromWishlist(' + ${item.productId} + ')'">
                                <i class="bi bi-cart-plus"></i> Thêm giỏ
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </div>
</div>

<th:block layout:fragment="extra-script">
<script>
    function removeWishlist(productId) {
        if (!productId) return;
        DuaStore.api.post('/api/wishlist/toggle', { productId: productId }).then(function(result) {
            if (!result.ok) { DuaStore.toast.error(result.message); return; }
            var data = result.data;
            if (data.success) {
                DuaStore.toast.success('Đã xóa khỏi danh sách yêu thích');
                window.location.reload();
            }
        });
    }

    function addToCartFromWishlist(productId) {
        if (!productId) return;
        DuaStore.api.post('/api/cart/add-popup', { productId: productId, quantity: 1 }).then(function(result) {
            if (!result.ok) { DuaStore.toast.error(result.message); return; }
            var data = result.data;
            if (data.success) {
                if (typeof updateCartBadge === 'function') updateCartBadge(data.cartCount);
                DuaStore.toast.success('Đã thêm vào giỏ hàng');
            } else {
                DuaStore.toast.error(data.message || 'Không thể thêm vào giỏ');
            }
        });
    }
</script>
</th:block>
</body>
</html>
