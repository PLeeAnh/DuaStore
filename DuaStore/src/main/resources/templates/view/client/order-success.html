<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Đặt hàng thành công — DuaStore</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container-xl py-5">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <div class="text-center mb-4">
                            <i class="bi bi-check-circle text-success" style="font-size:3.5rem;"></i>
                            <h4 class="mt-3 fw-bold">Đặt hàng thành công!</h4>
                            <p class="text-muted">Mã đơn: <strong class="text-dark" th:text="${order.maDon}"></strong></p>
                        </div>

                        <!-- Items -->
                        <div th:if="${!#lists.isEmpty(items)}" class="border rounded p-3 mb-3">
                            <div class="fw-semibold mb-2 small text-muted text-uppercase" style="letter-spacing:.05em;">Sản phẩm đã đặt</div>
                            <div th:each="item : ${items}" class="d-flex align-items-center gap-3 py-2 border-bottom" style="border-color:#f3f4f6!important;">
                                <img th:if="${item.hinhAnhSP != null}" th:src="${item.hinhAnhSP}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #f3f4f6;flex-shrink:0;" />
                                <div class="flex-grow-1 min-w-0">
                                    <div class="fw-semibold" style="font-size:.85rem;" th:text="${item.tenSanPham}"></div>
                                    <div class="text-muted" style="font-size:.75rem;" th:text="${item.tenBienThe}"></div>
                                    <div class="small" style="font-size:.75rem;">
                                        <span th:text="${#numbers.formatDecimal(item.donGia, 0, 'POINT', 0, 'POINT')} + '₫'"></span>
                                        <span class="text-muted"> x </span>
                                        <span th:text="${item.soLuong}"></span>
                                    </div>
                                </div>
                                <div class="fw-semibold text-end flex-shrink-0" style="font-size:.85rem;"
                                     th:text="${#numbers.formatDecimal(item.thanhTien, 0, 'POINT', 0, 'POINT')} + '₫'"></div>
                            </div>
                        </div>

                        <!-- Summary -->
                        <div class="border rounded p-3 mb-3">
                            <div class="fw-semibold mb-2 small text-muted text-uppercase" style="letter-spacing:.05em;">Thông tin thanh toán</div>
                            <div class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">Tạm tính</span>
                                <span th:text="${#numbers.formatDecimal(order.tienHang, 0, 'POINT', 0, 'POINT')} + '₫'"></span>
                            </div>
                            <div class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">Phí vận chuyển</span>
                                <span th:if="${order.phiVanChuyen != null and order.phiVanChuyen > 0}" th:text="${#numbers.formatDecimal(order.phiVanChuyen, 0, 'POINT', 0, 'POINT')} + '₫'"></span>
                                <span th:unless="${order.phiVanChuyen != null and order.phiVanChuyen > 0}">Miễn phí</span>
                            </div>
                            <div th:if="${order.tienGiam != null and order.tienGiam > 0}" class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">Giảm giá</span>
                                <span class="text-danger" th:text="${'-' + #numbers.formatDecimal(order.tienGiam, 0, 'POINT', 0, 'POINT') + '₫'}"></span>
                            </div>
                            <hr class="my-2" style="border-color:#f3f4f6;">
                            <div class="d-flex justify-content-between py-1 fw-bold">
                                <span>Tổng thanh toán</span>
                                <span class="text-danger" style="font-size:1.05rem;" th:text="${#numbers.formatDecimal(order.tongThanhToan, 0, 'POINT', 0, 'POINT')} + '₫'"></span>
                            </div>
                        </div>

                        <!-- Delivery info -->
                        <div class="border rounded p-3 mb-3">
                            <div class="fw-semibold mb-2 small text-muted text-uppercase" style="letter-spacing:.05em;">Thông tin giao hàng</div>
                            <div class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">Người nhận</span>
                                <span class="text-end fw-medium" th:text="${order.tenNguoiNhan}"></span>
                            </div>
                            <div class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">SĐT</span>
                                <span th:text="${order.soDienThoai}"></span>
                            </div>
                            <div class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">Địa chỉ</span>
                                <span class="text-end" style="max-width:280px" th:text="${order.diaChi}"></span>
                            </div>
                            <div class="d-flex justify-content-between py-1 small">
                                <span class="text-muted">Phương thức TT</span>
                                <span th:text="${order.phuongThucTT == 'COD' ? 'Thanh toán khi nhận hàng' : order.phuongThucTT == 'CHUYEN_KHOAN' ? 'Chuyển khoản' : 'VNPay'}"></span>
                            </div>
                        </div>

                        <!-- Support -->
                        <div class="text-center bg-light rounded p-3 mb-4" style="border:1px solid #f3f4f6;">
                            <p class="small text-muted mb-1">Cần hỗ trợ? Liên hệ chúng tôi qua</p>
                            <span class="small fw-medium">hotline@duastore.com</span>
                        </div>

                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/tai-khoan/don-hang/{id}(id=${order.id})}" class="ds-btn ds-btn-outline">Xem đơn hàng</a>
                            <a th:href="@{/}" class="ds-btn ds-btn-fill">Tiếp tục mua sắm</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
