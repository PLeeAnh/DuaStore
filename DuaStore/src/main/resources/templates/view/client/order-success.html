<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Đặt hàng thành công — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6 text-center">
                    <i class="bi bi-check-circle text-success" style="font-size:4rem;"></i>
                    <h4 class="mt-3">Đặt hàng thành công!</h4>
                    <p class="text-muted">Mã đơn hàng: <strong th:text="${order.maDon}"></strong></p>
                    <p>Cảm ơn bạn đã đặt hàng. Chúng tôi sẽ xử lý đơn hàng sớm nhất.</p>
                    <div class="border rounded bg-light p-3 text-start small mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Tổng thanh toán:</span>
                            <strong th:text="${#numbers.formatDecimal(order.tongThanhToan, 0, 0)} + 'đ'"></strong>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Phương thức TT:</span>
                            <span th:text="${order.phuongThucTT == 'COD' ? 'Thanh toán khi nhận hàng' : order.phuongThucTT == 'CHUYEN_KHOAN' ? 'Chuyển khoản' : 'VNPay'}"></span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Địa chỉ:</span>
                            <span class="text-end" style="max-width:250px" th:text="${order.diaChi}"></span>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/tai-khoan/don-hang/{id}(id=${order.id})}" class="ds-btn ds-btn-outline">Xem đơn hàng</a>
                        <a th:href="@{/}" class="ds-btn ds-btn-fill">Tiếp tục mua sắm</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
