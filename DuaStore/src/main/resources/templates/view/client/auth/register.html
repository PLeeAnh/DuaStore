<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Đăng ký — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <div class="card-body">
                            <h3 class="text-center mb-4">Đăng ký</h3>

                            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <form th:action="@{/dang-ky}" method="post">
                                <div class="mb-3">
                                    <label for="hoTen" class="form-label">Họ tên <span class="text-danger">*</span></label>
                                    <input type="text" id="hoTen" name="hoTen" class="form-control" placeholder="Nhập họ tên" required />
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required />
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" id="email" name="email" class="form-control" placeholder="Nhập email" required />
                                </div>
                                <div class="mb-3">
                                    <label for="soDienThoai" class="form-label">Số điện thoại</label>
                                    <input type="tel" id="soDienThoai" name="soDienThoai" class="form-control" placeholder="Nhập số điện thoại" />
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required />
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2">Đăng ký</button>
                            </form>

                            <p class="text-center text-muted mt-3 mb-0 small">
                                Đã có tài khoản?
                                <a th:href="@{/dang-nhap}" class="text-decoration-none">Đăng nhập</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
