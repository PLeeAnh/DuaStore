<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head>
        <title>Đăng nhập — DuaStore</title>
    </head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <div class="card-body">
                            <h3 class="text-center mb-4">Đăng nhập</h3>

                            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <form th:action="@{/dang-nhap}" method="post">
                                <div class="mb-3">
                                    <label for="usernameOrEmail" class="form-label">Tên đăng nhập / Email</label>
                                    <input type="text" id="usernameOrEmail" name="usernameOrEmail"
                                           class="form-control" placeholder="Nhập tên đăng nhập hoặc email"
                                           required autofocus/>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Mật khẩu</label>
                                    <input type="password" id="password" name="password"
                                           class="form-control" placeholder="Nhập mật khẩu" required/>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2">Đăng nhập</button>
                            </form>

                            <p class="text-center text-muted mt-3 mb-0 small">
                                Chưa có tài khoản?
                                <a th:href="@{/dang-ky}" class="text-decoration-none">Đăng ký</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
