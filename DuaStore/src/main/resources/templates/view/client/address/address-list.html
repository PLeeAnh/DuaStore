<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net/thymeleaf/layout" layout:decorate="~{layout/client/base}">
<head><title>Sổ địa chỉ — DuaStore</title></head>
<body>
    <div layout:fragment="content" class="container-xl py-5">
        <div class="row">
            <div class="col-12 col-lg-8 mx-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="ds-section-title mb-0">Địa chỉ của tôi</h2>
                    <a th:href="@{/address/new}" class="ds-btn ds-btn-fill">
                        <i class="bi bi-plus-lg me-1"></i> Thêm địa chỉ mới
                    </a>
                </div>
                <div th:if="${#lists.isEmpty(addresses)}" class="text-center py-5 bg-light rounded-4 border">
                    <i class="bi bi-geo-alt text-muted" style="font-size: 3rem;"></i><p class="mt-3 text-muted">Bạn chưa có địa chỉ giao hàng nào.</p>
                </div>
                <div class="ds-card mb-3" th:each="addr : ${addresses}">
                    <div class="ds-card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0">
                                <span th:text="${addr.tenNguoiNhan}"></span>
                                <span th:if="${addr.isDefault}" class="badge bg-success ms-2 rounded-pill fw-normal" style="font-size: 0.75rem;">Mặc định</span>
                            </h5>
                            <div class="dropdown">
                                <button class="btn btn-light btn-sm rounded-circle" type="button" data-bs-toggle="dropdown"><i class="bi bi-three-dots-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                                    <li><button class="dropdown-item" th:onclick="'openEditModal(' + ${addr.id} + ')'"><i class="bi bi-pencil me-2 text-primary"></i> Sửa địa chỉ</button></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <form th:action="@{/address/delete/{id}(id=${addr.id})}" method="post" onsubmit="return confirm('Xóa địa chỉ này?');">
                                            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-trash me-2"></i> Xóa</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <p class="text-muted mb-1"><i class="bi bi-telephone me-2"></i> <span th:text="${addr.soDienThoai}"></span></p>
                        <p class="text-muted mb-3"><i class="bi bi-geo-alt me-2"></i> <span th:text="${addr.diaChiCuThe + ', ' + addr.phuongXa + ', ' + addr.quanHuyen + ', ' + addr.tinhThanh}"></span></p>
                        <div th:unless="${addr.isDefault}">
                            <form th:action="@{/address/set-default/{id}(id=${addr.id})}" method="post">
                                <button type="submit" class="ds-btn ds-btn-outline ds-btn-sm">Thiết lập mặc định</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Address Modal -->
    <div class="modal fade" id="editAddressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold modal-title">Sửa địa chỉ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId" />
                    <div class="mb-3">
                        <label class="form-label fw-medium small">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" id="editTenNguoiNhan" class="form-control form-control-sm rounded-3" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium small">SĐT <span class="text-danger">*</span></label>
                        <input type="tel" id="editSoDienThoai" class="form-control form-control-sm rounded-3" required />
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-12">
                            <label class="form-label fw-medium small">Số nhà, đường <span class="text-danger">*</span></label>
                            <input type="text" id="editDiaChiCuThe" class="form-control form-control-sm rounded-3" required placeholder="Số 1, Đại Cồ Việt" />
                        </div>
                        <div class="col-md-6 position-relative">
                            <label class="form-label fw-medium small">Tỉnh/Thành phố <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm rounded-3" id="editTinhThanhInput" placeholder="Gõ tên tỉnh/thành..." autocomplete="off" required />
                            <input type="hidden" id="editTinhThanh" />
                            <div id="editTinhThanhSuggest" class="list-group position-absolute w-100 shadow-sm rounded-3" style="z-index:9999;top:100%;display:none;max-height:180px;overflow-y:auto;"></div>
                        </div>
                        <div class="col-md-6 position-relative">
                            <label class="form-label fw-medium small">Quận/Huyện <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm rounded-3" id="editQuanHuyenInput" placeholder="Gõ tên quận/huyện..." autocomplete="off" required />
                            <input type="hidden" id="editQuanHuyen" />
                            <div id="editQuanHuyenSuggest" class="list-group position-absolute w-100 shadow-sm rounded-3" style="z-index:9999;top:100%;display:none;max-height:180px;overflow-y:auto;"></div>
                        </div>
                        <div class="col-md-6 position-relative">
                            <label class="form-label fw-medium small">Phường/Xã <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm rounded-3" id="editPhuongXaInput" placeholder="Gõ tên phường/xã..." autocomplete="off" required />
                            <input type="hidden" id="editPhuongXa" />
                            <div id="editPhuongXaSuggest" class="list-group position-absolute w-100 shadow-sm rounded-3" style="z-index:9999;top:100%;display:none;max-height:180px;overflow-y:auto;"></div>
                        </div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="editIsDefault" />
                        <label class="form-check-label small" for="editIsDefault">Đặt làm địa chỉ mặc định</label>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary btn-sm rounded-pill" onclick="saveEditAddress()">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="extra-script">
    <script>
    var editProvinces = [];
    var editDistricts = [];
    var editWards = [];

    function loadEditProvinces(cb) {
        fetch('/api/location/provinces').then(function(r) { return r.json(); }).then(function(data) {
            editProvinces = data;
            if (cb) cb();
        });
    }

    function loadEditDistricts(provinceCode, cb) {
        fetch('/api/location/districts?provinceCode=' + provinceCode).then(function(r) { return r.json(); }).then(function(data) {
            editDistricts = data;
            if (cb) cb();
        });
    }

    function loadEditWards(districtCode, cb) {
        fetch('/api/location/wards?districtCode=' + districtCode).then(function(r) { return r.json(); }).then(function(data) {
            editWards = data;
            if (cb) cb();
        });
    }

    function setupEditAutocomplete(inputId, suggestId, hiddenId, sourceFn, onSelect) {
        var input = document.getElementById(inputId);
        var box = document.getElementById(suggestId);
        var hidden = document.getElementById(hiddenId);
        var timer;
        if (!input || !box || !hidden) return;
        input.addEventListener('input', function() {
            clearTimeout(timer);
            var q = this.value.toLowerCase().trim();
            if (q.length < 1) { box.style.display = 'none'; hidden.value = ''; return; }
            timer = setTimeout(function() {
                var items = sourceFn().filter(function(x) { return x.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 10);
                box.innerHTML = '';
                if (!items.length) { box.style.display = 'none'; return; }
                items.forEach(function(item) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'list-group-item list-group-item-action py-1 text-start small';
                    btn.textContent = item.name;
                    btn.addEventListener('click', function() {
                        input.value = item.name;
                        hidden.value = item.name;
                        box.style.display = 'none';
                        if (onSelect) onSelect(item);
                    });
                    box.appendChild(btn);
                });
                box.style.display = 'block';
            }, 200);
        });
        input.addEventListener('blur', function() { setTimeout(function() { box.style.display = 'none'; }, 200); });
        input.addEventListener('focus', function() { if (this.value.trim()) this.dispatchEvent(new Event('input')); });
    }

    function openEditModal(id) {
        loadEditProvinces(function() {
            fetch('/address/api/' + id)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.success) { DuaStore.toast.error(data.message || 'Lỗi tải dữ liệu'); return; }
                    document.getElementById('editId').value = data.id;
                    document.getElementById('editTenNguoiNhan').value = data.tenNguoiNhan || '';
                    document.getElementById('editSoDienThoai').value = data.soDienThoai || '';
                    document.getElementById('editDiaChiCuThe').value = data.diaChiCuThe || '';
                    document.getElementById('editPhuongXa').value = data.phuongXa || '';
                    document.getElementById('editQuanHuyen').value = data.quanHuyen || '';
                    document.getElementById('editTinhThanh').value = data.tinhThanh || '';
                    document.getElementById('editIsDefault').checked = data.isDefault === true;

                    document.getElementById('editTinhThanhInput').value = data.tinhThanh || '';
                    var found = editProvinces.find(function(p) { return p.name === data.tinhThanh; });
                    if (found) {
                        loadEditDistricts(found.code, function() {
                            document.getElementById('editQuanHuyenInput').value = data.quanHuyen || '';
                            var dfound = editDistricts.find(function(d) { return d.name === data.quanHuyen; });
                            if (dfound) {
                                loadEditWards(dfound.code, function() {
                                    document.getElementById('editPhuongXaInput').value = data.phuongXa || '';
                                });
                            }
                        });
                    }

                    new bootstrap.Modal(document.getElementById('editAddressModal')).show();
                })
                .catch(function() { DuaStore.toast.error('Lỗi kết nối'); });
        });
    }

    function saveEditAddress() {
        var id = document.getElementById('editId').value;
        var ten = document.getElementById('editTenNguoiNhan').value.trim();
        var sdt = document.getElementById('editSoDienThoai').value.trim();
        var dc = document.getElementById('editDiaChiCuThe').value.trim();
        var px = document.getElementById('editPhuongXa').value.trim();
        var qh = document.getElementById('editQuanHuyen').value.trim();
        var tt = document.getElementById('editTinhThanh').value.trim();

        if (!ten) { DuaStore.toast.warning('Vui lòng nhập họ tên'); return; }
        if (!sdt) { DuaStore.toast.warning('Vui lòng nhập SĐT'); return; }
        if (!dc) { DuaStore.toast.warning('Vui lòng nhập địa chỉ'); return; }
        if (!tt) { DuaStore.toast.warning('Vui lòng nhập tỉnh/thành phố'); return; }
        if (!qh) { DuaStore.toast.warning('Vui lòng nhập quận/huyện'); return; }
        if (!px) { DuaStore.toast.warning('Vui lòng nhập phường/xã'); return; }

        var formData = new URLSearchParams();
        formData.append('id', id);
        formData.append('tenNguoiNhan', ten);
        formData.append('soDienThoai', sdt);
        formData.append('diaChiCuThe', dc);
        formData.append('phuongXa', px);
        formData.append('quanHuyen', qh);
        formData.append('tinhThanh', tt);
        formData.append('isDefault', document.getElementById('editIsDefault').checked);

        fetch('/address/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('editAddressModal'))?.hide();
                location.reload();
            } else {
                DuaStore.toast.error(data.message || 'Lưu thất bại');
            }
        })
        .catch(function() { DuaStore.toast.error('Lỗi kết nối'); });
    }

    document.addEventListener('DOMContentLoaded', function() {
        setupEditAutocomplete('editTinhThanhInput', 'editTinhThanhSuggest', 'editTinhThanh',
            function() { return editProvinces; },
            function(item) {
                document.getElementById('editQuanHuyenInput').value = '';
                document.getElementById('editQuanHuyen').value = '';
                document.getElementById('editPhuongXaInput').value = '';
                document.getElementById('editPhuongXa').value = '';
                editDistricts = [];
                editWards = [];
                loadEditDistricts(item.code);
            }
        );
        setupEditAutocomplete('editQuanHuyenInput', 'editQuanHuyenSuggest', 'editQuanHuyen',
            function() { return editDistricts; },
            function(item) {
                document.getElementById('editPhuongXaInput').value = '';
                document.getElementById('editPhuongXa').value = '';
                editWards = [];
                loadEditWards(item.code);
            }
        );
        setupEditAutocomplete('editPhuongXaInput', 'editPhuongXaSuggest', 'editPhuongXa',
            function() { return editWards; }, null
        );

        document.addEventListener('click', function(e) {
            var ids = ['editTinhThanhInput','editTinhThanhSuggest','editQuanHuyenInput','editQuanHuyenSuggest','editPhuongXaInput','editPhuongXaSuggest'];
            var hide = true;
            for (var i = 0; i < ids.length; i++) { if (e.target.closest('#' + ids[i])) { hide = false; break; } }
            if (hide) {
                document.getElementById('editTinhThanhSuggest').style.display = 'none';
                document.getElementById('editQuanHuyenSuggest').style.display = 'none';
                document.getElementById('editPhuongXaSuggest').style.display = 'none';
            }
        });
    });
    </script>
    </th:block>
</body>
</html>
