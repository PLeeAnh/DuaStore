<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net/thymeleaf/layout" layout:decorate="~{layout/client/base}">
<head>
    <title th:text="${address.id == null ? 'Thêm địa chỉ — DuaStore' : 'Sửa địa chỉ — DuaStore'}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>
    <div layout:fragment="content" class="container-xl py-5">
        <div class="row"><div class="col-12 col-lg-6 mx-auto"><div class="ds-card"><div class="ds-card-body">
            <div class="d-flex align-items-center mb-4">
                <a th:href="${returnUrl != null ? returnUrl : '/address'}" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
                <h3 class="ds-section-title mb-0" th:text="${address.id == null ? 'Thêm địa chỉ mới' : 'Sửa địa chỉ'}"></h3>
                <a th:if="${returnUrl != null}" th:href="${returnUrl}" class="ds-btn ds-btn-outline ds-btn-sm ms-auto">
                    <i class="bi bi-arrow-return-left me-1"></i>Quay lại thanh toán
                </a>
            </div>

            <form th:action="@{/address/save}" th:object="${address}" method="post" id="addressForm">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{userId}" />
                <input type="hidden" name="returnUrl" th:value="${returnUrl}" />
                <input type="hidden" th:field="*{latitude}" id="latitude" />
                <input type="hidden" th:field="*{longitude}" id="longitude" />

                <div class="mb-4">
                    <label class="form-label fw-medium">Địa chỉ trên bản đồ</label>
                    <div class="input-group mb-2 position-relative">
                        <input type="text" id="mapSearchInput" class="form-control rounded-3 py-2"
                               placeholder="Nhập địa chỉ..." autocomplete="off" />
                        <button class="btn btn-primary rounded-3" onclick="searchMap()" type="button">
                            <i class="bi bi-search"></i>
                        </button>
                        <div id="suggestionBox" class="list-group position-absolute w-100 rounded-3 shadow-sm"
                             style="z-index:9999;top:100%;display:none;max-height:250px;overflow-y:auto;"></div>
                    </div>
                    <div id="mapContainer" style="border-radius:10px;overflow:hidden;">
                        <iframe id="googleMapFrame"
                            src="https://maps.google.com/maps?q=Hai+Phong,Vietnam&output=embed&z=13"
                            width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                    <div class="d-flex gap-2 mt-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="getMyLocation()">
                            <i class="bi bi-crosshair me-1"></i>Dùng vị trí hiện tại
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-pill" onclick="clearMap()">
                            <i class="bi bi-x-circle me-1"></i>Xoá
                        </button>
                    </div>
                    <div id="mapStatus" class="form-text small text-muted mt-1"></div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3 py-2" th:field="*{tenNguoiNhan}" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium">SĐT <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control rounded-3 py-2" th:field="*{soDienThoai}" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium">Số nhà, đường <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3 py-2" th:field="*{diaChiCuThe}" id="diaChiCuThe" required placeholder="VD: Số 1, Đại Cồ Việt" />
                    </div>
                    <div class="col-md-6 position-relative">
                        <label class="form-label fw-medium">Tỉnh/Thành phố <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3 py-2" id="tinhThanhInput" placeholder="Gõ tên tỉnh/thành..." autocomplete="off" required />
                        <input type="hidden" th:field="*{tinhThanh}" id="tinhThanh" />
                        <div id="tinhThanhSuggest" class="list-group position-absolute w-100 shadow-sm rounded-3" style="z-index:9999;top:100%;display:none;max-height:200px;overflow-y:auto;"></div>
                    </div>
                    <div class="col-md-6 position-relative">
                        <label class="form-label fw-medium">Quận/Huyện <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3 py-2" id="quanHuyenInput" placeholder="Gõ tên quận/huyện..." autocomplete="off" required />
                        <input type="hidden" th:field="*{quanHuyen}" id="quanHuyen" />
                        <div id="quanHuyenSuggest" class="list-group position-absolute w-100 shadow-sm rounded-3" style="z-index:9999;top:100%;display:none;max-height:200px;overflow-y:auto;"></div>
                    </div>
                    <div class="col-md-6 position-relative">
                        <label class="form-label fw-medium">Phường/Xã <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3 py-2" id="phuongXaInput" placeholder="Gõ tên phường/xã..." autocomplete="off" required />
                        <input type="hidden" th:field="*{phuongXa}" id="phuongXa" />
                        <div id="phuongXaSuggest" class="list-group position-absolute w-100 shadow-sm rounded-3" style="z-index:9999;top:100%;display:none;max-height:200px;overflow-y:auto;"></div>
                    </div>
                </div>

                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{isDefault}" id="isDefaultCheck" />
                    <label class="form-check-label user-select-none" for="isDefaultCheck">Đặt làm địa chỉ mặc định</label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="ds-btn ds-btn-fill">Lưu địa chỉ</button>
                </div>
            </form>
        </div></div></div></div>
    </div>

    <th:block layout:fragment="extra-script">
    <script>
    var addrProvinces = [];
    var addrDistricts = [];
    var addrWards = [];

    function loadAddrProvinces() {
        fetch('/api/location/provinces').then(function(r) { return r.json(); }).then(function(data) {
            addrProvinces = data;
            var cur = document.getElementById('tinhThanh').value;
            if (cur) {
                document.getElementById('tinhThanhInput').value = cur;
                var found = data.find(function(p) { return p.name === cur; });
                if (found) loadAddrDistricts(found.code);
            }
        });
    }
    function loadAddrDistricts(provinceCode) {
        fetch('/api/location/districts?provinceCode=' + provinceCode).then(function(r) { return r.json(); }).then(function(data) {
            addrDistricts = data;
            var cur = document.getElementById('quanHuyen').value;
            if (cur) {
                document.getElementById('quanHuyenInput').value = cur;
                var found = data.find(function(d) { return d.name === cur; });
                if (found) loadAddrWards(found.code);
            }
        });
    }
    function loadAddrWards(districtCode) {
        fetch('/api/location/wards?districtCode=' + districtCode).then(function(r) { return r.json(); }).then(function(data) {
            addrWards = data;
            var cur = document.getElementById('phuongXa').value;
            if (cur) document.getElementById('phuongXaInput').value = cur;
        });
    }

    function setupAddrAutocomplete(inputId, suggestId, hiddenId, sourceFn, onSelect) {
        var input = document.getElementById(inputId);
        var box = document.getElementById(suggestId);
        var hidden = document.getElementById(hiddenId);
        var timer;
        if (!input || !box || !hidden) return;
        input.addEventListener('input', function() {
            clearTimeout(timer);
            var q = this.value.toLowerCase().trim();
            if (q.length < 1) { box.style.display = 'none'; hidden.value = ''; return; }
            timer = setTimeout(function() {
                var items = sourceFn().filter(function(x) { return x.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 10);
                box.innerHTML = '';
                if (!items.length) { box.style.display = 'none'; return; }
                items.forEach(function(item) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'list-group-item list-group-item-action py-1 text-start small';
                    btn.textContent = item.name;
                    btn.addEventListener('click', function() {
                        input.value = item.name;
                        hidden.value = item.name;
                        box.style.display = 'none';
                        if (onSelect) onSelect(item);
                    });
                    box.appendChild(btn);
                });
                box.style.display = 'block';
            }, 200);
        });
        input.addEventListener('blur', function() { setTimeout(function() { box.style.display = 'none'; }, 200); });
        input.addEventListener('focus', function() { if (this.value.trim()) this.dispatchEvent(new Event('input')); });
    }

    function setAddrFromNominatim(diaChi, phuongXa, quanHuyen, tinhThanh) {
        document.getElementById('diaChiCuThe').value = diaChi || '';
        if (tinhThanh) {
            document.getElementById('tinhThanhInput').value = tinhThanh;
            document.getElementById('tinhThanh').value = tinhThanh;
            var found = addrProvinces.find(function(p) { return p.name === tinhThanh; });
            if (found) {
                loadAddrDistricts(found.code);
                setTimeout(function() {
                    if (quanHuyen) {
                        document.getElementById('quanHuyenInput').value = quanHuyen;
                        document.getElementById('quanHuyen').value = quanHuyen;
                        var dfound = addrDistricts.find(function(d) { return d.name === quanHuyen; });
                        if (dfound) {
                            loadAddrWards(dfound.code);
                            setTimeout(function() {
                                if (phuongXa) {
                                    document.getElementById('phuongXaInput').value = phuongXa;
                                    document.getElementById('phuongXa').value = phuongXa;
                                }
                            }, 500);
                        }
                    }
                }, 500);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadAddrProvinces();

        setupAddrAutocomplete('tinhThanhInput', 'tinhThanhSuggest', 'tinhThanh',
            function() { return addrProvinces; },
            function(item) {
                document.getElementById('quanHuyenInput').value = '';
                document.getElementById('quanHuyen').value = '';
                document.getElementById('phuongXaInput').value = '';
                document.getElementById('phuongXa').value = '';
                addrDistricts = [];
                addrWards = [];
                loadAddrDistricts(item.code);
            }
        );
        setupAddrAutocomplete('quanHuyenInput', 'quanHuyenSuggest', 'quanHuyen',
            function() { return addrDistricts; },
            function(item) {
                document.getElementById('phuongXaInput').value = '';
                document.getElementById('phuongXa').value = '';
                addrWards = [];
                loadAddrWards(item.code);
            }
        );
        setupAddrAutocomplete('phuongXaInput', 'phuongXaSuggest', 'phuongXa',
            function() { return addrWards; }, null
        );

        document.addEventListener('click', function(e) {
            var ids = ['tinhThanhInput','tinhThanhSuggest','quanHuyenInput','quanHuyenSuggest','phuongXaInput','phuongXaSuggest'];
            var hide = true;
            for (var i = 0; i < ids.length; i++) { if (e.target.closest('#' + ids[i])) { hide = false; break; } }
            if (hide) {
                document.getElementById('tinhThanhSuggest').style.display = 'none';
                document.getElementById('quanHuyenSuggest').style.display = 'none';
                document.getElementById('phuongXaSuggest').style.display = 'none';
            }
        });
    });

    function setAddrFromNominatim(diaChi, phuongXa, quanHuyen, tinhThanh) {
        document.getElementById('diaChiCuThe').value = diaChi || '';
        if (tinhThanh) {
            document.getElementById('tinhThanhInput').value = tinhThanh;
            document.getElementById('tinhThanh').value = tinhThanh;
            var found = addrProvinces.find(function(p) { return p.name === tinhThanh; });
            if (found) {
                loadAddrDistricts(found.code);
                setTimeout(function() {
                    if (quanHuyen) {
                        document.getElementById('quanHuyenInput').value = quanHuyen;
                        document.getElementById('quanHuyen').value = quanHuyen;
                        var dfound = addrDistricts.find(function(d) { return d.name === quanHuyen; });
                        if (dfound) {
                            loadAddrWards(dfound.code);
                            setTimeout(function() {
                                if (phuongXa) {
                                    document.getElementById('phuongXaInput').value = phuongXa;
                                    document.getElementById('phuongXa').value = phuongXa;
                                }
                            }, 500);
                        }
                    }
                }, 500);
            }
        }
    }

    function searchMap() {
        var q = document.getElementById('mapSearchInput').value.trim();
        if (!q) return;
        var encoded = encodeURIComponent(q + ', Việt Nam');
        document.getElementById('googleMapFrame').src =
            'https://maps.google.com/maps?q=' + encoded + '&output=embed&z=16';
        document.getElementById('mapStatus').textContent = 'Đang tra cứu...';
        fetch('https://nominatim.openstreetmap.org/search?q=' + encoded + '&format=json&limit=1')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data && data.length > 0) {
                    var loc = data[0];
                    document.getElementById('latitude').value = loc.lat;
                    document.getElementById('longitude').value = loc.lon;
                    var parts = (loc.display_name || q).split(',').map(function(s) { return s.trim(); });
                    var len = parts.length;
                    setAddrFromNominatim(
                        len >= 1 ? parts[0] : '',
                        len >= 2 ? parts[len - 3] : '',
                        len >= 3 ? parts[len - 2] : '',
                        len >= 4 ? parts[len - 1] : ''
                    );
                    document.getElementById('mapStatus').textContent = 'Đã tìm: ' + (loc.display_name || q);
                } else {
                    parseAndFillAddress(q);
                    document.getElementById('mapStatus').textContent = 'Đã tìm (không có tọa độ): ' + q;
                }
            })
            .catch(function() {
                parseAndFillAddress(q);
                document.getElementById('mapStatus').textContent = 'Đã tìm (lỗi tra cứu tọa độ): ' + q;
            });
    }

    function getMyLocation() {
        if (!navigator.geolocation) {
            document.getElementById('mapStatus').textContent = 'Trình duyệt không hỗ trợ GPS';
            return;
        }
        document.getElementById('mapStatus').textContent = 'Đang lấy vị trí...';
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            document.getElementById('googleMapFrame').src =
                'https://maps.google.com/maps?q=' + lat + ',' + lng + '&output=embed&z=16';
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json&accept-language=vi')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var a = data.address || {};
                    setAddrFromNominatim(
                        (a.house_number ? a.house_number + ' ' : '') + (a.road || ''),
                        a.quarter || a.neighbourhood || a.village || '',
                        a.suburb || a.county || a.district || '',
                        a.city || a.state || a.town || ''
                    );
                    document.getElementById('mapStatus').textContent =
                        'Vị trí: ' + (data.display_name || lat + ', ' + lng);
                })
                .catch(function() {
                    document.getElementById('mapStatus').textContent = 'Không thể lấy thông tin địa chỉ';
                });
        }, function() {
            document.getElementById('mapStatus').textContent = 'Không thể lấy vị trí. Kiểm tra quyền GPS.';
        });
    }

    function parseAndFillAddress(q) {
        var parts = q.split(',').map(function(s) { return s.trim(); });
        var len = parts.length;
        setAddrFromNominatim(
            len >= 1 ? parts[0] : '',
            len >= 2 ? parts[len - 3] : '',
            len >= 3 ? parts[len - 2] : '',
            len >= 4 ? parts[len - 1] : ''
        );
    }

    function clearMap() {
        document.getElementById('mapSearchInput').value = '';
        document.getElementById('googleMapFrame').src =
            'https://maps.google.com/maps?q=Hai+Phong,Vietnam&output=embed&z=13';
        document.getElementById('latitude').value = '';
        document.getElementById('longitude').value = '';
        document.getElementById('mapStatus').textContent = '';
    }

    document.getElementById('mapSearchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); searchMap(); }
    });

    var debounceTimer;
    document.getElementById('mapSearchInput').addEventListener('input', function() {
        clearTimeout(debounceTimer);
        var q = this.value.trim();
        if (q.length < 3) { document.getElementById('suggestionBox').style.display = 'none'; return; }
        debounceTimer = setTimeout(function() {
            fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q + ', Việt Nam') + '&format=json&limit=5')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var box = document.getElementById('suggestionBox');
                    box.innerHTML = '';
                    if (!data || data.length === 0) { box.style.display = 'none'; return; }
                    data.forEach(function(loc) {
                        var item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'list-group-item list-group-item-action py-2 text-start';
                        item.textContent = loc.display_name;
                        item.addEventListener('click', function() {
                            document.getElementById('mapSearchInput').value = loc.display_name;
                            document.getElementById('latitude').value = loc.lat;
                            document.getElementById('longitude').value = loc.lon;
                            var parts = (loc.display_name || '').split(',').map(function(s) { return s.trim(); });
                            var len = parts.length;
                            setAddrFromNominatim(
                                len >= 1 ? parts[0] : '',
                                len >= 2 ? parts[len - 3] : '',
                                len >= 3 ? parts[len - 2] : '',
                                len >= 4 ? parts[len - 1] : ''
                            );
                            document.getElementById('googleMapFrame').src =
                                'https://maps.google.com/maps?q=' + loc.lat + ',' + loc.lon + '&output=embed&z=16';
                            document.getElementById('mapStatus').textContent = 'Đã chọn: ' + loc.display_name;
                            box.style.display = 'none';
                        });
                        box.appendChild(item);
                    });
                    box.style.display = 'block';
                });
        }, 300);
    });

    document.addEventListener('click', function(e) {
        var box = document.getElementById('suggestionBox');
        if (!e.target.closest('#mapSearchInput') && !e.target.closest('#suggestionBox')) {
            box.style.display = 'none';
        }
    });
    </script>
    </th:block>
</body>
</html>
