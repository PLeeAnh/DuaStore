<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
    <head><title th:text="${product.tenSanPham} + ' — DuaStore'">Chi tiết — DuaStore</title></head>
    <body>
    <div layout:fragment="content">
        <div class="container-xl py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/san-pham}">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" th:text="${product.tenSanPham}">Tên SP</li>
                </ol>
            </nav>

            <div class="row g-4" th:with="defaultVariant=${#lists.isEmpty(variants) ? null : variants[0]}">
                <div class="col-md-5">
                    <div class="position-relative border rounded overflow-hidden bg-light">
                        <img id="mainImage" th:src="@{${product.hinhAnhChinh} ?: '/images/no-image.png'}"
                             th:alt="${product.tenSanPham}" class="w-100" style="aspect-ratio:1/1;object-fit:cover;" />
                    </div>
                </div>
                <div class="col-md-7 product-detail-info">
                    <h3 th:text="${product.tenSanPham}">Tên sản phẩm</h3>
                    <p class="text-muted small mb-1" th:if="${product.thuongHieu}">
                        Thương hiệu: <strong th:text="${product.thuongHieu}">TH</strong>
                    </p>
                    <p class="text-muted small mb-1" th:if="${product.xuatXu}">
                        Xuất xứ: <strong th:text="${product.xuatXu}">XX</strong>
                    </p>

                    <div class="my-3">
                        <span id="productPrice" class="fs-4 fw-bold text-danger me-2"
                              th:text="${defaultVariant.giaKhuyenMai != null
                                        ? #numbers.formatDecimal(defaultVariant.giaKhuyenMai, 0, 'COMMA', 0, 'POINT') + '₫'
                                        : #numbers.formatDecimal(defaultVariant.giaGoc, 0, 'COMMA', 0, 'POINT') + '₫'}">
                            100,000₫
                        </span>
                        <span id="productOriginalPrice" th:if="${defaultVariant.giaKhuyenMai != null}"
                              class="text-decoration-line-through text-muted small"
                              th:text="${#numbers.formatDecimal(defaultVariant.giaGoc, 0, 'COMMA', 0, 'POINT')} + '₫'">
                            120,000₫
                        </span>
                        <span id="stockStatus" th:if="${defaultVariant != null && defaultVariant.soLuongTon <= 0}"
                              class="badge bg-danger ms-2">Hết hàng</span>
                    </div>

                    <div th:if="${product.moTa}" class="mb-3">
                        <p class="text-muted" th:text="${product.moTa}">Mô tả ngắn</p>
                    </div>

                    <!-- Variants grouped by cap type -->
                    <div th:if="${not #lists.isEmpty(variants)}" class="mb-3">
                        <div th:each="entry : ${groupedVariants}">
                            <label class="form-label fw-semibold mt-2 mb-1" th:text="${'▸ ' + entry.key}">Chọn loại nắp</label>
                            <div class="d-flex flex-wrap gap-2 mb-2">
                                <button th:each="v : ${entry.value}"
                                        class="btn btn-sm variant-btn btn-outline-secondary"
                                        th:text="${v.dungTich != null ? v.dungTich + 'ml' : v.tenBienThe}"
                                        th:data-id="${v.id}"
                                        th:data-price="${v.giaKhuyenMai != null ? v.giaKhuyenMai : v.giaGoc}"
                                        th:data-original="${v.giaKhuyenMai != null ? v.giaGoc : ''}"
                                        th:data-image="${v.hinhAnh ?: product.hinhAnhChinh}"
                                        th:data-stock="${v.soLuongTon}"
                                        th:disabled="${v.soLuongTon <= 0}"
                                        type="button">
                                    Variant
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="input-group quantity-group" style="max-width:140px;">
                            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="qtyChange(-1)">−</button>
                            <input type="number" id="qtyInput" class="form-control text-center" value="1" min="1" />
                            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="qtyChange(1)">+</button>
                        </div>
                        <button id="addToCartBtn" class="btn btn-danger flex-grow-1" onclick="addToCart()">
                            <i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ
                        </button>
                    </div>

                    <ul class="list-unstyled small text-muted">
                        <li th:if="${product.chatLieu}"><i class="bi bi-droplet me-1"></i>Chất liệu: <strong th:text="${product.chatLieu}">—</strong></li>
                        <li th:if="${product.mucDichSuDung}"><i class="bi bi-bullseye me-1"></i>Mục đích: <strong th:text="${product.mucDichSuDung}">—</strong></li>
                        <li th:if="${product.leadTimeDays}"><i class="bi bi-clock me-1"></i>Thời gian giao: <strong th:text="${product.leadTimeDays} + ' ngày'">—</strong></li>
                        <li th:if="${product.trangThaiSanPham == 'DAT_TRUOC'}"><i class="bi bi-info-circle me-1"></i>Sản phẩm đặt trước</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="extra-script">
    <script>
        let selectedVariantId = null;
        const productId = [[${product.id}]];

        function initializeVariantSelection() {
            const allBtns = document.querySelectorAll('.variant-btn');
            // Un-select all first
            allBtns.forEach(b => {
                b.classList.remove('btn-danger');
                b.classList.add('btn-outline-secondary');
            });
            // Select first non-disabled variant, or first variant if all disabled
            let target = document.querySelector('.variant-btn:not([disabled])');
            if (!target) target = document.querySelector('.variant-btn');
            if (target) {
                target.classList.remove('btn-outline-secondary');
                target.classList.add('btn-danger');
                selectedVariantId = parseInt(target.dataset.id);
            }
        }

        document.querySelectorAll('.variant-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.variant-btn').forEach(b => {
                    b.classList.remove('btn-danger');
                    b.classList.add('btn-outline-secondary');
                });
                this.classList.remove('btn-outline-secondary');
                this.classList.add('btn-danger');
                selectedVariantId = parseInt(this.dataset.id);

                // Update price
                document.getElementById('productPrice').textContent =
                    parseInt(this.dataset.price).toLocaleString('vi-VN') + '₫';
                const orig = this.dataset.original;
                const origEl = document.getElementById('productOriginalPrice');
                if (origEl) {
                    if (orig) {
                        origEl.textContent = parseInt(orig).toLocaleString('vi-VN') + '₫';
                        origEl.style.display = '';
                    } else {
                        origEl.style.display = 'none';
                    }
                }

                // Update image
                if (this.dataset.image) {
                    document.getElementById('mainImage').src = this.dataset.image;
                }

                // Update stock status
                const stockEl = document.getElementById('stockStatus');
                const stock = parseInt(this.dataset.stock);
                if (stockEl) {
                    stockEl.style.display = (stock <= 0) ? '' : 'none';
                }
            });
        });

        function qtyChange(delta) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) || 1;
            val = Math.max(1, val + delta);
            input.value = val;
        }

        function addToCart() {
            const variantId = selectedVariantId;
            if (!variantId) {
                alert('Vui lòng chọn biến thể sản phẩm');
                return;
            }
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ variantId, soLuong: qty })
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    if (typeof updateCartBadge === 'function') updateCartBadge();
                    alert('Đã thêm vào giỏ hàng!');
                } else {
                    alert(data.message || 'Thêm thất bại');
                }
            }).catch(() => alert('Lỗi kết nối'));
        }

        initializeVariantSelection();
    </script>
    </th:block>
    </body>
</html>
