<div th:fragment="reviews" class="container-xl py-4" id="reviews-section">
    <div class="ds-card p-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 class="fw-bold mb-0" style="font-size:1rem;color:#0F172A">Đánh giá sản phẩm</h5>
            <small th:if="${ratingSummary != null}" class="text-muted" style="font-size:.82rem">
                <span th:if="${ratingSummary.avg > 0}">
                    <span style="color:#F59E0B" th:text="${#numbers.formatDecimal(ratingSummary.avg, 1, 1)}">5.0</span>
                    <span class="mx-1" style="color:#CBD5E1">·</span>
                </span>
                <strong th:text="${ratingSummary.count}">0</strong> đánh giá
            </small>
        </div>
        <div class="d-flex flex-wrap gap-1 mb-4" id="review-star-filters">
            <a th:data-rating="${null}" th:data-all="true" href="javascript:void(0)"
               class="ds-filter-star"
               th:classappend="${reviewRating == null} ? 'active' : ''">Tất cả</a>
            <th:block th:each="star : ${#numbers.sequence(5, 1, -1)}">
                <a th:data-rating="${star}" href="javascript:void(0)"
                   class="ds-filter-star"
                   th:classappend="${reviewRating == star} ? 'active' : ''">
                    <span th:text="${star}">5</span>
                    <span style="color:#F59E0B;margin-left:1px">★</span>
                    <span th:if="${ratingDistribution != null and ratingDistribution.get(star) > 0}"
                          th:text="${'(' + ratingDistribution.get(star) + ')'}"
                          style="font-size:.7rem;opacity:.7;margin-left:2px"></span>
                </a>
            </th:block>
        </div>

        <div th:if="${canReview}" class="ds-card ds-card-elevated mb-4 p-4">
            <form th:action="@{'/san-pham/' + ${productId} + '/danh-gia'}" method="post" th:object="${reviewRequest}" enctype="multipart/form-data" id="reviewForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Chọn số sao</label>
                    <div class="star-rating-input" id="starRatingInput">
                        <span class="star" data-value="1">☆</span>
                        <span class="star" data-value="2">☆</span>
                        <span class="star" data-value="3">☆</span>
                        <span class="star" data-value="4">☆</span>
                        <span class="star" data-value="5">☆</span>
                    </div>
                    <input type="hidden" name="danhGia" id="danhGiaInput" required />
                </div>
                <div class="mb-3">
                    <label for="binhLuan" class="form-label fw-semibold">Nhận xét</label>
                    <textarea name="binhLuan" id="binhLuan" class="form-control" rows="3" placeholder="Chia sẻ trải nghiệm của bạn về sản phẩm..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="hinhAnh" class="form-label fw-semibold">Hình ảnh (tùy chọn, có thể chọn nhiều)</label>
                    <input type="file" name="hinhAnh" id="hinhAnh" class="form-control" accept="image/*" multiple onchange="previewReviewImages(this)"/>
                    <div id="reviewImagePreview" class="d-flex flex-wrap gap-2 mt-2"></div>
                </div>
<!-- previewReviewImages moved to client-product-detail.js -->
                <button type="submit" class="btn btn-danger fw-semibold">Gửi đánh giá</button>
            </form>
        </div>
        <div th:if="${hasReviewed}" class="alert alert-info mb-4">Bạn đã đánh giá sản phẩm này.</div>
        <div th:if="${not #authorization.expression('isAuthenticated()')}" class="alert alert-secondary mb-4">
            <a th:href="@{/dang-nhap}" class="text-decoration-none">Đăng nhập</a> để đánh giá sản phẩm.
        </div>

        <div th:if="${#lists.isEmpty(reviews)}" class="text-muted text-center py-4">
            <i class="bi bi-chat-square-text" style="font-size:2rem;display:block;margin-bottom:.5rem;"></i>
            Chưa có đánh giá nào cho sản phẩm này.
        </div>
        <div th:unless="${#lists.isEmpty(reviews)}" class="row g-3">
            <div class="col-12" th:each="r : ${reviews}">
                <div class="ds-card ds-card-elevated p-3">
                    <div class="d-flex align-items-center mb-2">
                        <div class="star-rating-readonly small" th:data-score="${r.danhGia}"></div>
                        <span class="fw-semibold ms-2" style="font-size:.9rem;" th:text="${r.hoTen}">Người dùng</span>
                        <span class="text-muted ms-auto small" th:text="${#temporals.format(r.ngayTao, 'dd/MM/yyyy')}">01/01/2025</span>
                    </div>
                    <p class="mb-1" style="font-size:.9rem;color:#334155;" th:if="${r.binhLuan}" th:text="${r.binhLuan}">Bình luận</p>
                    <div th:if="${r.hinhAnhList != null and !r.hinhAnhList.isEmpty()}" class="d-flex flex-wrap gap-2 mt-2">
                        <div th:each="img : ${r.hinhAnhList}" style="cursor:pointer;">
                            <img th:src="@{${img}}" alt="Ảnh đánh giá" style="width:80px;height:80px;object-fit:cover;border-radius:8px;" loading="lazy"
                                 onclick="openReviewImage(this)" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${reviewTotalPages > 1}" class="bg-white p-4 rounded-3 shadow-sm border mt-3" style="border-color:#f0f0f0;">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <small class="text-muted fw-medium" style="font-size:.85rem">
                Trang <strong th:text="${reviewCurrentPage + 1}">1</strong> / <strong th:text="${reviewTotalPages}">5</strong> · <strong th:text="${reviewTotalItems}">25</strong> đánh giá
            </small>
            <nav>
                <div class="d-flex align-items-center gap-1">
                    <a th:data-page="${reviewCurrentPage - 1}" href="javascript:void(0)"
                       class="adm-pagination-nav-btn" th:classappend="${reviewCurrentPage == 0} ? 'disabled'"
                       th:tabindex="${reviewCurrentPage == 0} ? -1">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </a>
                    <a th:each="i : ${#numbers.sequence(0, reviewTotalPages - 1)}"
                       th:data-page="${i}" href="javascript:void(0)"
                       class="adm-pagination-btn" th:classappend="${i == reviewCurrentPage} ? 'active'"
                       th:text="${i + 1}">1</a>
                    <a th:data-page="${reviewCurrentPage + 1}" href="javascript:void(0)"
                       class="adm-pagination-nav-btn" th:classappend="${reviewCurrentPage >= reviewTotalPages - 1} ? 'disabled'"
                       th:tabindex="${reviewCurrentPage >= reviewTotalPages - 1} ? -1">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </a>
                </div>
            </nav>
        </div>
    </div>
<!-- Star rating + review form moved to client-product-detail.js -->
</div>
