<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
<head><title>San pham - DuaStore</title></head>
<body>
<div layout:fragment="content">
    <div class="container-xl py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chu</a></li>
                <li class="breadcrumb-item active">San pham</li>
            </ol>
        </nav>

        <div class="row">
            <aside class="col-lg-3 mb-4">
                <div class="list-group shadow-sm">
                    <a th:href="@{/san-pham}"
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                       th:classappend="${selectedCategoryId == null} ? ' active' : ''">
                        Tat ca danh muc
                        <i class="bi bi-grid"></i>
                    </a>
                    <div th:each="cat : ${categories}">
                        <a th:href="@{/san-pham(danhMuc=${cat.id})}"
                           class="list-group-item list-group-item-action fw-semibold"
                           th:classappend="${selectedCategoryId == cat.id} ? ' active' : ''"
                           th:text="${cat.tenDanhMuc}">Danh muc</a>
                        <a th:each="child : ${cat.children}"
                           th:if="${child.active}"
                           th:href="@{/san-pham(danhMuc=${child.id})}"
                           class="list-group-item list-group-item-action ps-4 small"
                           th:classappend="${selectedCategoryId == child.id} ? ' active' : ''"
                           th:text="${child.tenDanhMuc}">Danh muc con</a>
                    </div>
                </div>
            </aside>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span th:if="${keyword != null}">
                        Ket qua tim kiem: "<strong th:text="${keyword}">keyword</strong>"
                    </span>
                    <span th:if="${keyword == null && selectedCategory != null}">
                        Danh muc: <strong th:text="${selectedCategory.tenDanhMuc}">Danh muc</strong>
                    </span>
                    <span th:if="${keyword == null && selectedCategory == null}">
                        <strong th:text="${#lists.size(products)}">0</strong> san pham
                    </span>
                </div>

                <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
                    <i class="bi bi-inbox ds-empty-icon"></i>
                    <p class="text-muted mt-3">Khong tim thay san pham nao</p>
                </div>

                <div th:unless="${#lists.isEmpty(products)}" class="row g-3">
                    <div th:each="p : ${products}" class="col-md-4 col-6">
                        <div class="ds-product-card" th:data-productid="${p.id}"
                             th:with="pVariants=${variantsMap != null ? variantsMap.get(p.id) : null},
                                      v=${pVariants != null and !pVariants.isEmpty()} ? ${pVariants[0]} : null,
                                      fs=${flashSaleMap != null ? flashSaleMap.get(p.id) : null}"
                             th:classappend="${v != null and v.soLuongTon <= 0} ? 'oos' : ''">

                            <button th:classappend="${likedIds != null and #lists.contains(likedIds, p.id)} ? 'btn-wishlist-card active' : 'btn-wishlist-card'"
                                     th:onclick="|toggleWishlist(this, ${p.id})|" title="Thêm vào yêu thích">
                                <i th:class="${likedIds != null and #lists.contains(likedIds, p.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                            </button>

                            <a th:href="@{/san-pham/{id}(id=${p.id})}">
                                <div class="ds-product-img-wrap">
                                    <div class="ds-product-img">
                                        <img th:if="${p.hinhAnhChinh != null}" th:src="@{${p.hinhAnhChinh}}" th:alt="${p.tenSanPham}"/>
                                        <i th:if="${p.hinhAnhChinh == null}" class="bi bi-box-seam"></i>
                                    </div>
                                    <span class="ds-badge-sale" th:if="${v != null and v.giaKhuyenMai != null}"
                                          th:text="|-${#numbers.formatDecimal((v.giaGoc - v.giaKhuyenMai) * 100 / v.giaGoc, 0, 'COMMA', 0, 'POINT')}%|">-15%</span>
                                    <span class="ds-badge-oos" th:if="${v != null and v.soLuongTon <= 0}">Bán hết</span>
                                    <span th:if="${p.trangThaiSanPham == 'DAT_TRUOC'}"
                                           class="badge bg-warning text-dark position-absolute ds-badge-dat-truoc">Đặt trước</span>
                                    <div class="ds-flash-timer" th:if="${fs != null}"
                                         th:data-end="${#temporals.format(fs.ngayKetThuc, 'yyyy-MM-dd\'T\'HH:mm:ss')}">
                                        <i class="bi bi-clock"></i>
                                        <span class="flash-countdown">--:--:--</span>
                                    </div>
                                    <div class="ds-product-name-overlay" th:text="${p.tenSanPham}">Tên SP</div>
                                </div>
                            </a>

                            <div class="ds-card-body">
                                <a th:href="@{/san-pham/{id}(id=${p.id})}" class="ds-product-name" th:text="${p.tenSanPham}">Tên SP</a>

                                <div class="ds-stock-qty-row">
                                <span th:if="${v != null}"
                                      class="ds-stock-info"
                                      th:classappend="${v.soLuongTon le 0} ? 'oos' : (${v.soLuongTon le 3} ? 'warning' : '')"
                                      th:text="${v.soLuongTon le 0} ? 'Hết hàng' : (${v.soLuongTon le 3} ? '⚠ Chỉ còn ' + ${v.soLuongTon} + ' sản phẩm' : 'Còn lại: ' + ${v.soLuongTon} + ' sản phẩm')">Còn lại: 50 sản phẩm</span>

                                <div class="ds-qty-row">
                                    <div class="ds-qty-selector">
                                        <button class="ds-qty-btn ds-qty-minus" type="button" disabled>
                                            <svg width="12" height="2" viewBox="0 0 12 2" fill="none"><path d="M0 1H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                        </button>
                                        <input type="text" class="ds-qty-val" value="1" readonly>
                                        <button class="ds-qty-btn ds-qty-plus" type="button">
                                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 0V12M0 6H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                        </button>
                                    </div>
                                </div>
                                </div>

                                <div class="ds-card-actions">
                                    <div th:if="${groupedVariantsMap != null and groupedVariantsMap.get(p.id) != null}">
                                        <div th:each="groupEntry : ${groupedVariantsMap.get(p.id)}">
                                            <div class="ds-variant-label-text" th:text="${groupEntry.key}">Nắp Gỗ</div>
                                            <div class="ds-variant-row">
                                            <button th:each="pv, stat : ${groupEntry.value}"
                                                    class="ds-variant-chip"
                                                    th:classappend="(${pv.id == v.id} ? 'active' : '') + (${pv.soLuongTon <= 0} ? ' oos' : '')"
                                                    th:data-variantid="${pv.id}"
                                                    th:data-price="${pv.giaKhuyenMai != null ? pv.giaKhuyenMai : pv.giaGoc}"
                                                    th:data-original="${pv.giaKhuyenMai != null ? pv.giaGoc : ''}"
                                                    th:data-stock="${pv.soLuongTon}"
                                                    th:disabled="${pv.soLuongTon <= 0}"
                                                    th:text="${pv.dungTich != null ? pv.dungTich + 'ml' : #strings.substringBefore(pv.tenBienThe, ' - ')}"
                                                    type="button">50ml</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button class="ds-price-btn ds-card-add-cart" type="button"
                                        th:data-id="${p.id}"
                                        th:if="${v != null and v.soLuongTon > 0}">
                                    <span class="ds-price-btn-text">
                                        <strong class="ds-price-btn-amount"
                                                th:text="${#numbers.formatDecimal(v.giaKhuyenMai != null ? v.giaKhuyenMai : v.giaGoc, 0, 'COMMA', 0, 'POINT')} + 'đ'">100.000đ</strong>
                                    </span>
                                    <svg viewBox="0 0 40 45" fill="none" class="btn-wave-svg">
                                        <g>
                                            <path d="M32.75 -0.113639C36.8921 -0.113631 40.25 3.24423 40.25 7.38636V23.8864H24C24 23.8864 19.0142 23.1815 14.4414 12.9108L13.5586 10.8619C8.98539 0.590287 4 -0.113639 4 -0.113639H32.75Z" fill="currentColor"/>
                                            <path d="M34.9814 1.11275C33.8724 -2.87815 29.8554 -4.86581 26.0097 -3.32692L14.0002 1.47882L19.1424 19.98C19.2025 20.1293 21.5511 25.8106 31.7909 27.5645C42.167 29.3418 44.4406 35.1527 44.4406 35.1527L45.4855 38.9127L34.9814 1.11275Z" fill="currentColor"/>
                                        </g>
                                        <path d="M21.7505 5.38635H23.3408C23.579 5.38635 23.7842 5.55445 23.831 5.78805L25.0109 11.672" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
                                        <path d="M33.6904 13.8517H25.3483C24.7579 13.8517 24.2793 13.3731 24.2793 12.7827C24.2793 12.242 24.683 11.7864 25.2198 11.7214L32.6235 10.825" stroke="white" stroke-width="1.05" stroke-linecap="round"/>
                                        <path d="M33.8021 7.07632L23.9922 7.12432L25.0379 11.9759L32.5011 11.2026C32.8915 11.1622 33.2221 10.8971 33.3465 10.5249L34.2788 7.73477C34.3873 7.40996 34.1445 7.07465 33.8021 7.07632Z" fill="white" stroke="white" stroke-width="0.875" stroke-linecap="round"/>
                                        <path d="M32.5444 10.4839L30.4273 10.7039" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
                                        <circle cx="32.4546" cy="15.4545" r="1.19873" fill="white"/>
                                        <circle cx="25.877" cy="15.4546" r="1.19873" fill="white"/>
                                    </svg>
                                </button>
                                <span class="ds-badge-oos-btn" th:unless="${v != null and v.soLuongTon > 0}">Bán hết</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
