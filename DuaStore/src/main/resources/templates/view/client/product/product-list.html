<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/client/base}">
<head><title>San pham - DuaStore</title></head>
<body>
<div layout:fragment="content">
    <div class="container-xl py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chu</a></li>
                <li class="breadcrumb-item active">San pham</li>
            </ol>
        </nav>

        <div class="row">
            <aside class="col-lg-3 mb-4">
                <div class="list-group shadow-sm">
                    <a th:href="@{/san-pham}"
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                       th:classappend="${selectedCategoryId == null} ? ' active' : ''">
                        Tat ca danh muc
                        <i class="bi bi-grid"></i>
                    </a>
                    <div th:each="cat : ${categories}">
                        <a th:href="@{/san-pham(danhMuc=${cat.id})}"
                           class="list-group-item list-group-item-action fw-semibold"
                           th:classappend="${selectedCategoryId == cat.id} ? ' active' : ''"
                           th:text="${cat.tenDanhMuc}">Danh muc</a>
                        <a th:each="child : ${cat.children}"
                           th:if="${child.active}"
                           th:href="@{/san-pham(danhMuc=${child.id})}"
                           class="list-group-item list-group-item-action ps-4 small"
                           th:classappend="${selectedCategoryId == child.id} ? ' active' : ''"
                           th:text="${child.tenDanhMuc}">Danh muc con</a>
                    </div>
                </div>
            </aside>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span th:if="${keyword != null}">
                        Ket qua tim kiem: "<strong th:text="${keyword}">keyword</strong>"
                    </span>
                    <span th:if="${keyword == null && selectedCategory != null}">
                        Danh muc: <strong th:text="${selectedCategory.tenDanhMuc}">Danh muc</strong>
                    </span>
                    <span th:if="${keyword == null && selectedCategory == null}">
                        <strong th:text="${#lists.size(products)}">0</strong> san pham
                    </span>
                </div>

                <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size:3rem;color:#ccc;"></i>
                    <p class="text-muted mt-3">Khong tim thay san pham nao</p>
                </div>

                <div th:unless="${#lists.isEmpty(products)}" class="row g-3">
                    <div th:each="p : ${products}" class="col-md-4 col-6">
                        <div class="card product-card h-100 border-0 shadow-sm">
                            <div class="position-relative overflow-hidden" style="aspect-ratio:1/1;">
                                <img th:src="@{${p.hinhAnhChinh} ?: '/images/no-image.png'}"
                                     th:alt="${p.tenSanPham}"
                                     class="card-img-top"
                                     style="width:100%;height:100%;object-fit:cover;" />
                                <span th:if="${p.trangThaiSanPham == 'DAT_TRUOC'}"
                                      class="badge bg-warning text-dark position-absolute top-0 start-0 m-2">Dat truoc</span>
                            </div>
                            <div class="card-body d-flex flex-column p-3">
                                <h6 class="card-title mb-1" style="font-size:0.9rem;">
                                    <a th:href="@{/san-pham/{id}(id=${p.id})}"
                                       th:text="${p.tenSanPham}"
                                       class="text-decoration-none text-dark stretched-link">Ten SP</a>
                                </h6>
                                <p class="card-text small text-muted mb-2" th:text="${p.thuongHieu ?: ''}">Thuong hieu</p>
                                <div class="mt-auto">
                                    <span th:if="${priceMap.containsKey(p.id)}"
                                          class="fw-bold text-danger"
                                          style="font-size:1rem;"
                                          th:text="${priceMap.get(p.id)}">100,000d</span>
                                    <span th:unless="${priceMap.containsKey(p.id)}"
                                          class="fw-bold text-danger"
                                          style="font-size:1rem;">Lien he</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
