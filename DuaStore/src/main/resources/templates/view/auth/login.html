<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập — DuaStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body {
            background: #0A0A0A;
            color: #F0F0F0;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #141414;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(255,216,77,0.05);
        }
        .auth-logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #FFD84D;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.25rem;
            color: #F0F0F0;
        }
        .auth-sub {
            font-size: 0.85rem;
            color: #8A8A8A;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-label { color: #B0B0B0; font-size: 0.85rem; font-weight: 500; }
        .form-control {
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            color: #F0F0F0;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-size: 0.9rem;
        }
        .form-control:focus {
            background: #1A1A1A;
            border-color: #FFD84D;
            box-shadow: 0 0 0 2px rgba(255,216,77,0.15);
            color: #F0F0F0;
        }
        .btn-primary {
            background: #FFD84D;
            border: none;
            color: #0A0A0A;
            font-weight: 700;
            padding: 0.65rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #FFE066; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,216,77,0.3); }
        .btn-outline-google {
            background: transparent;
            border: 1px solid #2A2A2A;
            color: #F0F0F0;
            border-radius: 8px;
            padding: 0.65rem;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-outline-google:hover { background: #1A1A1A; border-color: #444; }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: #555; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2A2A2A; }
        .auth-link { color: #FFD84D; text-decoration: none; font-weight: 500; }
        .auth-link:hover { text-decoration: underline; }
        .alert-danger { background: #2A1515; border: 1px solid #4A2020; color: #FF6B6B; border-radius: 8px; font-size: 0.85rem; }
        .alert-success { background: #152A15; border: 1px solid #204A20; color: #6BFF6B; border-radius: 8px; font-size: 0.85rem; }
        .form-check-label { color: #8A8A8A; font-size: 0.85rem; }
        .form-check-input { background: #1A1A1A; border-color: #2A2A2A; }
        .form-check-input:checked { background: #FFD84D; border-color: #FFD84D; }
        input::placeholder { color: #555; }
    </style>
</head>
<body>
    <div class="auth-card">
        <a th:href="@{/}" class="auth-logo">DuaStore</a>
        <div class="auth-title">Đăng nhập</div>
        <div class="auth-sub">Đăng nhập để mua sắm và quản lý đơn hàng</div>

        <div th:if="${param.error}" class="alert alert-danger mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>Sai tên đăng nhập hoặc mật khẩu
        </div>
        <div th:if="${param.expired}" class="alert alert-danger mb-3">
            <i class="bi bi-clock me-2"></i>Phiên đăng nhập đã hết hạn
        </div>
        <div th:if="${successMsg}" class="alert alert-success mb-3">
            <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        </div>

        <form th:action="@{/dang-nhap}" method="post">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required autofocus/>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required/>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"/>
                    <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                </div>
                <a th:href="@{/quen-mat-khau}" class="auth-link" style="font-size:0.85rem">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>

        <div class="divider">HOẶC</div>

        <a th:href="@{/oauth2/authorization/google}" class="btn-outline-google w-100">
            <i class="bi bi-google"></i> Đăng nhập bằng Google
        </a>

        <div class="text-center mt-4" style="font-size:0.85rem;color:#8A8A8A">
            Chưa có tài khoản? <a th:href="@{/dang-ky}" class="auth-link">Đăng ký ngay</a>
        </div>
    </div>
</body>
</html>
