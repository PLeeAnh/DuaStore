<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      >
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Đăng nhập — DuaStore</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body class="ds-auth-page-body">
        <div class="ds-auth-wrapper">
            <a th:href="@{/}" class="ds-auth-logo">DuaStore</a>
            <div class="ds-card">
                <div class="ds-card-body">
                    <div class="ds-auth-title">Đăng nhập</div>
                    <div class="ds-auth-sub">Đăng nhập để mua sắm và quản lý đơn hàng</div>

                    <div th:if="${loginErrorMessage}" class="alert alert-danger mb-3 py-2">
                        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${loginErrorMessage}"></span>
                    </div>
                    <div th:if="${param.error and loginErrorMessage == null}" class="alert alert-danger mb-3 py-2">
                        <i class="bi bi-exclamation-triangle me-2"></i>Sai tên đăng nhập hoặc mật khẩu
                    </div>
                    <div th:if="${param.expired}" class="alert alert-danger mb-3 py-2">
                        <i class="bi bi-clock me-2"></i>Phiên đăng nhập đã hết hạn
                    </div>
                    <div th:if="${successMsg}" class="alert alert-success mb-3 py-2">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
                    </div>

                    <form th:action="@{/dang-nhap}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required
                                   autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required/>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"/>
                                <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                            </div>
                            <a th:href="@{/quen-mat-khau}" class="ds-auth-page-link">Quên mật khẩu?</a>
                        </div>
                        <button type="submit" class="ds-btn ds-btn-fill w-100" style="justify-content:center;">Đăng nhập
                        </button>
                    </form>

                    <div class="ds-auth-divider">HOẶC</div>

                    <a href="#"
                       onclick="event.preventDefault();openGoogleAuth()"
                       class="ds-auth-page-google">
                        <i class="bi bi-google"></i> Đăng nhập bằng Google
                    </a>

                    <div class="text-center mt-4" style="font-size:0.85rem;color:var(--ds-gray-500);">
                        Chưa có tài khoản? <a th:href="@{/dang-ky}" class="ds-auth-page-link">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
