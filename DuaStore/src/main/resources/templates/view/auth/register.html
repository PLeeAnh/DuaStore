<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:object="${registerRequest}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng ký — DuaStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body {
            background: #0A0A0A;
            color: #F0F0F0;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #141414;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 0 40px rgba(255,216,77,0.05);
        }
        .auth-logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #FFD84D;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-title { font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; color: #F0F0F0; }
        .auth-sub { font-size: 0.85rem; color: #8A8A8A; text-align: center; margin-bottom: 2rem; }
        .form-label { color: #B0B0B0; font-size: 0.85rem; font-weight: 500; }
        .form-control {
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            color: #F0F0F0;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-size: 0.9rem;
        }
        .form-control:focus {
            background: #1A1A1A;
            border-color: #FFD84D;
            box-shadow: 0 0 0 2px rgba(255,216,77,0.15);
            color: #F0F0F0;
        }
        .form-control.is-invalid { border-color: #FF4D6A; box-shadow: 0 0 0 2px rgba(255,77,106,0.15); }
        .invalid-feedback { color: #FF6B6B; font-size: 0.8rem; }
        .btn-primary {
            background: #FFD84D;
            border: none;
            color: #0A0A0A;
            font-weight: 700;
            padding: 0.65rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #FFE066; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,216,77,0.3); }
        .auth-link { color: #FFD84D; text-decoration: none; font-weight: 500; }
        .auth-link:hover { text-decoration: underline; }
        input::placeholder { color: #555; }
    </style>
</head>
<body>
    <div class="auth-card">
        <a th:href="@{/}" class="auth-logo">DuaStore</a>
        <div class="auth-title">Đăng ký tài khoản</div>
        <div class="auth-sub">Tạo tài khoản để mua sắm tại DuaStore</div>

        <form th:action="@{/dang-ky}" method="post">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Họ tên <span class="text-danger">*</span></label>
<input type="text" th:field="*{hoTen}" class="form-control" placeholder="Nguyễn Văn A" maxlength="100"
       th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="username"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Số điện thoại</label>
                    <input type="tel" th:field="*{soDienThoai}" class="form-control" placeholder="0901234567" pattern="(84|0)[0-9]{9}" title="Số điện thoại gồm 10 số, bắt đầu bằng 0 hoặc 84"/>
                </div>
                <div class="col-6">
                    <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="col-6">
                    <label class="form-label">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">Đăng ký</button>

            <div class="text-center mt-3" style="font-size:0.85rem;color:#8A8A8A">
                Đã có tài khoản? <a th:href="@{/dang-nhap}" class="auth-link">Đăng nhập</a>
            </div>
        </form>
    </div>
</body>
</html>
