<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:object="${registerRequest}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng ký — DuaStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="ds-auth-page-body">
    <div class="ds-auth-wrapper ds-auth-wrapper-wide">
        <a th:href="@{/}" class="ds-auth-logo">DuaStore</a>
        <div class="ds-card">
            <div class="ds-card-body">
                <div class="ds-auth-title">Đăng ký tài khoản</div>
                <div class="ds-auth-sub">Tạo tài khoản để mua sắm tại DuaStore</div>

                <form th:action="@{/dang-ky}" method="post">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{hoTen}" class="form-control" placeholder="Nguyễn Văn A" maxlength="100"
                                   th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="username"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel" th:field="*{soDienThoai}" class="form-control" placeholder="0901234567" pattern="(84|0)[0-9]{9}" title="Số điện thoại gồm 10 số, bắt đầu bằng 0 hoặc 84"/>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <button type="submit" class="ds-btn ds-btn-fill w-100 mt-4" style="justify-content:center;">Đăng ký</button>

                    <div class="text-center mt-3" style="font-size:0.85rem;color:var(--ds-gray-500);">
                        Đã có tài khoản? <a th:href="@{/dang-nhap}" class="ds-auth-page-link">Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
