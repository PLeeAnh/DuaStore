<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập thành công</title>
  <style>
    body { font-family:Arial; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f5f5f5; }
    .box { text-align:center; padding:40px; background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.1); }
    .check { font-size:48px; color:#4caf50; }
    p { color:#616161; margin-top:8px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="check">&#10003;</div>
    <p>Đăng nhập thành công!</p>
  </div>
  <script>
    if (window.opener && window.opener !== window) {
      window.opener.location.reload();
      window.close();
    } else {
      window.location.href = '/';
    }
  </script>
</body>
</html>
