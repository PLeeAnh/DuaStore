<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Đặt lại mật khẩu — DuaStore</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body class="ds-auth-page-body">
        <div class="ds-auth-wrapper">
            <a th:href="@{/}" class="ds-auth-logo">DuaStore</a>
            <div class="ds-card">
                <div class="ds-card-body">
                    <div class="ds-auth-title">Đặt lại mật khẩu</div>
                    <div class="ds-auth-sub">Nhập mật khẩu mới cho tài khoản của bạn</div>

                    <div th:if="${errorMsg}" class="alert alert-danger mb-3 py-2">
                        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
                    </div>

                    <div th:if="${errorMsg}" class="text-center mt-3">
                        <a th:href="@{/quen-mat-khau}" class="ds-auth-page-link">Yêu cầu lại link đặt lại mật khẩu</a>
                    </div>

                    <form th:if="${token != null}" th:action="@{/dat-lai-mat-khau}" method="post">
                        <input type="hidden" name="token" th:value="${token}"/>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required/>
                        </div>
                        <button type="submit" class="ds-btn ds-btn-fill w-100" style="justify-content:center;">Đặt lại mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
