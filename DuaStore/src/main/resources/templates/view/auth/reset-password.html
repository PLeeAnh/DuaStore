<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đặt lại mật khẩu — DuaStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body { background:#0A0A0A; color:#F0F0F0; font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .auth-card { background:#141414; border:1px solid #2A2A2A; border-radius:16px; padding:2.5rem; width:100%; max-width:420px; }
        .auth-logo { font-family:'Dancing Script',cursive; font-size:2rem; color:#FFD84D; text-decoration:none; display:block; text-align:center; margin-bottom:1.5rem; }
        .auth-title { font-size:1.25rem; font-weight:700; text-align:center; color:#F0F0F0; }
        .auth-sub { font-size:0.85rem; color:#8A8A8A; text-align:center; margin-bottom:2rem; }
        .form-label { color:#B0B0B0; font-size:0.85rem; font-weight:500; }
        .form-control { background:#1A1A1A; border:1px solid #2A2A2A; color:#F0F0F0; border-radius:8px; padding:0.65rem 1rem; font-size:0.9rem; }
        .form-control:focus { background:#1A1A1A; border-color:#FFD84D; box-shadow:0 0 0 2px rgba(255,216,77,0.15); color:#F0F0F0; }
        .btn-primary { background:#FFD84D; border:none; color:#0A0A0A; font-weight:700; padding:0.65rem; border-radius:8px; }
        .btn-primary:hover { background:#FFE066; }
        .auth-link { color:#FFD84D; text-decoration:none; font-weight:500; }
        .alert-danger { background:#2A1515; border:1px solid #4A2020; color:#FF6B6B; border-radius:8px; font-size:0.85rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <a th:href="@{/}" class="auth-logo">DuaStore</a>
        <div class="auth-title">Đặt lại mật khẩu</div>
        <div class="auth-sub">Nhập mật khẩu mới cho tài khoản của bạn</div>

        <div th:if="${errorMsg}" class="alert alert-danger mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        </div>

        <div th:if="${errorMsg}" class="text-center mt-3">
            <a th:href="@{/quen-mat-khau}" class="auth-link">Yêu cầu lại link đặt lại mật khẩu</a>
        </div>

        <form th:if="${token != null}" th:action="@{/dat-lai-mat-khau}" method="post">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Đặt lại mật khẩu</button>
        </form>
    </div>
</body>
</html>
