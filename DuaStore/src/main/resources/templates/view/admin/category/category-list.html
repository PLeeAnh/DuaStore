<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
<head><title>Quản lý danh mục</title></head>
<body>
<th:block layout:fragment="breadcrumb">
    <li class="breadcrumb-item active" aria-current="page">Danh mục</li>
</th:block>
<div layout:fragment="content">
    <div class="adm-page-header">
        <h4><i class="bi bi-tags me-2"></i>Danh mục</h4>
        <a th:href="@{/admin/danh-muc/them-moi}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Thêm mới
        </a>
    </div>

    <div class="adm-table-wrap">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Tên danh mục</th>
                <th>Danh mục cha</th>
                <th>Mô tả</th>
                <th class="text-center">Thứ tự</th>
                <th class="text-center">Trạng thái</th>
                <th class="text-center">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categories}">
                <td th:text="${cat.id}">1</td>
                <td>
                    <span class="fw-semibold" th:text="${cat.tenDanhMuc}">Tên danh mục</span>
                </td>
                <td>
                    <span th:if="${cat.parent != null}" th:text="${cat.parent.tenDanhMuc}">Cha</span>
                    <span th:unless="${cat.parent != null}" class="text-muted">Gốc</span>
                </td>
                <td class="text-muted" th:text="${cat.moTa ?: '-'}">Mô tả</td>
                <td class="text-center" th:text="${cat.thuTuHienThi ?: 0}">0</td>
                <td class="text-center">
                    <span th:if="${cat.active}" class="badge bg-success">Hiển thị</span>
                    <span th:unless="${cat.active}" class="badge bg-secondary">Ẩn</span>
                </td>
                <td class="text-center">
                    <a th:href="@{/admin/danh-muc/sua/{id}(id=${cat.id})}"
                       class="btn btn-outline-primary btn-sm me-1" title="Sửa">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/admin/danh-muc/xoa/{id}(id=${cat.id})}" method="post" style="display:inline" onsubmit="return confirm('Ẩn danh mục này?')">
                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Ẩn"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="7" class="text-muted text-center py-4">Chưa có danh mục nào</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
