<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý danh mục</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
        <li class="breadcrumb-item active" aria-current="page">Danh mục</li>
    </th:block>
    <div layout:fragment="content">
        <!-- ★ TODO [Danh mục]: Implement trang danh sách danh mục
             
             Cấu trúc gợi ý:
             1. Page header: adm-page-header với tiêu đề Danh mục + nút Thêm mới
             2. Nội dung: adm-table-wrap chứa table danh sách
                - Cột: #, Tên, Mô tả, Trạng thái (badge), Ngày tạo, Thao tác
             3. Mỗi dòng có nút Sửa / Xóa
             4. Pagination nếu cần
             
             Xem dashboard.html để tham khảo cấu trúc.
             Link sidebar active: th:classappend="${title == 'Danh mục' ? ' active' : ''}"
        -->
        <div class="adm-page-header">
            <h4><i class="bi bi-tags me-2"></i>Danh mục</h4>
            <a th:href="@{/admin/category/them-moi}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>#</th><th>Tên</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                    <tr><td colspan="5" class="text-muted text-center py-4">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </body>
</html>
