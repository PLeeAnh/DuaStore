<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý hoàn tiền</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Hoàn tiền</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                    <i class="bi bi-arrow-return-left"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4>Hoàn tiền</h4>
                        <div class="adm-detail-meta">Quản lý yêu cầu hoàn tiền từ khách hàng.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="adm-tab-nav">
            <a class="adm-tab" th:classappend="${orderTab == 'don-hang' ? ' active' : ''}" th:href="@{/admin/don-hang}">
                <i class="bi bi-bag-check"></i>Đơn hàng
            </a>
            <a class="adm-tab" th:classappend="${orderTab == 'hoan-tien' ? ' active' : ''}" th:href="@{/admin/hoan-tien}">
                <i class="bi bi-arrow-return-left"></i>Hoàn tiền
            </a>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="adm-card text-center">
                    <div class="text-muted small mb-1">Chờ duyệt</div>
                    <div class="fw-bold fs-5 text-warning" th:text="${pendingCount}">0</div>
                </div>
            </div>
        </div>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Mã đơn</th>
                        <th>Người yêu cầu</th>
                        <th>Số tiền</th>
                        <th>Lý do</th>
                        <th>Trạng thái</th>
                        <th>Ngày yêu cầu</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${refunds}">
                        <td th:text="${r.id}"></td>
                        <td th:text="${r.orderId}"></td>
                        <td th:text="${r.userId}"></td>
                        <td th:text="${#numbers.formatDecimal(r.soTienHoan, 0, 'POINT', 0, 'POINT')} + '₫'"></td>
                        <td>
                            <span th:text="${r.lydo != null and r.lydo.length() > 50 ? r.lydo.substring(0, 50) + '...' : r.lydo}" class="text-muted small"></span>
                        </td>
                        <td>
                            <span th:if="${r.trangThai == 'CHO_DUYET'}" class="status-pill status-CHO_DUYET">Chờ duyệt</span>
                            <span th:if="${r.trangThai == 'DA_DUYET'}" class="status-pill status-DA_DUYET">Đã duyệt</span>
                            <span th:if="${r.trangThai == 'TU_CHOI'}" class="status-pill status-TU_CHOI">Từ chối</span>
                        </td>
                        <td th:text="${#temporals.format(r.ngayYeuCau, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/admin/hoan-tien/detail/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> Xem chi tiết
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(refunds)}">
                        <td colspan="8" class="text-muted text-center py-4">Chưa có yêu cầu hoàn tiền nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
