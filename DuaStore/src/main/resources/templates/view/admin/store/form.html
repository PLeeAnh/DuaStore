<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Thông tin cửa hàng</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Cửa hàng</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                    <i class="bi bi-geo-alt"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4>Thông tin cửa hàng</h4>
                        <div class="adm-detail-meta">Cấu hình thông tin và vị trí cửa hàng.</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="adm-card">
            <div class="adm-card-body">
                <form th:action="@{/admin/cua-hang}" method="post" data-dirty-bar class="row g-3">
                    <div class="col-12">
                        <h6 class="fw-semibold border-bottom pb-2"><i class="bi bi-info-circle me-1"></i>Thông tin cơ bản</h6>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tên cửa hàng</label>
                        <input type="text" name="store_name" class="form-control"
                               th:value="${settings.get('store_name')}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" name="store_phone" class="form-control"
                               th:value="${settings.get('store_phone')}" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="store_email" class="form-control"
                               th:value="${settings.get('store_email')}" />
                    </div>
                    <div class="col-12">
                        <label class="form-label">Địa chỉ <small class="text-muted">(Gõ địa chỉ để tìm kiếm)</small></label>
                        <input type="text" id="storeAddress" name="store_address" class="form-control"
                               th:value="${settings.get('store_address')}"
                               placeholder="Nhập địa chỉ cửa hàng..." autocomplete="off" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Vĩ độ (Latitude)</label>
                        <input type="number" id="storeLatitude" name="store_latitude" class="form-control"
                               th:value="${settings.get('store_latitude')}" step="any" readonly />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Kinh độ (Longitude)</label>
                        <input type="number" id="storeLongitude" name="store_longitude" class="form-control"
                               th:value="${settings.get('store_longitude')}" step="any" readonly />
                    </div>
                    <div class="col-12">
                        <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-geo-alt me-1"></i>Vị trí trên bản đồ</h6>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Bản đồ</label>
                        <div id="map" style="width:100%;height:350px;border-radius:8px;border:1px solid var(--ef-border);background:#e9ecef"></div>
                    </div>
                    <div class="col-12">
                        <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-clock me-1"></i>Giờ hoạt động</h6>
                    </div>
                    <div class="col-12">
                        <input type="hidden" name="store_business_hours" id="businessHoursInput"
                               th:value="${settings.get('store_business_hours')}" />
                        <div id="businessHoursEditor">
                            <div class="d-flex gap-2 mb-3 flex-wrap" id="bhDayBtns">
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="mon" style="width:40px;height:40px" title="Thứ Hai">T2</button>
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="tue" style="width:40px;height:40px" title="Thứ Ba">T3</button>
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="wed" style="width:40px;height:40px" title="Thứ Tư">T4</button>
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="thu" style="width:40px;height:40px" title="Thứ Năm">T5</button>
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="fri" style="width:40px;height:40px" title="Thứ Sáu">T6</button>
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="sat" style="width:40px;height:40px" title="Thứ Bảy">T7</button>
                                <button type="button" class="btn btn-sm rounded-circle bh-day-btn" data-day="sun" style="width:40px;height:40px" title="Chủ Nhật">CN</button>
                            </div>
                            <div id="bhDayPanel" style="display:none" class="border rounded-3 p-3 mb-3">
                                <div class="d-flex align-items-center gap-4 mb-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="bhAllDay" />
                                        <label class="form-check-label" for="bhAllDay">Mở cả ngày</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="bhClosed" />
                                        <label class="form-check-label" for="bhClosed">Đóng cửa</label>
                                    </div>
                                </div>
                                <div id="bhSlots"></div>
                                <a href="javascript:void(0)" id="bhAddSlot" class="small text-primary fw-semibold">Thêm giờ hoạt động</a>
                            </div>
                            <div id="bhSelectedDays" class="small text-muted mb-2"></div>
                        </div>
                        <style>
                            .bh-day-btn{border:2px solid #dee2e6;background:#fff;color:#495057;font-weight:600;font-size:.8rem;transition:all .15s;display:flex;align-items:center;justify-content:center}
                            .bh-day-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff}
                        </style>
                    </div>
                    <div class="col-12">
                        <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-images me-1"></i>Ảnh cửa hàng</h6>
                    </div>
                    <div class="col-12">
                        <div class="gallery-upload-zone" id="storeImagesZone" style="cursor:pointer">
                            <input type="file" accept="image/*" multiple hidden id="storeImagesFile" />
                            <div class="gallery-upload-content">
                                <i class="bi bi-cloud-arrow-up"></i>
                                <p>Click để thêm ảnh vào bộ sưu tập</p>
                                <small class="text-muted">Hỗ trợ JPG, PNG, WEBP</small>
                            </div>
                        </div>
                        <input type="hidden" name="store_images" id="storeImagesInput"
                               th:value="${settings.get('store_images')}" />
                        <div id="storeGalleryGrid" class="adm-gallery-grid mt-3">
                            <th:block th:if="${settings.get('store_images') != null and settings.get('store_images') != ''}">
                                <th:block th:each="img : ${#strings.listSplit(settings.get('store_images'), ',')}">
                                    <div class="adm-gallery-item store-img-item" th:data-url="${#strings.trim(img)}">
                                        <img th:src="${#strings.trim(img)}" alt="Ảnh cửa hàng" />
                                        <div class="adm-gallery-action">
                                            <button type="button" class="btn btn-sm btn-danger btn-icon store-img-remove" style="width:28px;height:28px;font-size:12px"><i class="bi bi-trash"></i></button>
                                        </div>
                                    </div>
                                </th:block>
                            </th:block>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="extra-script">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
        <div id="leaflet-container">
            <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
            <script>
            (function() {
                var bhInput = document.getElementById('businessHoursInput');
                if (!bhInput) return;
                var bhData = {};
                try { bhData = JSON.parse(bhInput.value || '{}'); } catch(e) { bhData = {}; }

                var allDays = ['mon','tue','wed','thu','fri','sat','sun'];
                var selectedDays = new Set();
                var dayBtns = document.getElementById('bhDayBtns');
                var dayPanel = document.getElementById('bhDayPanel');
                var bhAllDay = document.getElementById('bhAllDay');
                var bhClosed = document.getElementById('bhClosed');
                var bhSlots = document.getElementById('bhSlots');
                var bhAddSlot = document.getElementById('bhAddSlot');
                var bhSelectedLabel = document.getElementById('bhSelectedDays');

                function ensureDay(day) {
                    if (!bhData[day]) bhData[day] = {open:false, allDay:false, slots:[]};
                }

                function initTimeInputs() {
                }

                function renderButtons() {
                    dayBtns.querySelectorAll('.bh-day-btn').forEach(function(btn) {
                        var d = btn.dataset.day;
                        btn.classList.toggle('selected', selectedDays.has(d));
                    });
                }

                function renderSelectedLabel() {
                    if (selectedDays.size === 0) {
                        bhSelectedLabel.textContent = '';
                        return;
                    }
                    var names = [];
                    selectedDays.forEach(function(d) {
                        if (d==='mon') names.push('T2'); else if (d==='tue') names.push('T3');
                        else if (d==='wed') names.push('T4'); else if (d==='thu') names.push('T5');
                        else if (d==='fri') names.push('T6'); else if (d==='sat') names.push('T7');
                        else if (d==='sun') names.push('CN');
                    });
                    bhSelectedLabel.textContent = 'Áp dụng cho: ' + names.join(', ');
                }

                function getSelectedData() {
                    var ref = null;
                    selectedDays.forEach(function(d) {
                        ensureDay(d);
                        if (!ref) ref = JSON.parse(JSON.stringify(bhData[d]));
                    });
                    return ref;
                }

                function renderSlots() {
                    var data = getSelectedData();
                    if (!data || selectedDays.size === 0) {
                        dayPanel.style.display = 'none';
                        return;
                    }
                    dayPanel.style.display = '';
                    bhAllDay.checked = !!data.allDay;
                    bhClosed.checked = !data.open;
                    bhSlots.innerHTML = '';
                    if (data.allDay || !data.open) {
                        bhSlots.style.display = 'none';
                        bhAddSlot.style.display = 'none';
                    } else {
                        bhSlots.style.display = '';
                        bhAddSlot.style.display = '';
                        (data.slots || []).forEach(function(slot, idx) {
                            var row = document.createElement('div');
                            row.className = 'd-flex align-items-center gap-3 mb-2';
                            row.innerHTML =
                                '<div style="flex:1">' +
                                    '<label class="small text-muted">Giờ mở cửa</label>' +
                                    '<input type="time" class="form-control form-control-sm bh-slot-open time-input" data-idx="' + idx + '" value="' + (slot.open||'') + '" step="60" />' +
                                '</div>' +
                                '<div style="flex:1">' +
                                    '<label class="small text-muted">Giờ đóng cửa</label>' +
                                    '<input type="time" class="form-control form-control-sm bh-slot-close time-input" data-idx="' + idx + '" value="' + (slot.close||'') + '" step="60" />' +
                                '</div>' +
                                '<button type="button" class="btn btn-sm mt-3 bh-slot-remove" data-idx="' + idx + '" style="color:#dc3545;border:none;font-size:1.1rem" title="Xóa"><i class="bi bi-x-lg"></i></button>';
                            bhSlots.appendChild(row);
                        });
                        initTimeInputs();
                    }
                }

                function applyToSelected(patch) {
                    selectedDays.forEach(function(d) {
                        ensureDay(d);
                        Object.assign(bhData[d], patch);
                    });
                    renderButtons();
                    renderSelectedLabel();
                    renderSlots();
                    saveBH();
                }

                dayBtns.addEventListener('click', function(e) {
                    var btn = e.target.closest('.bh-day-btn');
                    if (!btn) return;
                    var d = btn.dataset.day;
                    if (selectedDays.has(d)) {
                        selectedDays.delete(d);
                    } else {
                        selectedDays.add(d);
                    }
                    renderButtons();
                    renderSelectedLabel();
                    renderSlots();
                });

                bhAllDay.addEventListener('change', function() {
                    if (this.checked) {
                        selectedDays.forEach(function(d) {
                            ensureDay(d);
                            bhData[d].allDay = true;
                            bhData[d].open = true;
                            bhData[d].slots = [];
                        });
                        bhClosed.checked = false;
                    } else {
                        var firstDay = null;
                        selectedDays.forEach(function(d) { if (!firstDay) firstDay = d; });
                        if (firstDay) {
                            ensureDay(firstDay);
                            bhData[firstDay].allDay = false;
                            bhData[firstDay].open = true;
                            bhData[firstDay].slots = [{open:'08:00', close:'19:00'}];
                        }
                        bhClosed.checked = false;
                    }
                    renderButtons(); renderSelectedLabel(); renderSlots(); saveBH();
                });

                bhClosed.addEventListener('change', function() {
                    if (this.checked) {
                        selectedDays.forEach(function(d) {
                            ensureDay(d);
                            bhData[d].open = false;
                            bhData[d].allDay = false;
                            bhData[d].slots = [];
                        });
                        bhAllDay.checked = false;
                    } else {
                        selectedDays.forEach(function(d) {
                            ensureDay(d);
                            bhData[d].open = true;
                        });
                    }
                    renderButtons(); renderSelectedLabel(); renderSlots(); saveBH();
                });

                bhAddSlot.addEventListener('click', function() {
                    if (selectedDays.size === 0) return;
                    var firstDay = null;
                    selectedDays.forEach(function(d) { if (!firstDay) firstDay = d; });
                    ensureDay(firstDay);
                    if (!bhData[firstDay].allDay && bhData[firstDay].open) {
                        if (!bhData[firstDay].slots) bhData[firstDay].slots = [];
                        bhData[firstDay].slots.push({open:'', close:''});
                    }
                    renderSlots(); saveBH();
                });

                bhSlots.addEventListener('click', function(e) {
                    var rmBtn = e.target.closest('.bh-slot-remove');
                    if (!rmBtn) return;
                    var idx = parseInt(rmBtn.dataset.idx);
                    var firstDay = null;
                    selectedDays.forEach(function(d) { if (!firstDay) firstDay = d; });
                    if (firstDay && bhData[firstDay] && bhData[firstDay].slots && bhData[firstDay].slots[idx]) {
                        bhData[firstDay].slots.splice(idx, 1);
                    }
                    renderSlots(); saveBH();
                });

                bhSlots.addEventListener('input', function(e) {
                    var idx = parseInt(e.target.dataset.idx);
                    var val = e.target.value;
                    var firstDay = null;
                    selectedDays.forEach(function(d) { if (!firstDay) firstDay = d; });
                    if (firstDay && bhData[firstDay] && bhData[firstDay].slots && bhData[firstDay].slots[idx]) {
                        if (e.target.classList.contains('bh-slot-open')) bhData[firstDay].slots[idx].open = val;
                        if (e.target.classList.contains('bh-slot-close')) bhData[firstDay].slots[idx].close = val;
                    }
                    saveBH();
                });

                function saveBH() {
                    var toSave = JSON.parse(JSON.stringify(bhData));
                    bhInput.value = JSON.stringify(toSave);
                }

                allDays.forEach(function(d) {
                    if (bhData[d] && (bhData[d].open || bhData[d].allDay || (bhData[d].slots && bhData[d].slots.length))) {
                        selectedDays.add(d);
                    }
                });
                renderButtons();
                renderSelectedLabel();
                renderSlots();

                var storeImagesInput = document.getElementById('storeImagesInput');
                var galleryGrid = document.getElementById('storeGalleryGrid');

                function refreshGallery() {
                    var urls = storeImagesInput.value ? storeImagesInput.value.split(',').map(function(s){return s.trim()}).filter(Boolean) : [];
                    galleryGrid.innerHTML = '';
                    urls.forEach(function(url) {
                        var div = document.createElement('div');
                        div.className = 'adm-gallery-item store-img-item';
                        div.dataset.url = url;
                        div.innerHTML = '<img src="' + url + '" alt="Ảnh cửa hàng" />' +
                            '<div class="adm-gallery-action">' +
                                '<button type="button" class="btn btn-sm btn-danger btn-icon store-img-remove" style="width:28px;height:28px;font-size:12px"><i class="bi bi-trash"></i></button>' +
                            '</div>';
                        galleryGrid.appendChild(div);
                    });
                }

                galleryGrid.addEventListener('click', function(e) {
                    var btn = e.target.closest('.store-img-remove');
                    if (!btn) return;
                    var item = btn.closest('.store-img-item');
                    if (!item) return;
                    var url = item.dataset.url;
                    var urls = storeImagesInput.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
                    urls = urls.filter(function(u){ return u !== url });
                    storeImagesInput.value = urls.join(',');
                    refreshGallery();
                });

                document.getElementById('storeImagesZone').addEventListener('click', function() {
                    document.getElementById('storeImagesFile').click();
                });

                document.getElementById('storeImagesFile').addEventListener('change', function() {
                    var files = Array.from(this.files);
                    if (!files.length) return;
                    var uploaded = [];
                    var done = 0;
                    files.forEach(function(file) {
                        var fd = new FormData();
                        fd.append('file', file);
                        fetch('/admin/cua-hang/upload', { method: 'POST', body: fd })
                            .then(function(r){ return r.json(); })
                            .then(function(data){
                                if (data.url) uploaded.push(data.url);
                                done++;
                                if (done === files.length) {
                                    var urls = storeImagesInput.value ? storeImagesInput.value.split(',').map(function(s){return s.trim()}).filter(Boolean) : [];
                                    urls = urls.concat(uploaded);
                                    storeImagesInput.value = urls.join(',');
                                    refreshGallery();
                                }
                            })
                            .catch(function(){
                                done++;
                                if (done === files.length && uploaded.length) {
                                    var urls = storeImagesInput.value ? storeImagesInput.value.split(',').map(function(s){return s.trim()}).filter(Boolean) : [];
                                    urls = urls.concat(uploaded);
                                    storeImagesInput.value = urls.join(',');
                                    refreshGallery();
                                }
                            });
                    });
                    this.value = '';
                });

                (function waitLeaflet() {
                    if (typeof L !== 'undefined') {
                        initLeafletMap();
                        return;
                    }
                    setTimeout(waitLeaflet, 100);
                })();
            })();

            function initLeafletMap() {
                var latInput = document.getElementById('storeLatitude');
                var lngInput = document.getElementById('storeLongitude');
                var addrInput = document.getElementById('storeAddress');
                var lat = parseFloat(latInput?.value) || 20.8565;
                var lng = parseFloat(lngInput?.value) || 106.6756;
                var mapEl = document.getElementById('map');

                var map = L.map(mapEl, { center: [lat, lng], zoom: 15, zoomControl: true });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
                var marker = L.marker([lat, lng], { draggable: true }).addTo(map);

                function reverseGeocode(latlng) {
                    var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + latlng.lat + '&lon=' + latlng.lng + '&addressdetails=1&accept-language=vi';
                    fetch(url, { headers: { 'User-Agent': 'DuaStore/1.0' } })
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            if (data && data.display_name) {
                                addrInput.value = data.display_name;
                            }
                        });
                }

                marker.on('dragend', function() {
                    var p = marker.getLatLng();
                    latInput.value = p.lat.toFixed(6);
                    lngInput.value = p.lng.toFixed(6);
                    reverseGeocode(p);
                });
                map.on('click', function(e) {
                    marker.setLatLng(e.latlng);
                    latInput.value = e.latlng.lat.toFixed(6);
                    lngInput.value = e.latlng.lng.toFixed(6);
                    reverseGeocode(e.latlng);
                });

                var searchTimeout;
                addrInput.addEventListener('input', function() {
                    clearTimeout(searchTimeout);
                    var q = this.value.trim();
                    if (q.length < 3) return;
                    searchTimeout = setTimeout(function() {
                        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q + ', Việt Nam') + '&limit=5&accept-language=vi', { headers: { 'User-Agent': 'DuaStore/1.0' } })
                            .then(function(r) { return r.json(); })
                            .then(function(results) {
                                if (results && results.length) {
                                    var r = results[0];
                                    var lat = parseFloat(r.lat);
                                    var lng = parseFloat(r.lon);
                                    map.setView([lat, lng], 15);
                                    marker.setLatLng([lat, lng]);
                                    latInput.value = lat.toFixed(6);
                                    lngInput.value = lng.toFixed(6);
                                }
                            });
                    }, 500);
                });

                if (addrInput.value) {
                    fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(addrInput.value + ', Việt Nam') + '&limit=1&accept-language=vi', { headers: { 'User-Agent': 'DuaStore/1.0' } })
                        .then(function(r) { return r.json(); })
                        .then(function(results) {
                            if (results && results.length) {
                                var r = results[0];
                                var lat = parseFloat(r.lat);
                                var lng = parseFloat(r.lon);
                                map.setView([lat, lng], 15);
                                marker.setLatLng([lat, lng]);
                                latInput.value = lat.toFixed(6);
                                lngInput.value = lng.toFixed(6);
                            }
                        });
                }
            }
        </script>
        </div>
    </th:block>
</body>
</html>
