<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý liên kết chân trang</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Liên kết chân trang</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-link-45deg"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h4>Liên kết chân trang</h4>
                            <div class="adm-detail-meta">Quản lý các liên kết hiển thị ở chân trang website.</div>
                        </div>
                        <a th:href="@{/admin/footer-links/them-moi}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Thêm liên kết
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="adm-table-wrap">
            <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Tiêu đề</th>
                        <th>Đường dẫn</th>
                        <th>Cột</th>
                        <th>Thứ tự</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l, iter : ${links}">
                        <td th:text="${iter.index + 1}"></td>
                        <td th:text="${l.title}"></td>
                        <td>
                            <a th:href="${l.url}" target="_blank" rel="noopener noreferrer" class="text-truncate d-inline-block" style="max-width:300px" th:text="${l.url}"></a>
                        </td>
                        <td th:text="${'Cột ' + l.columnIndex}"></td>
                        <td th:text="${l.displayOrder}"></td>
                        <td>
                            <span th:if="${l.isActive}" class="status-pill status-DANG_HIEN_THI">Đang hiển thị</span>
                            <span th:unless="${l.isActive}" class="status-pill status-TAM_DUNG">Ẩn</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/footer-links/sua/{id}(id=${l.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/footer-links/xoa/{id}(id=${l.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Xóa liên kết này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(links)}">
                        <td colspan="7" class="text-muted text-center py-4">Chưa có liên kết nào</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</body>
</html>
