<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head><title>Quản lý sản phẩm — Form</title></head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/san-pham}">Sản phẩm</a></li>
        <li class="breadcrumb-item active" th:text="${product.id != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm'">Form</li>
    </th:block>
    <div layout:fragment="content">

        <div class="adm-page-header">
            <div class="adm-page-header-top">
                <h4><i class="bi bi-box me-2"></i><span th:text="${product.id != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm'">Thêm sản phẩm</span></h4>
            </div>
            <p th:text="${product.id != null} ? 'Chỉnh sửa thông tin sản phẩm.' : 'Tạo sản phẩm mới cho cửa hàng.'">Thông tin sản phẩm.</p>
        </div>

        <div class="adm-tab-nav">
            <a class="adm-tab" th:classappend="${productTab == 'thong-tin' ? ' active' : ''}" th:href="@{/admin/san-pham}">
                <i class="bi bi-list-ul"></i>Danh sách
            </a>
            <a class="adm-tab" th:classappend="${productTab == 'bien-the' ? ' active' : ''}" th:href="@{/admin/san-pham/bien-the}">
                <i class="bi bi-diagram-3"></i>Biến thể
            </a>
            <a class="adm-tab" th:classappend="${productTab == 'hinh-anh' ? ' active' : ''}" th:href="@{/admin/san-pham/hinh-anh}">
                <i class="bi bi-images"></i>Hình ảnh
            </a>
        </div>
        <div class="adm-card"><div class="adm-card-body">
            <form th:action="${product.id != null} ? @{/admin/san-pham/sua/{id}(id=${product.id})} : @{/admin/san-pham/them-moi}"
                  th:object="${product}" method="post" enctype="multipart/form-data" class="row g-3">
                <input type="hidden" th:field="*{id}" />

                <div class="col-md-8">
                    <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{tenSanPham}" class="form-control" required />
                    <div th:if="${#fields.hasErrors('tenSanPham')}" th:errors="*{tenSanPham}" class="text-danger small"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                    <select th:field="*{danhMucId}" class="form-select" required>
                        <option value="">— Chọn danh mục —</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.tenDanhMuc}">DM</option>
                    </select>
                    <div th:if="${#fields.hasErrors('danhMucId')}" th:errors="*{danhMucId}" class="text-danger small"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Chất liệu</label>
                    <input type="text" th:field="*{chatLieu}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Xuất xứ</label>
                    <input type="text" th:field="*{xuatXu}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Thương hiệu</label>
                    <input type="text" th:field="*{thuongHieu}" class="form-control" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mục đích sử dụng</label>
                    <input type="text" th:field="*{mucDichSuDung}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Loại kính</label>
                    <input type="text" th:field="*{kinhLoai}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Lead time (ngày)</label>
                    <input type="number" th:field="*{leadTimeDays}" class="form-control" min="0" />
                </div>

                <div class="col-12">
                    <label class="form-label">Mô tả sản phẩm</label>
                    <textarea th:field="*{moTa}" class="form-control" rows="6"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ảnh chính</label>
                    <input type="file" name="hinhAnhFile" class="form-control" accept="image/*" />
                    <div th:if="${product.hinhAnhChinh}" class="mt-2">
                        <img th:src="@{${product.hinhAnhChinh}}" alt="preview" style="max-width:120px;border-radius:6px;" />
                        <input type="hidden" th:field="*{hinhAnhChinh}" />
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label">Bộ sưu tập ảnh (Gallery)</label>

                    <!-- Upload zone -->
                    <div class="gallery-upload-zone" id="galleryUploadZone">
                        <input type="file" name="galleryFiles" id="galleryInput" accept="image/*" multiple hidden />
                        <div class="gallery-upload-content">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <p>Kéo thả ảnh vào đây hoặc Click để chọn ảnh</p>
                            <small>Hỗ trợ JPG, PNG, WEBP</small>
                        </div>
                    </div>

                    <!-- Preview các ảnh mới chọn (chưa lưu) -->
                    <div class="gallery-preview" id="galleryPreview"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Trạng thái</label>
                    <select th:field="*{trangThaiSanPham}" class="form-select">
                        <option value="DANG_BAN">Đang bán</option>
                        <option value="DAT_TRUOC">Đặt trước</option>
                        <option value="NGUNG_BAN">Ngừng bán</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="form-check">
                        <input type="checkbox" th:field="*{featured}" class="form-check-input" id="featured" />
                        <label class="form-check-label" for="featured">Sản phẩm nổi bật</label>
                    </div>
                </div>

                <div class="col-12 border-top pt-3">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu</button>
                    <a th:href="@{/admin/san-pham}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>

            <!-- Ảnh đã lưu (outside main form to avoid nested form) -->
            <div th:if="${not #lists.isEmpty(galleryImages)}" class="row g-3 mt-0">
                <div class="col-12">
                    <div class="gallery-saved">
                        <label class="form-label">Ảnh đã lưu</label>
                        <div class="d-flex flex-wrap gap-2">
                            <div th:each="img : ${galleryImages}" class="gallery-saved-item">
                                <img th:src="@{${img.imageUrl}}" alt="gallery" />
                                <form th:action="@{/admin/san-pham/xoa-anh/{id}(id=${img.id})}" method="post" onsubmit="return confirm('Xoá ảnh này?')" style="position:absolute;top:5px;right:5px;margin:0;padding:0;">
                                    <button type="submit" class="gallery-remove-btn" style="position:static;display:flex;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:13px;cursor:pointer;align-items:center;justify-content:center;padding:0;">✕</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div></div>
    </div>

    <th:block layout:fragment="extra-script">
    <script>
        (function() {
            const zone = document.getElementById('galleryUploadZone');
            const input = document.getElementById('galleryInput');
            const preview = document.getElementById('galleryPreview');
            const form = input.closest('form');
            let filesArray = [];

            zone.addEventListener('click', () => input.click());

            input.addEventListener('change', () => {
                if (input.files) addFiles(Array.from(input.files));
                input.value = '';
            });

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('gallery-upload-zone--dragover');
            });
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('gallery-upload-zone--dragover');
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('gallery-upload-zone--dragover');
                if (e.dataTransfer.files) addFiles(Array.from(e.dataTransfer.files));
            });

            function addFiles(newFiles) {
                for (const f of newFiles) {
                    if (!f.type.startsWith('image/')) continue;
                    filesArray.push(f);
                }
                renderPreview();
            }

            window.removeGalleryFile = function(index) {
                filesArray.splice(index, 1);
                renderPreview();
            };

            function renderPreview() {
                preview.innerHTML = '';
                filesArray.forEach((f, i) => {
                    const url = URL.createObjectURL(f);
                    const div = document.createElement('div');
                    div.className = 'gallery-preview-item';
                    div.innerHTML =
                        '<img src="' + url + '" alt="" />' +
                        '<button type="button" class="gallery-remove-btn" onclick="removeGalleryFile(' + i + ')">✕</button>';
                    preview.appendChild(div);
                });
            }

            // Trước khi submit, thêm gallery files vào FormData
            form.addEventListener('formdata', (e) => {
                for (const f of filesArray) e.formData.append('galleryFiles', f);
            });
        })();
    </script>
    </th:block>
    </body>
</html>
