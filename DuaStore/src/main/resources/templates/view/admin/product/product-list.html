<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head><title>Quản lý sản phẩm</title></head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active">Sản phẩm</li>
    </th:block>
    <div layout:fragment="content">

        <div class="adm-page-header">
            <div>
                <h4 class="mb-0"><i class="bi bi-box me-2"></i>Sản phẩm</h4>
                <p class="mb-0">Quản lý tất cả sản phẩm trong cửa hàng. (<span th:text="${totalItems}">0</span> sản phẩm)</p>
            </div>
            <a th:href="@{/admin/san-pham/them-moi}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>

        <div class="adm-tab-nav">
            <a class="adm-tab" th:classappend="${productTab == 'thong-tin' ? ' active' : ''}" th:href="@{/admin/san-pham}">
                <i class="bi bi-list-ul"></i>Danh sách
            </a>
            <a class="adm-tab" th:classappend="${productTab == 'bien-the' ? ' active' : ''}" th:href="@{/admin/san-pham/bien-the}">
                <i class="bi bi-diagram-3"></i>Biến thể
            </a>
            <a class="adm-tab" th:classappend="${productTab == 'thong-so' ? ' active' : ''}" th:href="@{/admin/san-pham/thong-so}">
                <i class="bi bi-sliders"></i>Thông số
            </a>
            <a class="adm-tab" th:classappend="${productTab == 'hinh-anh' ? ' active' : ''}" th:href="@{/admin/san-pham/hinh-anh}">
                <i class="bi bi-images"></i>Hình ảnh
            </a>
        </div>

        <!-- Search + Filter -->
        <div class="adm-card mb-4">
            <div class="adm-card-body">
                <form th:action="@{/admin/san-pham}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small mb-1">Tìm kiếm</label>
                        <input type="text" name="keyword" class="form-control form-control-sm"
                               placeholder="Tên sản phẩm..." th:value="${keyword}" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small mb-1">Danh mục</label>
                        <select name="danhMuc" class="form-select form-select-sm">
                            <option value="">Tất cả</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.tenDanhMuc}"
                                    th:selected="${danhMuc == cat.id}">DM</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small mb-1">Trạng thái</label>
                        <select name="trangThai" class="form-select form-select-sm">
                            <option value="">Tất cả</option>
                            <option value="DANG_BAN" th:selected="${trangThai == 'DANG_BAN'}">Đang bán</option>
                            <option value="DAT_TRUOC" th:selected="${trangThai == 'DAT_TRUOC'}">Đặt trước</option>
                            <option value="NGUNG_BAN" th:selected="${trangThai == 'NGUNG_BAN'}">Ngừng bán</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                            <i class="bi bi-funnel me-1"></i>Lọc
                        </button>
                        <a th:href="@{/admin/san-pham}" class="btn btn-outline-secondary btn-sm" title="Xóa lọc">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="adm-table-wrap">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th><th class="text-center">Ảnh</th><th>Tên sản phẩm</th><th class="text-center">Danh mục</th><th class="text-center">Trạng thái</th><th class="text-center">Tồn kho</th><th class="text-center">Nổi bật</th><th class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td th:text="${p.id}" class="text-muted">1</td>
                        <td class="text-center">
                            <img th:if="${p.hinhAnhChinh}" th:src="@{${p.hinhAnhChinh}}" alt="" class="adm-thumb" />
                            <span th:unless="${p.hinhAnhChinh}" class="text-muted">—</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/san-pham/sua/{id}(id=${p.id})}" th:text="${p.tenSanPham}" class="text-decoration-none fw-semibold">Tên SP</a>
                        </td>
                        <td class="text-center text-muted" th:text="${categoryMap.get(p.danhMucId)}">Tên DM</td>
                        <td class="text-center">
                            <span th:if="${p.trangThaiSanPham == 'DANG_BAN'}" class="badge rounded-pill bg-success">Đang bán</span>
                            <span th:if="${p.trangThaiSanPham == 'DAT_TRUOC'}" class="badge rounded-pill bg-warning text-dark">Đặt trước</span>
                            <span th:if="${p.trangThaiSanPham == 'NGUNG_BAN'}" class="badge rounded-pill bg-secondary">Ngừng bán</span>
                        </td>
                        <td class="text-center">
                            <span th:text="${totalStock.get(p.id) != null ? totalStock.get(p.id) : 0}" 
                                  th:classappend="${totalStock.get(p.id) != null and totalStock.get(p.id) == 0 ? 'text-danger fw-bold' : 'fw-semibold'}"
                                  class="fw-semibold">0</span>
                        </td>
                        <td class="text-center">
                            <span th:if="${p.isFeatured}" class="text-success"><i class="bi bi-star-fill"></i></span>
                            <span th:unless="${p.isFeatured}" class="text-muted">—</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/san-pham/sua/{id}(id=${p.id})}" class="btn btn-outline-info btn-sm btn-icon me-1" title="Chi tiết"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/admin/san-pham/sua/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm btn-icon me-1" title="Sửa"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/san-pham/xoa/{id}(id=${p.id})}" method="post" style="display:inline" onsubmit="return confirm('Xóa sản phẩm này?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm btn-icon" title="Xóa"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="8" class="text-muted text-center py-5">Chưa có sản phẩm nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{view/admin/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${entityLabel}, ${url}, ${filterParams})}" />
    </div>
</body>
</html>
