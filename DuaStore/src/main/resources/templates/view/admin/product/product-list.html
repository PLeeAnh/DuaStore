<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý sản phẩm</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
        <li class="breadcrumb-item active" aria-current="page">Sản phẩm</li>
    </th:block>
    <div layout:fragment="content">
        <!-- ★ TODO [Sản phẩm]: Implement trang danh sách sản phẩm
             
             Cấu trúc gợi ý:
             1. Page header: adm-page-header với tiêu đề Sản phẩm + nút Thêm mới
             2. Bộ lọc: danh mục, trạng thái, giá, từ khóa tìm kiếm
             3. adm-table-wrap: table danh sách
                - Cột: #, Ảnh, Tên sản phẩm, Danh mục, Giá, SL, Trạng thái (badge), Thao tác
             4. Mỗi dòng nút Sửa (link tới form) / Xóa
             5. Nút nhỏ "Quản lý biến thể" cho mỗi sản phẩm
             6. Pagination
             
             Link sidebar active: th:classappend="${title == 'Sản phẩm' ? ' active' : ''}"
        -->
        <div class="adm-page-header">
            <h4><i class="bi bi-box me-2"></i>Sản phẩm</h4>
            <a th:href="@{/admin/product/them-moi}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>#</th><th>Ảnh</th><th>Tên sản phẩm</th><th>Danh mục</th><th>Giá</th><th>SL</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                    <tr><td colspan="8" class="text-muted text-center py-4">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </body>
</html>
