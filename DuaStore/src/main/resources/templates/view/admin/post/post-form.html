<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý bài viết — Form</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/bai-viet}">Bài viết</a></li>
        <li class="breadcrumb-item active" aria-current="page">Form</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-page-header">
            <h4><i class="bi bi-file-text me-2"></i>
                <span th:if="${post.id != null}">Sửa bài viết</span>
                <span th:unless="${post.id != null}">Thêm bài viết</span>
            </h4>
        </div>
        <div class="adm-form-wrap">
            <form th:action="@{${formAction}}" th:object="${post}" method="post" enctype="multipart/form-data" class="row g-3">
                <input type="hidden" th:field="*{id}" />
                <div class="col-md-8">
                    <label class="form-label">Tiêu đề <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{tieuDe}" class="form-control" required />
                    <div th:if="${#fields.hasErrors('tieuDe')}" th:errors="*{tieuDe}" class="text-danger small"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Tác giả</label>
                    <select th:field="*{tacGiaId}" class="form-select">
                        <option value="">-- Chọn --</option>
                        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.hoTen} + ' (' + ${u.username} + ')'"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Tóm tắt</label>
                    <textarea th:field="*{tomTat}" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Nội dung</label>
                    <textarea th:field="*{noiDung}" class="form-control" rows="15"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Ảnh đại diện</label>
                    <input type="file" th:name="hinhAnhFile" class="form-control" />
                    <div th:if="${post.hinhAnh != null}" class="mt-2">
                        <img th:src="@{${post.hinhAnh}}" alt="Thumb" style="max-height:80px;border-radius:4px;" />
                        <small class="text-muted d-block" th:text="${post.hinhAnh}"></small>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Trạng thái</label>
                    <select th:field="*{trangThai}" class="form-select">
                        <option value="NHAP">Nháp</option>
                        <option value="XUAT_BAN">Xuất bản</option>
                        <option value="AN">Ẩn</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu</button>
                    <a href="javascript:history.back()" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
    </body>
</html>
