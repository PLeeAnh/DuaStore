<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý bài viết</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Bài viết</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-page-header">
            <h4><i class="bi bi-file-text me-2"></i>Bài viết</h4>
            <a th:href="@{/admin/bai-viet/them-moi}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>
        <form th:action="@{/admin/bai-viet}" method="get" class="row g-2 mb-3">
            <div class="col-md-4">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm tiêu đề..." th:value="${keyword}" />
            </div>
            <div class="col-md-3">
                <select name="trangThai" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="NHAP" th:selected="${trangThai == 'NHAP'}">Nháp</option>
                    <option value="XUAT_BAN" th:selected="${trangThai == 'XUAT_BAN'}">Xuất bản</option>
                    <option value="AN" th:selected="${trangThai == 'AN'}">Ẩn</option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="danhMuc" class="form-select">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.tenDanhMuc}" th:selected="${danhMuc != null && danhMuc == cat.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-search me-1"></i>Lọc</button>
            </div>
        </form>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ảnh</th>
                        <th>Tiêu đề</th>
                        <th>Danh mục</th>
                        <th>Tác giả</th>
                        <th>Trạng thái</th>
                        <th>Nổi bật</th>
                        <th>Lượt xem</th>
                        <th>Ngày đăng</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p, iter : ${posts}">
                        <td th:text="${iter.index + 1 + currentPage * pageSize}"></td>
                        <td>
                            <img th:if="${p.hinhAnh != null}"
                                 th:src="@{${p.hinhAnh}}" alt=""
                                 style="width:50px;height:50px;object-fit:cover;border-radius:4px;"
                                 onerror="this.style.display='none'" />
                            <span th:unless="${p.hinhAnh != null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:text="${p.tieuDe}"></span>
                            <small th:if="${p.tomTat != null}" class="d-block text-muted" th:text="${p.tomTat}"></small>
                        </td>
                        <td th:text="${p.danhMuc != null ? p.danhMuc.tenDanhMuc : '—'}"></td>
                        <td th:text="${tacGiaMap.get(p.tacGiaId) != null ? tacGiaMap.get(p.tacGiaId) : '—'}"></td>
                        <td>
                            <span th:if="${p.trangThai == 'XUAT_BAN'}" class="badge bg-success">Xuất bản</span>
                            <span th:if="${p.trangThai == 'NHAP'}" class="badge bg-warning text-dark">Nháp</span>
                            <span th:if="${p.trangThai == 'AN'}" class="badge bg-secondary">Ẩn</span>
                        </td>
                        <td>
                            <span th:if="${p.featured}" class="text-success"><i class="bi bi-star-fill"></i></span>
                            <span th:unless="${p.featured}" class="text-muted">—</span>
                        </td>
                        <td th:text="${p.luotXem}"></td>
                        <td th:text="${#temporals.format(p.ngayTao, 'dd/MM/yyyy')}"></td>
                        <td>
                            <a th:href="@{/admin/bai-viet/sua/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/bai-viet/xoa/{id}(id=${p.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Xóa bài viết này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(posts)}">
                        <td colspan="10" class="text-muted text-center py-4">Chưa có dữ liệu</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{view/admin/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${entityLabel}, ${url}, ${filterParams})}" />
    </div>
    </body>
</html>
