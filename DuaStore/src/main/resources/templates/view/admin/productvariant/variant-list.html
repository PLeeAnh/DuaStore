<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý biến thể</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/product/danh-sach}">Sản phẩm</a></li>
        <li class="breadcrumb-item active" aria-current="page">Biến thể</li>
    </th:block>
    <div layout:fragment="content">
        <!-- ★ TODO [Biến thể]: Implement trang danh sách biến thể
             
             Cấu trúc gợi ý:
             1. Page header: adm-page-header với tiêu đề Biến thể + nút Thêm mới
             2. Bộ lọc: sản phẩm cha (select)
             3. adm-table-wrap: table danh sách
                - Cột: #, Ảnh, Sản phẩm, Màu, Kích thước, SKU, Giá, SL, Thao tác
             4. Mỗi dòng nút Sửa / Xóa
             5. Pagination
             
             Link sidebar active: th:classappend="${title == 'Biến thể' ? ' active' : ''}"
        -->
        <div class="adm-page-header">
            <h4><i class="bi bi-diagram-3 me-2"></i>Biến thể</h4>
            <a th:href="@{/admin/productvariant/them-moi}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>#</th><th>Sản phẩm</th><th>Màu</th><th>Kích thước</th><th>SKU</th><th>Giá</th><th>SL</th><th>Thao tác</th></tr></thead>
                <tbody>
                    <tr><td colspan="8" class="text-muted text-center py-4">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </body>
</html>
