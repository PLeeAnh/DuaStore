<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Cấu hình vận chuyển</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Vận chuyển</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                    <i class="bi bi-truck"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4>Cấu hình vận chuyển</h4>
                        <div class="adm-detail-meta">Cấu hình tùy chọn vận chuyển và tích hợp GHN.</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="adm-card">
            <div class="adm-card-body">
            <form th:action="@{/admin/van-chuyen}" method="post" class="row g-3">
                <div class="col-12">
                    <h6 class="fw-semibold border-bottom pb-2"><i class="bi bi-toggles me-1"></i>Tùy chọn vận chuyển</h6>
                </div>
                <div class="col-md-4">
                    <div class="form-check form-switch">
                        <input type="hidden" name="shipping_express" value="0" />
                        <input class="form-check-input" type="checkbox" name="shipping_express" value="1"
                               id="shippingExpress" th:checked="${settings.get('shipping_express') == '1'}" />
                        <label class="form-check-label" for="shippingExpress">Giao hàng nhanh</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-check form-switch">
                        <input type="hidden" name="shipping_standard" value="0" />
                        <input class="form-check-input" type="checkbox" name="shipping_standard" value="1"
                               id="shippingStandard" th:checked="${settings.get('shipping_standard') == '1'}" />
                        <label class="form-check-label" for="shippingStandard">Giao hàng tiêu chuẩn</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-check form-switch">
                        <input type="hidden" name="shipping_free" value="0" />
                        <input class="form-check-input" type="checkbox" name="shipping_free" value="1"
                               id="shippingFree" th:checked="${settings.get('shipping_free') == '1'}" />
                        <label class="form-check-label" for="shippingFree">Miễn phí vận chuyển</label>
                    </div>
                </div>
                <div class="col-12">
                    <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-cash me-1"></i>Phí vận chuyển</h6>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Phí giao hàng nhanh</label>
                    <input type="number" name="shipping_express_fee" class="form-control"
                           th:value="${settings.get('shipping_express_fee')}" placeholder="30000" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Phí giao hàng tiêu chuẩn</label>
                    <input type="number" name="shipping_standard_fee" class="form-control"
                           th:value="${settings.get('shipping_standard_fee')}" placeholder="15000" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Miễn phí khi đơn tối thiểu</label>
                    <input type="number" name="shipping_free_min" class="form-control"
                           th:value="${settings.get('shipping_free_min')}" placeholder="500000" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Thời gian giao hàng nhanh (giờ)</label>
                    <input type="text" name="shipping_express_time" class="form-control"
                           th:value="${settings.get('shipping_express_time')}" placeholder="2-4" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Thời gian giao tiêu chuẩn (ngày)</label>
                    <input type="text" name="shipping_standard_time" class="form-control"
                           th:value="${settings.get('shipping_standard_time')}" placeholder="3-5" />
                </div>
                <div class="col-12">
                    <h6 class="fw-semibold border-bottom pb-2 mt-4">
                        <i class="bi bi-box-seam me-1"></i>GHN (Giao Hàng Nhanh)
                    </h6>
                </div>
                <div class="col-md-6">
                    <label class="form-label">GHN Token <span class="text-danger">*</span>
                        <small class="text-muted">(<a href="https://ghn.vn" target="_blank">Đăng ký</a>)</small></label>
                    <input type="text" name="ghn_token" class="form-control font-monospace"
                           th:value="${settings.get('ghn_token')}" placeholder="Token từ GHN" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Shop ID</label>
                    <input type="number" name="ghn_shop_id" class="form-control"
                           th:value="${settings.get('ghn_shop_id')}" placeholder="Số shop" />
                </div>
                <div class="col-md-3">
                    <div class="form-check form-switch mt-4">
                        <input type="hidden" name="ghn_test_mode" value="false" />
                        <input class="form-check-input" type="checkbox" name="ghn_test_mode" value="true"
                               id="ghnTestMode" th:checked="${settings.get('ghn_test_mode') != 'false'}" />
                        <label class="form-check-label" for="ghnTestMode">Chế độ thử nghiệm (DEV)</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Mã quận/huyện mặc định</label>
                    <input type="number" name="ghn_default_district_id" class="form-control"
                           th:value="${settings.get('ghn_default_district_id')}" placeholder="1444" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Mã phường/xã mặc định</label>
                    <input type="text" name="ghn_default_ward_code" class="form-control"
                           th:value="${settings.get('ghn_default_ward_code')}" placeholder="21012" />
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu</button>
                </div>
            </form>
            </div>
        </div>
    </div>
    </body>
    </html>
