<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý Flash Sale — Form</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/flash-sale}">Flash Sale</a></li>
        <li class="breadcrumb-item active" aria-current="page">
            <span th:if="${flashSale.id != null}">Chỉnh sửa</span>
            <span th:unless="${flashSale.id != null}">Thêm mới</span>
        </li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div class="adm-icon-48">
                    <i class="bi bi-lightning-charge"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4><span th:if="${flashSale.id != null}">Chỉnh sửa Flash Sale</span><span th:unless="${flashSale.id != null}">Thêm Flash Sale</span></h4>
                        <div class="adm-detail-meta">Thiết lập chương trình flash sale cho sản phẩm.</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="adm-card">
            <div class="adm-card-body">
                <form th:action="@{/admin/flash-sale/save}" th:object="${flashSale}" method="post" data-dirty-bar class="row g-3">
                    <input type="hidden" th:field="*{id}" />

                    <div class="col-md-4">
                        <label class="form-label">Sản phẩm <span class="text-danger">*</span></label>
                        <select th:field="*{productId}" class="form-select searchable-select" required>
                            <option value="">-- Chọn sản phẩm --</option>
                            <option th:each="p : ${products}" th:value="${p.id}"
                                    th:text="${p.tenSanPham} + ' (' + ${p.trangThaiSanPham} + ')'">Sản phẩm</option>
                        </select>
                        <div th:if="${#fields.hasErrors('productId')}" th:errors="*{productId}" class="text-danger small"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá trị giảm (%) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" th:field="*{giaTriGiam}" class="form-control" required />
                        <div th:if="${#fields.hasErrors('giaTriGiam')}" th:errors="*{giaTriGiam}" class="text-danger small"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">&nbsp;</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="isActive" />
                            <label class="form-check-label" for="isActive">Kích hoạt</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ngày bắt đầu <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{ngayBatDau}" class="form-control" required />
                        <div th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}" class="text-danger small"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ngày kết thúc <span class="text-danger">*</span></label>
                        <input type="datetime-local" th:field="*{ngayKetThuc}" class="form-control" required />
                        <div th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}" class="text-danger small"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Số lượng tối đa</label>
                        <input type="number" th:field="*{soLuongToiDa}" class="form-control" />
                        <div th:if="${#fields.hasErrors('soLuongToiDa')}" th:errors="*{soLuongToiDa}" class="text-danger small"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Đã bán</label>
                        <input type="number" th:field="*{soLuongDaBan}" class="form-control" readonly />
                    </div>

                    <div class="col-12">
                        <a href="javascript:history.back()" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
                <div th:if="${errorMsg}" class="alert alert-danger mt-3" th:text="${errorMsg}"></div>
            </div>
        </div>
    </div>
</body>
</html>
