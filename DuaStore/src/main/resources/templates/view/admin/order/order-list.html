<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý đơn hàng</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
        <li class="breadcrumb-item active" aria-current="page">Đơn hàng</li>
    </th:block>
    <div layout:fragment="content">
        <!-- ★ TODO [Đơn hàng]: Implement trang danh sách đơn hàng
             
             Cấu trúc gợi ý:
             1. Page header: adm-page-header với tiêu đề Đơn hàng
             2. Bộ lọc: trạng thái (select), ngày, từ khóa
             3. adm-table-wrap: table danh sách
                - Cột: #, Mã ĐH, Khách hàng, SĐT, Tổng tiền, Trạng thái (badge màu), Ngày đặt, Thao tác
             4. Mỗi dòng nút Xem chi tiết
             5. Pagination
             
             Link sidebar active: th:classappend="${title == 'Đơn hàng' ? ' active' : ''}"
        -->
        <div class="adm-page-header">
            <h4><i class="bi bi-receipt me-2"></i>Đơn hàng</h4>
        </div>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>#</th><th>Mã ĐH</th><th>Khách hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày đặt</th><th>Thao tác</th></tr></thead>
                <tbody>
                    <tr><td colspan="7" class="text-muted text-center py-4">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </body>
</html>
