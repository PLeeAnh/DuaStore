<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý đơn hàng</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Đơn hàng</li>
    </th:block>
    <div layout:fragment="content">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
            <div class="d-flex align-items-center gap-2">
                <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Đơn hàng</h5>
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/don-hang(q=${q}, trangThai=${trangThai}, tatCa=false)}" class="btn" th:classappend="${not tatCa} ? 'btn-dark' : 'btn-outline-secondary'">Của tôi</a>
                    <a th:href="@{/admin/don-hang(q=${q}, trangThai=${trangThai}, tatCa=true)}" class="btn" th:classappend="${tatCa} ? 'btn-dark' : 'btn-outline-secondary'">Tất cả</a>
                </div>
            </div>
            <form class="d-flex gap-2" th:action="@{/admin/don-hang}" method="get">
                <input type="hidden" name="tatCa" th:value="${tatCa}" />
                <input type="text" name="q" class="form-control form-control-sm" style="width:180px" placeholder="Mã đơn, tên KH..." th:value="${q}" />
                <select name="trangThai" class="form-select form-select-sm" style="width:auto">
                    <option value="">Trạng thái đơn</option>
                    <option value="CHO_XAC_NHAN" th:selected="${trangThai == 'CHO_XAC_NHAN'}">Chờ xác nhận</option>
                    <option value="DA_XAC_NHAN" th:selected="${trangThai == 'DA_XAC_NHAN'}">Đã xác nhận</option>
                    <option value="DANG_GIAO" th:selected="${trangThai == 'DANG_GIAO'}">Đang giao</option>
                    <option value="DA_GIAO" th:selected="${trangThai == 'DA_GIAO'}">Đã giao</option>
                    <option value="DA_HOAN_THANH" th:selected="${trangThai == 'DA_HOAN_THANH'}">Đã hoàn thành</option>
                    <option value="DA_HUY" th:selected="${trangThai == 'DA_HUY'}">Đã hủy</option>
                </select>
                <select name="trangThaiTT" class="form-select form-select-sm" style="width:auto">
                    <option value="">Thanh toán</option>
                    <option value="CHUA_THANH_TOAN" th:selected="${trangThaiTT == 'CHUA_THANH_TOAN'}">Chưa thanh toán</option>
                    <option value="DA_THANH_TOAN" th:selected="${trangThaiTT == 'DA_THANH_TOAN'}">Đã thanh toán</option>
                    <option value="CONG_NO" th:selected="${trangThaiTT == 'CONG_NO'}">Công nợ</option>
                </select>
                <button type="submit" class="btn btn-sm btn-dark"><i class="bi bi-funnel"></i></button>
            </form>
        </div>

        <div class="adm-table-wrap">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã ĐH</th>
                        <th>Khách hàng</th>
                        <th>Tổng tiền</th>
                        <th style="min-width:120px">Trạng thái</th>
                        <th style="min-width:120px">Thanh toán</th>
                        <th>Ngày đặt</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o, iter : ${orders}">
                        <td class="text-muted small" th:text="${iter.index + 1 + currentPage * pageSize}"></td>
                        <td><strong th:text="${o.maDon}"></strong></td>
                        <td>
                            <span th:text="${o.tenNguoiNhan}"></span>
                            <small class="text-muted d-block" th:text="${o.soDienThoai}"></small>
                        </td>
                        <td th:text="${#numbers.formatDecimal(o.tongThanhToan, 0, 0)} + '₫'" class="fw-semibold"></td>
                        <td>
                            <span th:switch="${o.trangThaiDon}"
                                  class="badge fw-semibold px-2 py-1">
                                <span th:case="'CHO_XAC_NHAN'" class="badge bg-warning text-dark">Chờ xác nhận</span>
                                <span th:case="'DA_XAC_NHAN'" class="badge bg-primary">Đã xác nhận</span>
                                <span th:case="'DANG_GIAO'" class="badge bg-info text-dark">Đang giao</span>
                                <span th:case="'DA_GIAO'" class="badge bg-success">Đã giao</span>
                                <span th:case="'DA_HOAN_THANH'" class="badge bg-success">Đã hoàn thành</span>
                                <span th:case="'DA_HUY'" class="badge bg-danger">Đã hủy</span>
                                <span th:case="*" class="badge bg-secondary" th:text="${o.trangThaiDon}"></span>
                            </span>
                        </td>
                        <td>
                            <span th:switch="${o.trangThaiTT}"
                                  class="badge fw-semibold px-2 py-1">
                                <span th:case="'CHUA_THANH_TOAN'" class="badge bg-warning text-dark">Chưa thanh toán</span>
                                <span th:case="'DA_THANH_TOAN'" class="badge bg-success">Đã thanh toán</span>
                                <span th:case="*" class="badge bg-secondary" th:text="${o.trangThaiTT}"></span>
                            </span>
                        </td>
                        <td class="small" th:text="${#temporals.format(o.ngayDat, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/admin/don-hang/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary px-2 py-0">Chi tiết</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="8" class="text-muted text-center py-4">Chưa có đơn hàng</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <th:block th:replace="~{view/admin/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${entityLabel}, ${url}, ${filterParams})}" />
    </div>
    <th:block layout:fragment="scripts">
    </th:block>
    </body>
</html>
