<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head><title>Người dùng - Sửa</title></head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/nguoi-dung}">Người dùng</a></li>
        <li class="breadcrumb-item active" th:text="'Sửa: ' + ${user.hoTen}">Sửa</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                    <i class="bi bi-people"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4>Sửa người dùng</h4>
                        <div class="adm-detail-meta">Chỉnh sửa thông tin người dùng.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="adm-form-wrap">
            <form method="post" data-dirty-bar th:action="@{/admin/nguoi-dung/sua/{id}(id=${user.id})}" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control" th:value="${user.username}" readonly disabled />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mật khẩu</label>
                    <input type="text" class="form-control" value="••••••••" readonly disabled />
                    <small class="text-muted">Đổi mật khẩu tại trang cá nhân</small>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                    <input type="text" name="hoTen" class="form-control" th:value="${user.hoTen}" required maxlength="100" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" th:value="${user.email}" required maxlength="100" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input type="tel" name="soDienThoai" class="form-control" th:value="${user.soDienThoai}" maxlength="15" placeholder="090xxxxxxx" />
                </div>

                <div class="col-md-6 d-flex align-items-center pt-4">
                    <div class="form-check">
                        <input type="checkbox" name="isActive" class="form-check-input" value="true" id="isActive"
                               th:checked="${user.isActive}" />
                        <label class="form-check-label" for="isActive">Kích hoạt</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold mb-3">Vai trò</label>
                    <div class="d-flex gap-3 flex-wrap">
                        <div th:each="r : ${allRoles}" class="form-check">
                            <input type="checkbox" class="form-check-input"
                                   name="roleIds" th:value="${r.id}"
                                   th:id="'role-' + ${r.id}"
                                   th:checked="${user.roles != null and user.roles.contains(r)}" />
                            <label class="form-check-label" th:for="'role-' + ${r.id}"
                                   th:text="${r.name}">ROLE</label>
                        </div>
                    </div>
                </div>

                <div class="col-12 border-top pt-3">
                    <a href="javascript:history.back()" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
