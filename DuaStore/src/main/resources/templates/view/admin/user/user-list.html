<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">

    <head>
        <title>Quản lý người dùng</title>
    </head>

    <body>

    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Người dùng</li>
    </th:block>

    <div layout:fragment="content">

        <div class="adm-page-header">
            <h4><i class="bi bi-people me-2"></i>Người dùng</h4>
        </div>

        <div class="adm-table-wrap">
            <div class="d-flex align-items-center justify-content-between px-3 py-2" style="border-bottom:1px solid var(--ef-border)">
                <form class="d-flex align-items-center gap-2" method="get">
                    <select name="role" class="form-select form-select-sm" style="width:auto">
                        <option value="">Tất cả</option>
                        <option value="ADMIN" th:selected="${role == 'ADMIN'}">Admin</option>
                        <option value="USER" th:selected="${role == 'USER'}">Khách hàng</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Lọc</button>
                </form>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th>Ngày tạo</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}" th:unless="${#lists.isEmpty(users)}">
                        <td th:text="${u.id}">1</td>
                        <td><strong th:text="${u.username}">admin</strong></td>
                        <td th:text="${u.hoTen}">Admin</td>
                        <td th:text="${u.email}">admin@duastore.com</td>
                        <td th:text="${u.soDienThoai} ?: '--'">0900000000</td>
                        <td>
                            <span th:if="${u.role == 'ADMIN'}" class="badge bg-warning">Admin</span>
                            <span th:if="${u.role == 'USER'}" class="badge bg-secondary">Khách hàng</span>
                        </td>
                        <td>
                            <span th:if="${u.isActive}" class="badge bg-success">Hoạt động</span>
                            <span th:unless="${u.isActive}" class="badge bg-danger">Khóa</span>
                        </td>
                        <td style="font-size:.82rem;color:var(--ef-text-muted)" th:text="${#temporals.format(u.ngayTao, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td>
                            <form method="post" th:action="@{/admin/nguoi-dung/toggle-status}" style="display:inline">
                                <input type="hidden" name="id" th:value="${u.id}"/>
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${u.isActive} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:text="${u.isActive} ? 'Khóa' : 'Kích hoạt'"></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="9" class="text-center text-muted py-3">Không có người dùng nào</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-3" th:if="${totalPages > 1}">
            <ul class="pagination pagination-sm justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/nguoi-dung(page=${currentPage - 1}, role=${role})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/nguoi-dung(page=${i}, role=${role})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/nguoi-dung(page=${currentPage + 1}, role=${role})}">Sau</a>
                </li>
            </ul>
        </nav>

    </div>

</body>
</html>
