<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head><title>Người dùng - Tạo mới</title></head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/nguoi-dung}">Người dùng</a></li>
        <li class="breadcrumb-item active">Tạo mới</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                    <i class="bi bi-people"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4>Tạo tài khoản mới</h4>
                        <div class="adm-detail-meta">Thêm người dùng mới vào hệ thống.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="adm-form-wrap">
            <form method="post" data-dirty-bar th:action="@{/admin/nguoi-dung/tao-moi}" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control" required maxlength="50" placeholder="Nhập tên đăng nhập" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" required minlength="8" placeholder="Ít nhất 8 ký tự" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                    <input type="text" name="hoTen" class="form-control" required maxlength="100" placeholder="Nhập họ tên" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" required maxlength="100" placeholder="example@email.com" />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input type="tel" name="soDienThoai" class="form-control" maxlength="15" placeholder="090xxxxxxx" />
                </div>

                <div class="col-md-6 d-flex align-items-center pt-4">
                    <div class="form-check">
                        <input type="checkbox" name="isActive" class="form-check-input" value="true" id="isActive" checked />
                        <label class="form-check-label" for="isActive">Kích hoạt</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold mb-3">Vai trò</label>
                    <div class="d-flex gap-3 flex-wrap">
                        <div th:each="r : ${allRoles}" class="form-check">
                            <input type="checkbox" class="form-check-input"
                                   name="roleIds" th:value="${r.id}"
                                   th:id="'role-' + ${r.id}" />
                            <label class="form-check-label" th:for="'role-' + ${r.id}"
                                   th:text="${r.name}">ROLE</label>
                        </div>
                    </div>
                </div>

                <div class="col-12 border-top pt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Tạo tài khoản
                    </button>
                    <a href="javascript:history.back()" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
