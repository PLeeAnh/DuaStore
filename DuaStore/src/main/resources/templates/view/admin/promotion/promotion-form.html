<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý khuyến mãi — Form</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/khuyen-mai}">Khuyến mãi</a></li>
        <li class="breadcrumb-item active" aria-current="page">Form</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-detail-hero">
            <div class="d-flex align-items-start gap-3">
                <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">
                    <i class="bi bi-percent"></i>
                </div>
                <div class="flex-grow-1">
                    <div>
                        <h4><span th:if="${promotion.id != null}">Sửa khuyến mãi</span><span th:unless="${promotion.id != null}">Thêm khuyến mãi</span></h4>
                        <div class="adm-detail-meta">Tạo và quản lý chương trình khuyến mãi, mã giảm giá.</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="adm-card">
            <div class="adm-card-body">
            <form th:action="@{${formAction}}" th:object="${promotion}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}" />

                <h6 class="fw-semibold border-bottom pb-2 mt-2"><i class="bi bi-info-circle me-1"></i>Thông tin cơ bản</h6>
                <div class="col-md-6">
                    <label class="form-label">Tên chương trình <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{tenChuongTrinh}" class="form-control" required />
                    <div th:if="${#fields.hasErrors('tenChuongTrinh')}" th:errors="*{tenChuongTrinh}" class="text-danger small"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mã giảm giá <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="text" th:field="*{maCode}" class="form-control" required />
                        <button class="btn btn-outline-secondary" type="button" th:data-code="${promotion.maCode}"
                                onclick="copyPromoCode(this)" th:if="${promotion.id != null}"><i class="bi bi-clipboard"></i></button>
                    </div>
                    <div th:if="${#fields.hasErrors('maCode')}" th:errors="*{maCode}" class="text-danger small"></div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Loại giảm</label>
                    <select th:field="*{loaiGiam}" class="form-select">
                        <option value="PHAN_TRAM">%</option>
                        <option value="SO_TIEN">Số tiền</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Giá trị giảm</label>
                    <input type="number" step="0.01" th:field="*{giaTriGiam}" class="form-control" />
                    <div th:if="${#fields.hasErrors('giaTriGiam')}" th:errors="*{giaTriGiam}" class="text-danger small"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Đơn tối thiểu</label>
                    <input type="number" step="1000" th:field="*{donHangToiThieu}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Giảm tối đa</label>
                    <input type="number" step="1000" th:field="*{giamToiDa}" class="form-control" />
                </div>

                <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-tags me-1"></i>Phân loại</h6>
                <div class="col-md-3">
                    <label class="form-label">Loại voucher</label>
                    <select th:field="*{voucherType}" class="form-select">
                        <option value="VOUCHER">Voucher</option>
                        <option value="FREESHIP">Freeship</option>
                        <option value="MEMBER">Thành viên</option>
                        <option value="BIRTHDAY">Sinh nhật</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Ưu tiên</label>
                    <input type="number" th:field="*{priority}" class="form-control" />
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" th:field="*{stackable}" id="stackable" />
                        <label class="form-check-label" for="stackable">Có thể gộp</label>
                    </div>
                </div>

                <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-wallet2 me-1"></i>Giới hạn & Ngân sách</h6>
                <div class="col-md-3">
                    <label class="form-label">Ngân sách</label>
                    <input type="number" step="1000" th:field="*{budget}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Đã dùng ngân sách</label>
                    <input type="number" step="1000" th:field="*{usedBudget}" class="form-control" readonly />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tổng lượt tối đa</label>
                    <input type="number" th:field="*{maxClaims}" class="form-control" />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Lượt/người</label>
                    <input type="number" th:field="*{maxClaimsPerUser}" class="form-control" />
                </div>

                <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-crosshair me-1"></i>Nhắm mục tiêu</h6>
                <div class="col-md-3">
                    <label class="form-label">Loại mục tiêu</label>
                    <select th:field="*{targetType}" class="form-select" id="targetTypeSelect">
                        <option value="">Tất cả</option>
                        <option value="CATEGORY">Danh mục</option>
                        <option value="PRODUCT">Sản phẩm</option>
                    </select>
                </div>
                <div class="col-md-9" id="targetSelectorContainer">
                    <label class="form-label">Mục tiêu</label>
                    <select id="targetSelector" class="form-select" multiple style="min-height:120px"></select>
                    <input type="hidden" th:field="*{targetIds}" id="targetIds" />
                    <small class="text-muted">Chọn các mục tiêu áp dụng cho khuyến mãi</small>
                </div>

                <h6 class="fw-semibold border-bottom pb-2 mt-3"><i class="bi bi-clock me-1"></i>Thời gian & Trạng thái</h6>
                <div class="col-md-3">
                    <label class="form-label">Ngày bắt đầu <span class="text-danger">*</span></label>
                    <input type="datetime-local" name="tuNgay"
                           th:value="${promotion.tuNgay != null} ? ${#temporals.format(promotion.tuNgay, 'yyyy-MM-dd''T''HH:mm')} : ''"
                           class="form-control" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ngày kết thúc <span class="text-danger">*</span></label>
                    <input type="datetime-local" name="denNgay"
                           th:value="${promotion.denNgay != null} ? ${#temporals.format(promotion.denNgay, 'yyyy-MM-dd''T''HH:mm')} : ''"
                           class="form-control" required />
                </div>
                <div class="col-md-2">
                    <label class="form-label">Trạng thái</label>
                    <select th:field="*{isActive}" class="form-select">
                        <option value="true">Hoạt động</option>
                        <option value="false">Tạm dừng</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Lượt lưu</label>
                    <input type="text" class="form-control" th:value="${promotion.savedCount}" readonly />
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Lưu</button>
                    <a href="javascript:history.back()" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="extra-script">
    <script th:inline="javascript">
        /* ── Target multi-select ── */
        var targetData = {
            '': [],
            'CATEGORY': [[${categories}]].map(function(c) { return { value: c.id, text: c.tenDanhMuc }; }),
            'PRODUCT': [[${products}]].map(function(p) { return { value: p.id, text: p.tenSanPham }; })
        };

        var targetIds = '[[${promotion.targetIds}]]';
        var initialSelection = targetIds ? targetIds.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];

        var targetSelect = document.getElementById('targetSelector');
        var targetIdsInput = document.getElementById('targetIds');
        var targetTypeSelect = document.getElementById('targetTypeSelect');

        var ts = new TomSelect(targetSelect, {
            plugins: ['remove_button'],
            maxItems: null,
            onChange: function(values) {
                targetIdsInput.value = values.join(',');
            }
        });

        function populateTargetOptions() {
            var type = targetTypeSelect.value;
            var items = targetData[type] || [];
            ts.clear();
            ts.clearOptions();
            items.forEach(function(item) {
                ts.addOption(item);
            });
            ts.refreshOptions(false);
            if (type === '' || items.length === 0) {
                ts.disable();
                ts.input.style.minHeight = 'auto';
            } else {
                ts.enable();
                ts.input.style.minHeight = '120px';
                initialSelection.forEach(function(val) {
                    var match = items.find(function(i) { return String(i.value) === val; });
                    if (match) ts.addItem(match.value);
                });
            }
        }

        targetTypeSelect.addEventListener('change', function() {
            initialSelection = targetIdsInput.value ? targetIdsInput.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
            populateTargetOptions();
        });

        populateTargetOptions();
    </script>
    </th:block>
    </body>
</html>
