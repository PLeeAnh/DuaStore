<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý khuyến mãi</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
        <li class="breadcrumb-item active" aria-current="page">Khuyến mãi</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-page-header">
            <h4><i class="bi bi-percent me-2"></i>Khuyến mãi</h4>
            <a th:href="@{/admin/khuyen-mai/them-moi}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mt-2">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-2">
            <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên CT</th>
                        <th>Mã</th>
                        <th>Giá trị</th>
                        <th>SL còn</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p, iter : ${promotions}">
                        <td th:text="${iter.index + 1 + currentPage * 20}"></td>
                        <td th:text="${p.tenChuongTrinh}"></td>
                        <td><strong th:text="${p.maCode}"></strong></td>
                        <td th:text="${p.loaiGiam == 'PHAN_TRAM' ? p.giaTriGiam + '%' : p.giaTriGiam + ' VNĐ'}"></td>
                        <td th:text="${p.soLanDung - p.daDung}"></td>
                        <td>
                            <span th:if="${p.isActive}" class="badge bg-success">Hoạt động</span>
                            <span th:unless="${p.isActive}" class="badge bg-secondary">Tạm dừng</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/khuyen-mai/sua/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/khuyen-mai/xoa/{id}(id=${p.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Xóa khuyến mãi này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(promotions)}">
                        <td colspan="7" class="text-muted text-center py-4">Chưa có dữ liệu</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${totalPages > 1}" class="mt-3">
            <nav>
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? disabled">
                        <a class="page-link" th:href="@{/admin/khuyen-mai(page=${currentPage - 1})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? active">
                        <a class="page-link" th:href="@{/admin/khuyen-mai(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? disabled">
                        <a class="page-link" th:href="@{/admin/khuyen-mai(page=${currentPage + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    </body>
</html>
