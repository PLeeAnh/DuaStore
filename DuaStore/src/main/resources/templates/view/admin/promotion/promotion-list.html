<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net/thymeleaf/layout"
      layout:decorate="~{layout/admin/base}">
    <head>
        <title>Quản lý khuyến mãi</title>
    </head>
    <body>
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Khuyến mãi</li>
    </th:block>
    <div layout:fragment="content">
        <div class="adm-page-header">
            <h4><i class="bi bi-percent me-2"></i>Khuyến mãi</h4>
            <a th:href="@{/admin/khuyen-mai/them-moi}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Thêm mới
            </a>
        </div>
        <form th:action="@{/admin/khuyen-mai}" method="get" class="row g-2 mb-3">
            <div class="col-md-4">
                <input type="text" name="keyword" class="form-control form-control-sm" placeholder="Tìm tên CT hoặc mã..."
                       th:value="${keyword}" />
            </div>
            <div class="col-md-3">
                <select name="isActive" class="form-select form-select-sm">
                    <option value="">Tất cả trạng thái</option>
                    <option value="true" th:selected="${isActive != null and isActive}">Hoạt động</option>
                    <option value="false" th:selected="${isActive != null and !isActive}">Tạm dừng</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-sm btn-primary w-100"><i class="bi bi-search me-1"></i>Tìm</button>
            </div>
            <div class="col-md-2">
                <a th:href="@{/admin/khuyen-mai}" class="btn btn-sm btn-outline-secondary w-100">Xóa lọc</a>
            </div>
        </form>
        <div class="adm-table-wrap">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên CT</th>
                        <th>Mã</th>
                        <th>Giá trị</th>
                        <th>SL còn</th>
                        <th>Ngày BĐ</th>
                        <th>Ngày KT</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p, iter : ${promotions}">
                        <td th:text="${iter.index + 1 + currentPage * pageSize}"></td>
                        <td th:text="${p.tenChuongTrinh}"></td>
                        <td>
                            <strong th:text="${p.maCode}"></strong>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1 ms-1" style="font-size:.7rem"
                                    th:data-code="${p.maCode}" type="button" onclick="copyPromoCode(this)">Copy</button>
                        </td>
                        <td th:text="${p.loaiGiam == 'PHAN_TRAM' ? p.giaTriGiam + '%' : #numbers.formatDecimal(p.giaTriGiam, 0, 'POINT', 0, 'POINT') + '₫'}"></td>
                        <td th:text="${p.soLanDung != null ? p.soLanDung - p.daDung : 'Không giới hạn'}"></td>
                        <td th:text="${#temporals.format(p.tuNgay, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${#temporals.format(p.denNgay, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:if="${p.isActive}" class="badge bg-success">Hoạt động</span>
                            <span th:unless="${p.isActive}" class="badge bg-secondary">Tạm dừng</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/khuyen-mai/sua/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/khuyen-mai/xoa/{id}(id=${p.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Xóa khuyến mãi này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(promotions)}">
                        <td colspan="9" class="text-muted text-center py-4">Chưa có dữ liệu</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{view/admin/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, ${entityLabel}, ${url}, ${filterParams})}" />
    </div>
    </body>
</html>
