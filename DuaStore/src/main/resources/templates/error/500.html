<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>500 — Lỗi máy chủ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"/>
    <style>
        body { background: #0A0A0A; color: #F0F0F0; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: #141414; border: 1px solid #2A2A2A; border-radius: 16px; padding: 3rem; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 0 40px rgba(255,216,77,0.05); }
        .error-code { font-size: 5rem; font-weight: 700; color: #FFD84D; line-height: 1; margin-bottom: .5rem; }
        .error-icon { font-size: 2.5rem; color: #FFD84D; opacity: .6; }
        h5 { font-weight: 700; margin-bottom: .3rem; }
        p { color: #8A8A8A; font-size: .9rem; }
        .btn-primary { background: #FFD84D; border: none; color: #0A0A0A; font-weight: 600; padding: .6rem 1.5rem; border-radius: 8px; transition: all .2s; }
        .btn-primary:hover { background: #FFE066; box-shadow: 0 4px 15px rgba(255,216,77,0.3); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon mb-2"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="error-code">500</div>
        <h5>Lỗi máy chủ</h5>
        <p class="mb-4">Đã xảy ra lỗi. Vui lòng thử lại sau.</p>
        <a href="/" class="btn btn-primary"><i class="bi bi-house me-1"></i>Về trang chủ</a>
    </div>
</body>
</html>
